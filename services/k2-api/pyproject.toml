[project]
name = "k2-api"
version = "0.1.0"
description = "Read-only REST over the release's data products; every data read runs on Trino as the caller (services/k2-api/openapi.yaml)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.5",
    "pyyaml==6.0.4",  # the frozen openapi.yaml, served as JSON
    "trino==0.340.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.29.0",  # FastAPI's TestClient
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.uv]
package = false  # run from this directory: uvicorn k2api.app:app

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend = "../../ruff.toml"
target-version = "py312"  # the repo default is py39 for the Spark image; k2-api never runs there
