[project]
name = "k2gen"
version = "0.1.0"
description = "Data product contracts for the K2 lake: validated against ODCS v3 and lake.sql (ADR-032)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "jsonschema==4.26.0",
    "pyyaml==6.0.4",
]

[project.scripts]
k2gen = "k2gen.cli:main"

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
# k2gen/ sits beside this file, not under src/, so tests/conftest.py can put
# platform/k2gen on sys.path and import k2gen.ddl with nothing installed.
module-root = ""

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.ruff]
extend = "../../ruff.toml"
target-version = "py312"  # the repo default is py39 for the Spark image; k2gen never runs there
