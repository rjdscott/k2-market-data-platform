apiVersion: v3.2.0
kind: DataContract
id: market-capture.kafka-fixture.bronze_frames
name: bronze_frames
version: 1.0.0
domain: market-capture
description:
  purpose: >-
    Synthetic: the landing's trade frames, staged by offset, exactly the landing's nine columns
    (docs/development/phase-001-interfaces.md, "Bronze").
team:
  name: capture-team
schema:
  - id: bronze_frames
    name: bronze_frames
    physicalName: kafka_fixture.bronze_frames
    physicalType: table
    properties:
      - name: kafka_partition
        physicalType: integer
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: The topic partition.
      - name: kafka_offset
        physicalType: bigint
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: The record's offset.
      - name: kafka_timestamp
        physicalType: timestamp(6) with time zone
        required: true
        description: The record's timestamp.
        customProperties:
          - property: time
            value: event
      - name: record_key
        physicalType: varbinary
        description: The key's bytes as read.
      - name: record_value
        physicalType: varbinary
        required: true
        description: The value's bytes as read.
      - name: batch_id
        physicalType: varchar
        required: true
        description: The landing batch that landed the record.
      - name: landed_at
        physicalType: timestamp(6) with time zone
        required: true
        description: When that landing batch committed, UTC.
      - name: run_id
        physicalType: varchar
        required: true
        description: The run that landed the record.
      - name: release_id
        physicalType: varchar
        required: true
        description: That run's release.
customProperties:
  - property: layer
    value: bronze
  - property: build
    value: connector
  - property: backup
    value: rebuild
  - property: retention
    value: 7
