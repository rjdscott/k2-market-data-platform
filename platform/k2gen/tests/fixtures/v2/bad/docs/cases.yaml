  - code: docs.physical-name-mismatch
    changes:
      - {file: contracts/sensor-net/station-readings/silver_readings.odcs.yaml, set: schema/0/physicalName, value: station_readings.silver_values}
  - code: docs.domain-undeclared
    changes:
      - {file: contracts/domains.yaml, remove: domains/ops-insight}
  - code: docs.team-mismatch
    changes:
      - {file: contracts/ops-insight/daily-load/product.odps.yaml, set: team/name, value: sensor-team}
  # names
  - code: docs.domain-name-invalid
