      - {file: contracts/domains.yaml, set: domains/lake, value: {owner: platform-team, kind: consumer-aligned, description: Named as Trino's lake catalog.}}
  - code: docs.name-reserved-word
    changes:
      - {file: contracts/domains.yaml, set: domains/order, value: {owner: platform-team, kind: consumer-aligned, description: Named as a Trino reserved word.}}
  - code: docs.name-reserved-word
