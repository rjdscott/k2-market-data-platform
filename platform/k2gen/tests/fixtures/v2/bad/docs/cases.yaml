      - {file: contracts/sensor-net/station-readings/silver_readings.odcs.yaml, set: schema/0/quality/3, value: {metric: duplicateValues, arguments: {properties: [station_id]}, unit: percent, mustNotBeBetween: [50, 100], mustBeLessOrEqualTo: 10}}
      - {file: contracts/sensor-net/station-readings/silver_readings.odcs.yaml, set: schema/0/quality/4, value: {type: text, description: Readings are what the made-up feed sent.}}
  - why: a paused serving-only product whose port names its serving copy (ADR-057)
