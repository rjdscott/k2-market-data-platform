# Failing fixtures of k2gen.checks.docs (S05). Each case is the good set (fixtures/v2/good/) with
# its changes applied in order; the check must return findings of exactly the case's code, plus
# `also` where one rule implies another, every one an error. `valid` change sets must return no
# finding: the edges a rule must not fire on. tests/test_checks_docs.py runs them all and fails
# when a code of k2gen.checks.docs.CODES has no case.
#
# A change names `file`, a path in the set, and one of:
#   set: <keys and list indexes, slash-separated>, value: <v>   (an index one past the end appends)
#   remove: <keys and list indexes>
#   text: <the file's whole content>
#   delete: true
#   copy: <a path or a directory in the set>, copied to `file`
cases:
  # read and schemas first: a set that fails them stops there
  - code: docs.unreadable
    changes:
      - file: contracts/sensor-net/station-readings/grants.yaml
        text: "grants:\n  - principal: p.analyst-full\n    role: full_reader\n    role: delayed_reader\n"
  - code: docs.schema-invalid
    changes:
      - {file: contracts/ops-insight/daily-load/product.odps.yaml, remove: status}
  # places
  - code: docs.property-repeated
    changes:
      - {file: contracts/ops-insight/daily-load/gold_daily_load.odcs.yaml, set: customProperties/3, value: {property: backup, value: restore}}
  - code: docs.orphan-document
    changes:
      - {file: contracts/sensor-net/stray/grants.yaml, text: "grants: []\n"}
  - code: docs.product-misplaced
    changes:
      - {file: contracts/ops-insight/daily-load/product.odps.yaml, set: id, value: ops-insight.daily-loads}
  - code: docs.contract-misplaced
    changes:
