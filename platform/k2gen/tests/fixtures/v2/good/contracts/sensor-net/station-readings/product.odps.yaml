apiVersion: v1.1.0
kind: DataProduct
id: sensor-net.station-readings
name: station-readings
version: 1.0.0
status: active
domain: sensor-net
type: sourceAligned
description:
  purpose: Synthetic station readings, one typed row per reading, landed as the made-up feed sent them.
  limitations: Synthetic; no real station or measurement.
team:
  name: sensor-team
tags: [synthetic, weather]
support:
  - channel: sensor-team-requests
    url: "mailto:sensor-team@example.org"
    tool: email
    scope: issues
    description: Questions and access requests, answered by the made-up sensor team.
authoritativeDefinitions:
  - type: licence
    url: https://data.example.org/terms
outputPorts:
  - name: bronze_readings
    version: 1.0.0
    contractId: sensor-net.station-readings.bronze_readings
  - name: silver_readings
    version: 1.0.0
    contractId: sensor-net.station-readings.silver_readings
    inputContracts:  # a sibling, not an input port: the catalog's lineage edge bronze to silver
      - id: sensor-net.station-readings.bronze_readings
        version: 1.0.0
customProperties:
  - property: connector
    value:
      kind: https-file
      url: "https://data.example.org/readings/{{ds}}.csv"
      allowHosts: [data.example.org]
      format: csv
      parser: station_csv
  - property: schedule
    value:
      cron: "15 * * * *"
      timeoutMinutes: 10
  - property: terms
    value:
      redistribution: allowed
      attribution: "Source: a synthetic feed"
  - property: examples
    value:
      - description: The newest reading per station.
        sql: "SELECT station_id, max(read_at) FROM sensor_net.station_readings.silver_readings GROUP BY 1"
