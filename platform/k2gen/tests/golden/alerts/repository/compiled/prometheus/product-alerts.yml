              unless on (dag_id) (airflow_dagrun_duration_success_count{dag_id="currency_master"} unless airflow_dagrun_duration_success_count{dag_id="currency_master"} offset 21d))
            or absent_over_time(airflow_dagrun_duration_success_count{dag_id="currency_master"}[21d])
          )
          unless on (dag_id) (airflow_ti_running{dag_id="currency_master",task_id=~"maintain|compact"} > 0)
        for: 2m
        labels:
          severity: "warning"
          product: "reference-data.currency-master"
          dag_id: "currency_master"
          domain: "reference-data"
        annotations:
          summary: "reference-data.currency-master: no successful run in 21d"
          description: "No run of currency_master (0 5 * * 1, UTC) has succeeded in 21d and no maintain or compact task is running: the DAG is paused, held, failing or not being scheduled."
          runbook: docs/runbooks/airflow-scheduling.md

      - alert: ProductRunSlow_currency_master
        expr: |
          max by (dag_id) (
            increase(airflow_dagrun_duration_success_sum{dag_id="currency_master"}[7d]) / increase(airflow_dagrun_duration_success_count{dag_id="currency_master"}[7d])
              or (airflow_dagrun_duration_success_sum{dag_id="currency_master"} / airflow_dagrun_duration_success_count{dag_id="currency_master"} unless airflow_dagrun_duration_success_count{dag_id="currency_master"} offset 7d)
          ) > 483840
        labels:
          severity: "warning"
          product: "reference-data.currency-master"
          dag_id: "currency_master"
          domain: "reference-data"
        annotations:
          summary: "reference-data.currency-master: runs of DAG currency_master near its 10080-minute schedule interval (it has no timeout)"
          description: "The runs of currency_master that succeeded in the last 7d took on average over 483840 s, 80% of its 10080-minute schedule interval (it has no timeout)."
          runbook: docs/runbooks/airflow-scheduling.md

