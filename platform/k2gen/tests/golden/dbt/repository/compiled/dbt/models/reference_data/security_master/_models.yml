    - not_null
  - name: ws_name
    description: The websocket name as the listing spells it.
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: venue_symbol
    description: The spelling the rule composed; null when the name could not be split.
    data_type: varchar
  - name: held_reason
    description: claimed_twice or not_base_slash_quote (venue_symbol_claim.held_reason).
    data_type: varchar
    constraints:
