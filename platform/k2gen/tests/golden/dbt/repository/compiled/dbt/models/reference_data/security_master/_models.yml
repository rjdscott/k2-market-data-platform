version: 2
models:
- name: security_master__asset
  description: 'One row per canonical asset code that a published instrument buys or is priced in, with its kind and when
    a listing first showed it. No history: an asset''s code and kind do not change.'
  config:
    alias: asset
    meta:
      k2:
        contract: reference-data.security-master.asset
        reader: reference_data.security_master.asset
  columns:
  - name: asset_code
    description: The canonical code, upper case, a venue's older code already mapped (BTC, USD).
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - not_null
    - unique
  - name: kind
    description: fiat when the currency master lists the code as a circulating currency (not a fund, with minor units, so
      not a metal, the SDR or a testing code); stablecoin when seeds/stablecoins.csv lists it; else crypto.
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: first_seen_at
    description: The first fetch whose listing showed an instrument with this asset, in UTC.
    data_type: timestamp(6) with time zone
    constraints:
    - type: not_null
    data_tests:
    - not_null
  data_tests:
  - k2_quality:
      arguments:
        query: select count(*) from ${table} where kind <> 'fiat' and kind <> 'stablecoin' and kind <> 'crypto'
        holds: metric_value = 0
- name: security_master__instrument
  description: 'Type-2: one row per instrument of a venue and version of its listing, valid from valid_from up to but not
    including valid_to. A version is a change in the pair that lists it, its tick size, decimals, minimum order or status,
    or whether it is listed at all: a delisting closes the listed version and opens one with is_listed false, a relisting
    opens another.'
  config:
    alias: instrument
    meta:
      k2:
        contract: reference-data.security-master.instrument
        reader: reference_data.security_master.instrument
  columns:
  - name: venue
    description: The venue that lists the instrument (kraken).
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: instrument_id
    description: <base_asset>-<quote_asset> of canonical codes (BTC-USD); the same on every venue.
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: valid_from
    description: The fetch that first saw this version, in UTC; the instrument's first version opens at 1970-01-01 00:00:00
      UTC.
    data_type: timestamp(6) with time zone
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: valid_to
    description: The next version's valid_from; 9999-12-31 23:59:59 UTC on the open row, never null.
    data_type: timestamp(6) with time zone
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: recorded_at
    description: When the fetch that first saw this version ran, in UTC (knowledge time).
    data_type: timestamp(6) with time zone
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: base_asset
    description: The canonical code of the asset bought (asset.asset_code).
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: quote_asset
    description: The canonical code of the asset it is priced in, an asset.asset_code.
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: is_listed
    description: False while no pair of the venue lists the instrument; every listing attribute below is then null.
    data_type: boolean
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: pair_code
    description: The venue's REST code of the pair that lists it.
    data_type: varchar
  - name: tick_size
    description: The smallest price step.
    data_type: decimal(38,18)
  - name: pair_decimals
    description: Digits after the decimal point of a price.
    data_type: integer
  - name: lot_decimals
    description: Digits after the decimal point of a volume.
    data_type: integer
  - name: order_min
    description: The smallest order volume in the base asset.
    data_type: decimal(38,18)
  - name: status
    description: The pair's trading status as the venue states it (online, cancel_only and the like).
    data_type: varchar
  data_tests:
  - k2_unique_key:
      arguments:
        columns:
        - venue
        - instrument_id
        - valid_from
  - k2_quality:
      arguments:
        query: select count(*) from (select valid_to, lead(valid_from) over (partition by venue, instrument_id order by valid_from)
          as next_from from ${table}) as v where next_from < valid_to
        holds: metric_value = 0
  - k2_quality:
      arguments:
        query: select count(*) from (select valid_to, lead(valid_from) over (partition by venue, instrument_id order by valid_from)
          as next_from from ${table}) as v where valid_to < next_from
        holds: metric_value = 0
  - k2_quality:
      arguments:
        query: select count(*) from (select venue, instrument_id from ${table} group by venue, instrument_id having count_if(valid_to
          = timestamp '9999-12-31 23:59:59 UTC') <> 1) as k
        holds: metric_value = 0
  - k2_quality:
      arguments:
        query: select count(*) from (select venue, instrument_id from ${table} group by venue, instrument_id having min(valid_from)
          <> timestamp '1970-01-01 00:00:00 UTC') as k
        holds: metric_value = 0
  - k2_quality:
      arguments:
        query: select count(*) from ${table} where valid_from >= valid_to
        holds: metric_value = 0
