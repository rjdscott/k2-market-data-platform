        query: select count(*) from (select valid_to, lead(valid_from) over (partition by venue, venue_symbol order by valid_from)
          as next_from from ${table}) as v where next_from < valid_to
        holds: metric_value = 0
  - k2_quality:
      arguments:
        query: select count(*) from (select valid_to, lead(valid_from) over (partition by venue, venue_symbol order by valid_from)
          as next_from from ${table}) as v where valid_to < next_from
        holds: metric_value = 0
  - k2_quality:
      arguments:
        query: select count(*) from (select venue, venue_symbol from ${table} group by venue, venue_symbol having count_if(valid_to
          = timestamp '9999-12-31 23:59:59 UTC') <> 1) as k
        holds: metric_value = 0
  - k2_quality:
      arguments:
        query: select count(*) from (select venue, venue_symbol from ${table} group by venue, venue_symbol having min(valid_from)
          <> timestamp '1970-01-01 00:00:00 UTC') as k
        holds: metric_value = 0
  - k2_quality:
      arguments:
        query: select count(*) from ${table} where valid_to <= valid_from
        holds: metric_value = 0
- name: security_master__venue_symbol_claim
  description: 'One row per span in which a venue''s pair is listed with one set of attributes: the listing''s websocket name
    resolved by rule into canonical base and quote codes, the venue spelling and instrument id composed from them, and whether
    the claim is held. The one place the matching rule lives: instrument and venue_symbol publish the claims that are not
    held, and venue_symbol_held lists the ones that are.'
  config:
    alias: venue_symbol_claim
    meta:
      k2:
        contract: reference-data.security-master.venue_symbol_claim
        reader: reference_data.security_master.venue_symbol_claim
  columns:
  - name: venue
    description: The venue whose listing states the pair (kraken).
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: pair_code
    description: The pair's REST code in the venue's listing.
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: claimed_from
    description: The first fetch that stated this listing of the pair (the listing version's first_fetched_at), in UTC.
    data_type: timestamp(6) with time zone
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: claimed_to
    description: The pair's next listing version, changed or unlisted; 9999-12-31 23:59:59 UTC while none follows.
    data_type: timestamp(6) with time zone
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: ws_name
    description: The websocket name as the listing spells it.
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: base_asset
    description: 'The canonical base code: the websocket name''s part before its one slash, upper-cased, then mapped through
      seeds/code_exceptions.csv for the venue. Null when the name is not of the form base/quote.'
    data_type: varchar
  - name: quote_asset
    description: The canonical quote code, by the same rule from the part after the slash; null as base_asset is.
    data_type: varchar
  - name: venue_symbol
    description: base_asset/quote_asset, the spelling the venue's trades stream carries; null when either is.
    data_type: varchar
  - name: instrument_id
    description: base_asset-quote_asset, the canonical instrument id; null when either is.
    data_type: varchar
  - name: tick_size
    description: The smallest price step the listing states.
    data_type: decimal(38,18)
  - name: pair_decimals
    description: Digits after the decimal point of a price.
    data_type: integer
  - name: lot_decimals
    description: Digits after the decimal point of a volume.
    data_type: integer
  - name: order_min
    description: The smallest order volume in the base asset.
    data_type: decimal(38,18)
  - name: status
    description: The pair's trading status as the venue states it.
    data_type: varchar
  - name: held_reason
    description: 'Null for a claim that is published. claimed_twice: another pair of the venue claims the same venue_symbol
      over an overlapping span, so every claim of that spelling is held. not_base_slash_quote: the websocket name has no single
      slash to split.'
    data_type: varchar
  data_tests:
  - k2_unique_key:
      arguments:
        columns:
        - venue
        - pair_code
        - claimed_from
- name: security_master__venue_symbol_held
  description: 'The claims held from publication: every claim of a spelling two pairs of one venue claim at overlapping times,
    and every listing whose websocket name the rule cannot split. Other spellings and other venues publish as usual. Owner-only.'
  config:
    alias: venue_symbol_held
    meta:
      k2:
        contract: reference-data.security-master.venue_symbol_held
