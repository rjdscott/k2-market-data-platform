models:
- name: candles__ohlcv_1d
  description: 'One row per venue, instrument and one-day window holding at least one trade: its open, high, low, close, volume,
    quote volume and trade count over the window''s trades, duplicates excluded, the window half-open [window_start, window_end)
    in UTC. The day is the UTC day, from 00:00:00 UTC to the next, whatever time zone a reader sets.'
  config:
    alias: ohlcv_1d
    properties:
      partitioning: ARRAY['year(window_start)']
    unique_key:
    - venue
    - instrument_id
    - window_start
    meta:
      k2:
        contract: market-analytics.candles.ohlcv_1d
        reader: market_analytics.candles.ohlcv_1d
  columns:
  - name: venue
    description: The venue the trades happened on.
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: instrument_id
    description: The security master's instrument the trades are of.
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: window_start
    description: The window's first instant, inclusive, in UTC, at midnight.
    data_type: timestamp(6) with time zone
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: window_end
    description: 'The window''s end, exclusive, in UTC: window_start plus 1 day. Every trade counted has trade_ts before it,
      so the delayed_reader''s delay on it holds for every trade in the candle.'
    data_type: timestamp(6) with time zone
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: open
    description: 'The first trade''s price, first by trade_ts, ties broken by the venue row''s key (kafka_partition, kafka_offset,
      trade_ordinal): the capture''s order, as the archived candles broke ties by receive time and position in the frame.'
    data_type: decimal(38,18)
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: high
    description: The highest price.
    data_type: decimal(38,18)
    constraints:
    - type: not_null
    data_tests:
    - not_null
