    description: The lowest price.
    data_type: decimal(38,18)
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: close
    description: The last trade's price, in the order open uses.
    data_type: decimal(38,18)
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: volume
    description: The sum of the trades' quantities, in the base asset, exact.
    data_type: decimal(38,18)
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: quote_volume
    description: 'The sum of price times quantity, in the quote asset: each price rounded half up to 12 and each quantity
      to 10 fractional digits first, the sum to 18.'
    data_type: decimal(38,18)
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: trade_count
    description: The trades counted, each once (is_duplicate false).
    data_type: bigint
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: first_trade_at
    description: The earliest trade_ts counted.
    data_type: timestamp(6) with time zone
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: last_trade_at
    description: The latest trade_ts counted.
    data_type: timestamp(6) with time zone
    constraints:
    - type: not_null
    data_tests:
