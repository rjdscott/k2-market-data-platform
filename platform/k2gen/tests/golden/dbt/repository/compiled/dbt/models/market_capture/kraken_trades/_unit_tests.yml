  - name: rejected_keeps_each_frame_it_cannot_type_with_its_reason
    model: kraken_trades__silver_trade_rejected
    description: >-
      Silver holds offset 10, which is not read. Each other bad frame is kept once with its reason:
      not JSON (11), no data array (12), a trade without side (13), a price that is not a number
      (14), a good trade beside one without qty, which rejects the frame by its second trade (15),
      no frame type (18), a time that is not ISO 8601 (19). A subscribe acknowledgement (16) is no
      trade frame, and a frame whose symbol resolves to nothing (17) is held, not rejected.
    given:
      - input: ref('kraken_trades__silver_trade')
        format: sql
        rows: |
          select 0 as kafka_partition, cast(10 as bigint) as kafka_offset
      - input: source('kraken_trades', 'bronze_trade')
        format: sql
        rows: |
          select 0 as kafka_partition, cast(10 as bigint) as kafka_offset, cast(timestamp '2026-01-05 10:00:01 UTC' as timestamp(6) with time zone) as kafka_timestamp, to_utf8('{"channel":"trade","type":"update","data":[{"symbol"') as payload
          union all select 0, 11, timestamp '2026-01-05 10:00:02 UTC', to_utf8('{"channel":"trade","type":"update","data":[{"symbol"')
          union all select 0, 12, timestamp '2026-01-05 10:00:02 UTC', to_utf8('{"channel":"trade","type":"update"}')
          union all select 0, 13, timestamp '2026-01-05 10:00:02 UTC', to_utf8('{"channel":"trade","type":"update","data":[{"symbol":"AAA/ZZZ","price":10,"qty":1,"ord_type":"market","trade_id":3,"timestamp":"2026-01-05T10:00:00Z"}]}')
          union all select 0, 14, timestamp '2026-01-05 10:00:02 UTC', to_utf8('{"channel":"trade","type":"update","data":[{"symbol":"AAA/ZZZ","side":"buy","price":"ten","qty":1,"ord_type":"market","trade_id":4,"timestamp":"2026-01-05T10:00:00Z"}]}')
          union all select 0, 15, timestamp '2026-01-05 10:00:02 UTC', to_utf8('{"channel":"trade","type":"update","data":[{"symbol":"AAA/ZZZ","side":"buy","price":10,"qty":1,"ord_type":"market","trade_id":5,"timestamp":"2026-01-05T10:00:00Z"},{"symbol":"AAA/ZZZ","side":"buy","price":10,"ord_type":"market","trade_id":6,"timestamp":"2026-01-05T10:00:00Z"}]}')
          union all select 0, 16, timestamp '2026-01-05 10:00:02 UTC', to_utf8('{"method":"subscribe","result":{"channel":"trade","snapshot":true,"symbol":"AAA/ZZZ"},"success":true}')
          union all select 0, 17, timestamp '2026-01-05 10:00:02 UTC', to_utf8('{"channel":"trade","type":"update","data":[{"symbol":"QQQ/ZZZ","side":"buy","price":20,"qty":1,"ord_type":"market","trade_id":1,"timestamp":"2026-01-05T10:00:00Z"}]}')
          union all select 0, 18, timestamp '2026-01-05 10:00:02 UTC', to_utf8('{"channel":"trade","data":[{"symbol":"AAA/ZZZ","side":"buy","price":10,"qty":1,"ord_type":"market","trade_id":8,"timestamp":"2026-01-05T10:00:00Z"}]}')
          union all select 0, 19, timestamp '2026-01-05 10:00:02 UTC', to_utf8('{"channel":"trade","type":"update","data":[{"symbol":"AAA/ZZZ","side":"buy","price":10,"qty":1,"ord_type":"market","trade_id":9,"timestamp":"yesterday"}]}')
    expect:
      rows:
        - {kafka_offset: 11, reason: payload_not_json, kafka_timestamp: "2026-01-05 10:00:02 UTC"}
        - {kafka_offset: 12, reason: no_trade_array, kafka_timestamp: "2026-01-05 10:00:02 UTC"}
        - {kafka_offset: 13, reason: "field_missing:side", kafka_timestamp: "2026-01-05 10:00:02 UTC"}
        - {kafka_offset: 14, reason: "field_not_numeric:price", kafka_timestamp: "2026-01-05 10:00:02 UTC"}
        - {kafka_offset: 15, reason: "field_missing:qty", kafka_timestamp: "2026-01-05 10:00:02 UTC"}
        - {kafka_offset: 18, reason: "field_missing:type", kafka_timestamp: "2026-01-05 10:00:02 UTC"}
        - {kafka_offset: 19, reason: "field_not_timestamp:timestamp", kafka_timestamp: "2026-01-05 10:00:02 UTC"}

  - name: rejected_keeps_the_frame_byte_for_byte
    model: kraken_trades__silver_trade_rejected
    description: The payload is bronze's bytes as they were, not a re-encoding of what parsed.
    given:
