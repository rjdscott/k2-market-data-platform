  - name: unresolved_holds_no_frame_it_cannot_type
    model: kraken_trades__silver_trade_unresolved
    description: >-
      Offset 9's QQQ/ZZZ trade has no side: the frame cannot be typed, so it is rejected, not held,
      though its symbol resolves to nothing too. Offset 11, typed, with a symbol that resolves to
      nothing, is held. Neither is in silver.
    given:
      - input: ref('kraken_trades__silver_trade')
        format: sql
        rows: |
          select 0 as kafka_partition, cast(10 as bigint) as kafka_offset
      - input: source('kraken_trades', 'bronze_trade')
        format: sql
        rows: |
          select 0 as kafka_partition, cast(9 as bigint) as kafka_offset, cast(1767607201000000000 as bigint) as recv_ts_ns, cast('c1' as varchar) as conn_id, cast(9 as bigint) as conn_msg_seq, to_utf8('{"channel":"trade","type":"update","data":[{"symbol":"QQQ/ZZZ","price":20,"qty":1,"ord_type":"market","trade_id":1,"timestamp":"2026-01-05T10:00:00Z"}]}') as payload
          union all select 0, 11, 1767607201000000000, 'c1', 11, to_utf8('{"channel":"trade","type":"update","data":[{"symbol":"QQQ/ZZZ","side":"sell","price":20,"qty":1,"ord_type":"market","trade_id":2,"timestamp":"2026-01-05T10:00:00Z"}]}')
    expect:
      rows:
        - {kafka_offset: 11, trade_ordinal: 1, venue_symbol: QQQ/ZZZ, trade_id: 2}
