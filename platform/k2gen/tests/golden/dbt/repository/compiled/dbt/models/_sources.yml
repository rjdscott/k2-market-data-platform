version: 2
sources:
- name: calendars
  database: reference_data
  schema: calendars__base
  tables:
  - name: target_days
    description: One row per calendar day from 1 January 2025 to 31 December 2027, marked open or closed for TARGET. TARGET
      closes on Saturdays, Sundays, New Year's Day, Good Friday, Easter Monday, 1 May, 25 December and 26 December; every
      other day it is open.
    meta:
      k2:
        contract: reference-data.calendars.target_days
        tested_ref: audited
    columns:
    - name: calendar_date
      data_type: date
      description: The calendar day, one row each.
    - name: is_target_day
      data_type: boolean
      description: True when TARGET is open that day (a weekday that is not a closing day in the seed), the days the ECB publishes
        reference rates; false on a weekend or a closing day.
    - name: closing_reason
      data_type: varchar
      description: 'Why TARGET is closed: Saturday, Sunday, or the holiday''s name from the seed (Good Friday, Labour Day,
        ...). Null on a day TARGET is open. A holiday falling on a weekend reads as the weekend day, since the seed lists
        only the holidays that fall on weekdays.'
- name: currency_master
  database: lake
  schema: currency_master
  tables:
  - name: bronze_currencies
    description: One row per alphabetic currency code of one landed ISO 4217 list, as the parser read it; a code shared by
      several countries is one row. Each landed file adds its own rows.
    meta:
      k2:
        contract: reference-data.currency-master.bronze_currencies
        tested_ref: main
    columns:
    - name: code
      data_type: varchar
      description: The alphabetic code, three capital letters (EUR).
    - name: numeric_code
      data_type: varchar
      description: The numeric code, three digits as published, leading zeros kept (008).
    - name: name
      data_type: varchar
      description: The currency's name as the list writes it.
    - name: minor_units
      data_type: integer
      description: Digits after the decimal point (2 for EUR); null where the list says N.A.
    - name: is_fund
      data_type: boolean
      description: True when the list marks the entry a fund (IsFund), not a circulating currency.
    - name: source_file_sha256
      data_type: varchar
      description: The landed file's sha256, set by the connector on every row (its lineage).
- name: currency_master
  database: reference_data
  schema: currency_master__base
  tables:
  - name: currency
    description: One row per ISO 4217 alphabetic currency code that any landed list has held, with its numeric code, name,
      minor units and fund flag.
    meta:
      k2:
        contract: reference-data.currency-master.currency
        tested_ref: audited
    columns:
    - name: code
      data_type: varchar
      description: The alphabetic code, three capital letters (EUR); unique.
    - name: numeric_code
      data_type: varchar
      description: The numeric code, three digits, leading zeros kept (008).
    - name: name
      data_type: varchar
      description: The currency's name as the list writes it.
    - name: minor_units
      data_type: integer
      description: Digits after the decimal point (2 for EUR); null where the list says N.A.
    - name: is_fund
      data_type: boolean
      description: True when the list marks the entry a fund, not a circulating currency.
- name: ecb_fx_rates
  database: lake
  schema: ecb_fx_rates
  tables:
  - name: bronze_daily
    description: One row per fixing date and currency of one landed 90-day file, the rate the string the ECB published. Each
      landed file adds its own rows, so a date appears once per file that holds it.
    meta:
      k2:
        contract: fx-reference.ecb-fx-rates.bronze_daily
        tested_ref: main
    columns:
    - name: rate_date
      data_type: date
      description: The fixing's date (the file's Cube time), a TARGET day.
    - name: currency
      data_type: varchar
      description: The quoted currency's ISO 4217 code (USD); the base is always the euro.
    - name: rate
      data_type: varchar
      description: Units of the currency per one euro, the string exactly as published, such as 1.5000; typed in silver.
    - name: source_file_sha256
      data_type: varchar
      description: The landed file's sha256, set by the connector on every row (its lineage).
- name: kraken_instruments
  database: lake
  schema: kraken_instruments
  tables:
  - name: bronze_pairs
    description: One row per pair of one landed AssetPairs response, the listing attributes as the parser read them, tick
      size and minimum order the published strings. Each landed response adds a row for every pair it lists.
    meta:
      k2:
        contract: market-capture.kraken-instruments.bronze_pairs
        tested_ref: main
    columns:
    - name: pair_code
      data_type: varchar
      description: The pair's code, the key of the response's result object, as REST names the pair.
    - name: ws_name
      data_type: varchar
      description: The pair's websocket name (wsname), the symbol a trades stream frame carries; unique in one response.
    - name: base
      data_type: varchar
      description: The base asset's code as the venue spells it, its prefixes kept.
    - name: quote
      data_type: varchar
      description: The quote asset's code as the venue spells it, its prefixes kept.
    - name: tick_size
      data_type: varchar
      description: The smallest price step (tick_size), the published string; typed in silver.
    - name: pair_decimals
      data_type: integer
      description: Digits after the decimal point of a price (pair_decimals).
    - name: lot_decimals
      data_type: integer
      description: Digits after the decimal point of a volume (lot_decimals).
    - name: order_min
      data_type: varchar
      description: The smallest order volume in the base asset (ordermin), the published string; typed in silver.
    - name: status
      data_type: varchar
      description: The pair's trading status as the venue states it (online, cancel_only and the like).
    - name: fetched_at
      data_type: timestamp(6) with time zone
      description: 'When the fetch that brought the response ran (fetch.json''s fetchedAt), in UTC: lineage set by the connector
        on every row, as source_file_sha256 is, never by the parser.'
    - name: source_file_sha256
      data_type: varchar
      description: The landed response's sha256, set by the connector on every row (its lineage).
- name: kraken_instruments
  database: market_capture
  schema: kraken_instruments__base
  tables:
  - name: silver_listing
    description: 'One row per pair and version: a version is a run of fetches, in fetch time order, that state the same listing
      attributes for the pair, valid from the first fetch of the run. A refetch with no change adds no row, a changed tick
      size adds one, and a pair missing from a fetch after it was listed adds one row with is_listed false and no attributes.'
    meta:
      k2:
        contract: market-capture.kraken-instruments.silver_listing
        tested_ref: audited
    columns:
    - name: pair_code
      data_type: varchar
      description: The pair's REST code, the key of the response's result object.
    - name: first_fetched_at
      data_type: timestamp(6) with time zone
      description: 'The fetch time (bronze fetched_at) of the first fetch that stated this version, in UTC: the version is
        valid from it until the pair''s next version. Ordered by fetch time, never by when a response arrived in the lake.'
    - name: is_listed
      data_type: boolean
      description: False when this version is the pair's absence from the response, every attribute below but source_file_sha256
        null.
    - name: ws_name
      data_type: varchar
      description: The websocket name (wsname), the symbol a trades stream frame carries.
    - name: base
      data_type: varchar
      description: The base asset's code as the venue spells it.
    - name: quote
      data_type: varchar
      description: The quote asset's code as the venue spells it.
    - name: tick_size
      data_type: decimal(38,18)
      description: The smallest price step, the published string cast exactly.
    - name: pair_decimals
      data_type: integer
      description: Digits after the decimal point of a price.
    - name: lot_decimals
      data_type: integer
      description: Digits after the decimal point of a volume.
    - name: order_min
      data_type: decimal(38,18)
      description: The smallest order volume in the base asset, the published string cast exactly.
    - name: status
      data_type: varchar
      description: The pair's trading status as the venue states it.
    - name: source_file_sha256
      data_type: varchar
      description: The landed response that first stated this version (or the pair's absence).
