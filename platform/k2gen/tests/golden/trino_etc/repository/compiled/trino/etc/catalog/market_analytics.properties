# Compiled by k2gen (emit/trino_etc.py) from the release's documents. Never edited.
# Domain market-analytics (analytics-team): its reader catalog over warehouse market_analytics. Read-only
# at the connector, and no table statistics, so no plan and no SHOW STATS shows a bound of a
# row a reader may not see (ADR-061 part 1). pub_* holds `all` here for the definer-view owner
# check (rules.json); the connector refuses it every write all the same.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=market_analytics
# Static keys below; Lakekeeper's warehouses vend nothing.
iceberg.rest-catalog.vended-credentials-enabled=false
iceberg.security=read_only
iceberg.table-statistics-enabled=false
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=local-01
s3.path-style-access=true
s3.aws-access-key=${ENV:K2_TRINO_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:K2_TRINO_S3_SECRET_KEY}
