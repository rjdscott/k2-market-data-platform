# Compiled by k2gen (emit/trino_etc.py) from the release's documents. Never edited.
# Catalog lake: warehouse k2, the landings and bronze. Read-only at the connector: no
# commit of any kind, ALTER TABLE ... EXECUTE included, which file rules do not cover.
# Spark is its only writer.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=k2
# Static keys below; Lakekeeper's warehouses vend nothing.
iceberg.rest-catalog.vended-credentials-enabled=false
iceberg.security=read_only
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=local-01
s3.path-style-access=true
s3.aws-access-key=${ENV:K2_TRINO_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:K2_TRINO_S3_SECRET_KEY}
