# The data mesh domains (ADR-033). Each owns contracts/<domain>/ and is named in
# .github/CODEOWNERS. A domain with no product yet has no directory: it is
# declared here so its owner exists before its first contract does. No domain
# has a product today: the old lake ingest's products retired with it to
# legacy/v3-lake-ingest/ (ADR-056).
domains:
  market-capture:
    owner: capture-team
    kind: source-aligned
    description: >-
      What the venues send, landed as they sent it and then typed per venue.
  reference-data:
    owner: reference-data-team
    kind: source-aligned
    description: >-
      The security master: instrument and venue dimensions, type-2, from the
      instrument registry and the attributes a venue publishes.
  fx-reference:
    owner: fx-reference-team
    kind: source-aligned
    description: >-
      Foreign exchange reference rates as their publisher released them.
  market-analytics:
    owner: analytics-team
    kind: consumer-aligned
    description: >-
      Cross-venue products a researcher reads first, derived from the venues' data.
  governance:
    owner: platform-team
    kind: consumer-aligned
    description: >-
      What the platform records about the other domains' data rather than the data
      itself: quality results, control evidence and lineage. Its products read every
      other domain and no domain reads them (ADR-046).
