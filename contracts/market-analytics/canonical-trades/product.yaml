  One row per logical trade across every venue, the earliest delivery, in fixed point 1e-8
  like the wire and ClickHouse gold.
kind: consumer-aligned
lifecycle: draft
inputs:
  - table: silver.trades_binance
  - table: silver.trades_kraken
  - table: silver.trades_coinbase
