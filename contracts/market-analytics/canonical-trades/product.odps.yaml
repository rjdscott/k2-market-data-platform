# Every venue's trades in one shape: a union over the venue trades products' silver tables, each
# an input port read through k2_input at its tested snapshot, so a venue build whose tests failed
# never reaches here. Kraken is the only venue; adding one is an input port here and one union all
# branch in models/trades.sql.
apiVersion: v1.1.0
kind: DataProduct
id: market-analytics.canonical-trades
name: canonical-trades
version: 1.0.0
status: active
domain: market-analytics
type: consumerAligned
description:
  purpose: >-
    One row per trade and delivery from every venue, in one set of columns: the venue, the
    instrument the security master resolved, the trade's time, id, side, price and quantity, the
    venue's duplicate flag, and the venue row it came from.
  limitations: >-
    Kraken only. A row is a delivery, not a trade: a reader counting trades filters is_duplicate
    false, as the venue product's rows say. Each venue is read at the snapshot its own tests
    passed, never its untested main: a venue build that fails its tests leaves this product as it
    was. A venue paused, never audited or later than its maxLagMinutes adds nothing and the
    product shows partial with that venue named. The venues' terms of reuse are not yet recorded:
    the product stays owner-only until they are.
  usage: >-
    Read market_analytics.canonical_trades.trades with is_duplicate false for each trade once,
    keyed by (venue, kafka_partition, kafka_offset, trade_ordinal, trade_ts); venue plus the last
    four is the venue silver row it came from. Candles over these trades are
    market_analytics.candles.
team:
  name: analytics-team
inputPorts:
  - name: kraken_silver_trade
    version: 1.0.0
    contractId: market-capture.kraken-trades.silver_trade
    customProperties:
      - property: required
        value: false  # a venue paused or never audited makes this product partial, never failed
      - property: whenAbsent
        # I-4: trades is incremental, so zero rows of an absent venue add nothing and keep what is
        # here; the run records the venue with a null snapshot and the product shows partial
        value: empty
      - property: maxLagMinutes
        value: 15  # three of the venue's five-minute runs: a venue that has not published for that long is shown late
outputPorts:
  - name: trades
    version: 1.0.0
    contractId: market-analytics.canonical-trades.trades
    inputContracts:
      - id: market-capture.kraken-trades.silver_trade
        version: 1.0.0
customProperties:
  - property: schedule
    value:
      # Every five minutes at minutes 2, 7, 12 and so on: two minutes after each venue run starts
      # (*/5), so most builds read the venue's newest tested snapshot; one that has not published
      # yet is read on the next. The timeout is two periods, an engineering bound until the first
      # measured runs set it (W0-12, the soak's benchmark).
      cron: "2-59/5 * * * *"
      timeoutMinutes: 10
