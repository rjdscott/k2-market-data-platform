# Contract for lake.bronze.coinbase_level2. Columns live in docker/lake/ddl/lake.sql, the DDL of
# record; `k2gen validate` checks partitioning and sort against it.
apiVersion: v3.2.0
kind: DataContract
id: lake.bronze.coinbase_level2
name: bronze.coinbase_level2
version: 1.0.0
domain: market-capture
description:
  purpose: >-
    Coinbase Advanced Trade level2 channel frames, snapshot and update, one row per frame.
team:
  name: capture-team
schema:
  - name: coinbase_level2
    physicalName: bronze.coinbase_level2
    physicalType: table
    authoritativeDefinitions:
      - type: implementation
        url: docker/lake/ddl/lake.sql
    quality:
      - type: custom
        engine: k2-maintenance
        implementation: duplicate_identifiers
        description: >-
          No two rows share the identifier fields lake.sql declares.
      - type: custom
        engine: k2-maintenance
        implementation: bronze_unparseable
        description: >-
          Counts frames written with their venue columns NULL: the JSON did not parse as the
          declared shape.
      - type: custom
        engine: k2-maintenance
        implementation: bronze_schema_drift
        description: >-
          Keys the venue now sends that the table does not declare.
customProperties:
  - property: layer
    value: bronze
  - property: format
    value: iceberg
  - property: partitioning
    value: ["days(recv_ts)"]
  - property: sort
    value: ["symbol", "recv_ts_ns"]
  - property: classification
    value: internal
  - property: entitlement
    value: realtime
  - property: retention
    value: 7
  - property: upstreams
    value: ["raw.messages"]
  - property: schedule
    value: "1-59/5 * * * *"
  # No new data while the venue book_capture switch is off; the rows stay readable (ADR-050).
  - property: paused
    value: {since: "2026-11-26", adr: ADR-050}
