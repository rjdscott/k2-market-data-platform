# Contract for lake.bronze.kraken_book. Columns live in docker/lake/ddl/lake.sql, the DDL of
# record; `k2gen validate` checks partitioning and sort against it.
apiVersion: v3.2.0
kind: DataContract
id: lake.bronze.kraken_book
name: bronze.kraken_book
version: 1.0.0
domain: market-capture
description:
  purpose: >-
    Kraken v2 book channel frames, snapshot and update, one row per frame. The checksum is
    recorded as sent; silver verifies it.
team:
  name: capture-team
schema:
  - name: kraken_book
    physicalName: bronze.kraken_book
    physicalType: table
    authoritativeDefinitions:
      - type: implementation
        url: docker/lake/ddl/lake.sql
    quality:
      - type: custom
        engine: k2-maintenance
        implementation: duplicate_identifiers
        description: >-
          No two rows share the identifier fields lake.sql declares.
      - type: custom
        engine: k2-maintenance
        implementation: bronze_unparseable
        description: >-
          Counts frames written with their venue columns NULL: the JSON did not parse as the
          declared shape.
      - type: custom
        engine: k2-maintenance
        implementation: bronze_schema_drift
        description: >-
          Keys the venue now sends that the table does not declare.
customProperties:
  - property: layer
    value: bronze
  - property: format
    value: iceberg
  - property: partitioning
    value: ["days(recv_ts)"]
  - property: sort
    value: ["symbol", "recv_ts_ns"]
  - property: classification
    value: internal
  - property: entitlement
    value: realtime
  - property: retention
    value: 7
  - property: upstreams
    value: ["raw.messages"]
  - property: schedule
    value: "1-59/5 * * * *"
