apiVersion: v3.2.0
kind: DataContract
id: market-capture.kraken-trades.bronze_trade
name: bronze_trade
version: 1.0.0
domain: market-capture
description:
  purpose: >-
    One row per record of the raw Kraken topic whose envelope stream is trade, its RawMessage
    envelope decoded by the frame's writer schema id (I-1, 2026-11-28: Trino decodes no Avro, so
    silver reads these columns, never the frame's bytes, which stay in the landing): staged from
    lake.kraken_trades.landing by offset, so a retry or a kill between the landing commit and the
    stage adds no row twice and leaves no hole. The connector's audit (accounting, parses,
    keys_unique) passes before a batch publishes; parses fails a frame whose writer schema lacks
    an envelope column or types it otherwise, naming the column.
team:
  name: capture-team
schema:
  - id: bronze_trade
    name: bronze_trade
    physicalName: kraken_trades.bronze_trade
    physicalType: table
    properties:
      - name: kafka_partition
        physicalType: integer
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: The topic partition; with kafka_offset, the row's lineage to the landing and the topic.
      - name: kafka_offset
        physicalType: bigint
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: The record's offset in its partition.
      - name: kafka_timestamp
        physicalType: timestamp(6) with time zone
        description: The record's Kafka timestamp, set when the capture produced it.
      - name: schema_id
        physicalType: integer
        description: The frame's Confluent writer schema id, the registry's id for the RawMessage version that wrote it; null for a record that is not Confluent-framed, which the audit's parses fails.
      - name: exchange
        physicalType: varchar
        description: RawMessage.exchange, the venue identifier, decoded by the writer schema.
      - name: stream
        physicalType: varchar
        description: RawMessage.stream, the subscription the frame arrived on; trade for every row the filter kept.
      - name: symbol
        physicalType: varchar
        description: RawMessage.symbol, the instrument as the venue spells it; null for a frame of no single instrument.
      - name: recv_ts_ns
        physicalType: bigint
        description: RawMessage.recv_ts_ns, the capture's receive time, nanoseconds since the Unix epoch.
      - name: conn_id
        physicalType: varchar
        description: RawMessage.conn_id, the WebSocket connection the frame arrived on.
      - name: conn_msg_seq
        physicalType: bigint
        description: RawMessage.conn_msg_seq, the capture's counter of frames on conn_id, from 1.
      - name: payload
        physicalType: varbinary
        description: RawMessage.payload, the venue's frame byte for byte as it came off the socket.
      - name: batch_id
        physicalType: varchar
        description: The landing batch that landed the record, its k2.batch-id.
      - name: landed_at
        physicalType: timestamp(6) with time zone
        description: When that landing batch committed, UTC.
      - name: run_id
        physicalType: varchar
        description: The run that landed the record, <dag_id>/<run_id>.
      - name: release_id
        physicalType: varchar
        description: The release that run resolved at its start.
customProperties:
  - property: layer
    value: bronze
  - property: build
    value: connector
  - property: backup
    value: rebuild  # restaged from the landing, which the backup set keeps as restore
