# Everyone who may call Trino or k2-api (A10), people under pseudonymous ids. No credential and
# no hash of one is ever written here: `make password` puts a bcrypt line in
# ${K2_SECRETS}/trino/password.db and `make api-key` a sha256 in ${K2_SECRETS}/api/keys.json,
# outside any checkout (docs/runbooks/create-or-rotate-a-principal.md). The release canary,
# k2_release_<setSha256[:12]>, is not declared: each release makes its own (model.canary_user).
principals:
  # The platform's own services, each logging in to Trino with a password file it mounts.
  - id: svc.runs
    kind: service
    owner: platform-team
    description: Writes the run records through governance_build; the dbt wrapper's third identity.
  - id: svc.catalog
    kind: service
    owner: platform-team
    description: Reads the run-time facts the catalog shows (newest audited publish, tests, freshness) from the run records.
  - id: svc.platform
    kind: service
    owner: platform-team
    description: Runs deploy DDL and Trino-side table maintenance; holds no privilege in a reader namespace.
  - id: svc.api
    kind: service
    owner: platform-team
    description: k2-api's one Trino identity, which runs every data request as its caller.
  # The one exception: the operator's own login, from the host alone. Its password file is mounted
  # into no service and no one-shot (tests/test_hold.py), so nothing holding svc.runs's password,
  # a DAG, a one-shot or a dbt model, can end or forge a hold.
  - id: svc.operator
    kind: service
    owner: platform-team
    description: Appends the holds and their releases through governance_build (make hold, make unhold, the rebuild and restore locks), INSERT on that one table alone; reads them read-only through governance.
  # The access canary's builder and publisher (model.builder, model.publisher).
  - id: dbt_access_canary
    kind: service
    owner: platform-team
    description: Builds governance.access_canary__base; holds no GRANT_SELECT.
  - id: pub_access_canary
    kind: service
    owner: platform-team
    description: Owns the canary's reader view and moves its audited tag.
  # Builders a row of tests/access/expectations.yaml expects to succeed as (a row as an undeclared
  # principal may only expect a denial): each reads its own bronze or input port there. Declaring
  # a dbt_<fence> changes no rule; its product's build gives it its rights (emit/trino_rules.py).
  - id: dbt_kraken_trades
    kind: service
    owner: capture-team
    description: Builds market-capture.kraken-trades' silver tables from its bronze and the security master's venue_symbol.
  - id: dbt_canonical_trades
    kind: service
    owner: analytics-team
    description: Builds market-analytics.canonical-trades from kraken-trades' tested silver_trade.
  - id: dbt_candles
    kind: service
    owner: analytics-team
    description: Builds market-analytics.candles from canonical-trades' tested trades.
  # The access canary's readers, one per role (contracts/governance/access-canary/grants.yaml).
  - id: p.canary-full
    kind: person
    owner: platform-team
    description: A made-up reader holding full_reader on the access canary.
  - id: p.canary-delayed
    kind: person
    owner: platform-team
    description: A made-up reader holding delayed_reader on the access canary.
  - id: p.canary-scoped
    kind: person
    owner: platform-team
    description: A made-up reader holding public_reader, row-scoped to region north, on the access canary.
  # Lab readers of real products, each granted in its product's grants.yaml.
  - id: p.analyst-a
    kind: person
    owner: platform-team
    description: A named analyst reader used by the phase 003 REST checks; holds full_reader on ECB gold.
  # A partner's reader (plan 004), a service logging in to Trino over SQL; svc.api impersonates
  # p.* alone, so it has no REST path. It holds no role until the owner records Kraken's terms
  # (contracts/market-capture/kraken-trades/grants.yaml), so it reaches nothing. Deploy's preflight
  # needs no password for it (scripts/deploy.py required_secrets); the operator makes one with
  # make password PRINCIPAL=svc.partner-dashboard when the grant lands.
  - id: svc.partner-dashboard
    kind: service
    owner: platform-team
    description: A partner dashboard's Trino login, to hold delayed_reader on kraken-trades' silver_trade once the venue's terms are recorded.
