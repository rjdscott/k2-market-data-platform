#   vulnerabilities:
#     - id: CVE-YYYY-NNNNN
#       paths: ["services/capture-rust/Cargo.lock"]
#       statement: why this is accepted, and what would fix it
#       expired_at: YYYY-MM-DD
vulnerabilities: []
