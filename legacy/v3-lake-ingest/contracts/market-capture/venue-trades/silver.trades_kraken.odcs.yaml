# Contract for lake.silver.trades_kraken. Columns live in docker/lake/ddl/lake.sql, the DDL of
# record; `k2gen validate` checks partitioning and sort against it.
apiVersion: v3.2.0
kind: DataContract
id: lake.silver.trades_kraken
name: silver.trades_kraken
version: 1.0.0
domain: market-capture
description:
  purpose: >-
    Kraken trades typed from bronze.kraken_trade, one row per trade in the frame.
team:
  name: capture-team
schema:
  - name: trades_kraken
    physicalName: silver.trades_kraken
    physicalType: table
    authoritativeDefinitions:
      - type: implementation
        url: docker/lake/ddl/lake.sql
    quality:
      - type: custom
        engine: k2-maintenance
        implementation: duplicate_identifiers
        description: >-
          No two rows share the identifier fields lake.sql declares.
      - type: custom
        engine: k2-maintenance
        implementation: silver_parity
        description: >-
          Every trade in the bronze frames is a row here, at the bronze snapshot this table
          last read.
      - type: custom
        engine: k2-maintenance
        implementation: silver_flags
        description: >-
          Replay and gap rates, published as numbers. Informational: it has no pass or fail.
customProperties:
  - property: layer
    value: silver
  - property: format
    value: iceberg
  - property: partitioning
    value: ["days(exchange_ts)"]
  - property: sort
    value: ["canonical_symbol", "exchange_ts"]
  - property: classification
    value: internal
  - property: entitlement
    value: realtime
  - property: retention
    value: 7
  - property: upstreams
    value: ["bronze.kraken_trade", "config/instruments.yaml"]
  - property: schedule
    value: "1-59/5 * * * *"
