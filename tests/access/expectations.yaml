# Hand-written access expectations (A9), reviewed by the owner and never generated from the rules
# they test (tests/access/README.md says how to write one). make access-verify (step S20) runs
# every row, in this order, as the principal it names, and a row passes only on the exact outcome
# it states: "denied" is an access denial, never a syntax error or a missing table.
#
# These are the access canary's (contracts/governance/access-canary/): at build its seed rows 1
# (north) and 4 (south) are a day old, 2 (north) 21 minutes, 3 (north) and 5 (south) 1 minute.
# Any other id is not from the seed, so it was never tested. The delayed rows need a canary build
# that passed in the last 19 minutes (its 10-minute schedule); a stale canary fails them, it never
# passes them. Each read row's mustAppear names the rows its reader must see, so a canary that
# built no rows fails.
#
# The repository's only other product, market-analytics.hot-gold, is a paused serving copy with
# no Trino name and no grant (its grants.yaml), so it has nothing to grant and no row. There is no
# second dbt product yet, so no other product's publisher exists to try serving these rows; that
# row comes with the second product. An impersonation that must SUCCEED can be written since the
# `ok` outcome exists, and a denial row may name a user no document declares, but the runner does
# not run such a row yet (tests/access/README.md): both are still proven by the rules test
# (scripts/trino_rules_test.py, rows "impersonation" and "strangers").
expectations:
  # Readers see the tagged rows only, each with its role's policy.
  - principal: p.canary-full
    table: governance.access_canary.events
    via: [sql]
    visible: [id, region, note, event_ts]
    mustNotAppear: "id NOT IN (1, 2, 3, 4, 5)"
    mustAppear: {where: "id IN (1, 2, 3, 4, 5)", minRows: 5}
  - principal: p.canary-delayed
    table: governance.access_canary.events
    via: [sql]
    visible: [id, region, note, event_ts]
    masked: [note]
    minRowAgeMinutes: 20
    mustNotAppear: "id NOT IN (1, 2, 4)"
    mustAppear: {where: "id IN (1, 2, 4)", minRows: 3}
  - principal: p.canary-scoped
    table: governance.access_canary.events
    via: [sql]
    visible: [id, region, note, event_ts]
    mustNotAppear: "id NOT IN (1, 2, 3)"
    mustAppear: {where: "id IN (1, 2, 3)", minRows: 3}

  # Every base path is refused to every reader: the table and its metadata tables (gate h1.08).
  - {principal: p.canary-full, table: governance.access_canary__base.events, denied: true}
  - {principal: p.canary-delayed, table: governance.access_canary__base.events, denied: true}
  - {principal: p.canary-scoped, table: governance.access_canary__base.events, denied: true}
  # The seed's own table sits in the base beside events (model.dbt_seed): refused like it.
  - {principal: p.canary-full, table: governance.access_canary__base.event_offsets, denied: true}
  - {principal: p.canary-delayed, table: governance.access_canary__base.event_offsets, denied: true}
  - {principal: p.canary-scoped, table: governance.access_canary__base.event_offsets, denied: true}
  - {principal: p.canary-delayed, table: "governance.access_canary__base.events$snapshots", denied: true}
  - {principal: p.canary-delayed, table: "governance.access_canary__base.events$files", denied: true}
  - {principal: p.canary-delayed, table: "governance.access_canary__base.events$history", denied: true}
  - {principal: p.canary-delayed, table: "governance.access_canary__base.events$partitions", denied: true}
  - {principal: p.canary-delayed, table: "governance.access_canary__base.events$refs", denied: true}
  - {principal: p.canary-delayed, table: "governance.access_canary__base.events$manifests", denied: true}
  - {principal: p.canary-delayed, table: "governance.access_canary__base.events$all_manifests", denied: true}
  - {principal: p.canary-delayed, table: "governance.access_canary__base.events$properties", denied: true}
  - {principal: p.canary-delayed, table: "governance.access_canary__base.events$metadata_log_entries", denied: true}
  - {principal: p.canary-delayed, table: "governance.access_canary__base.events$entries", denied: true}
  - {principal: p.canary-delayed, table: "governance.access_canary__base.events$all_entries", denied: true}
  # The two metadata tables that name snapshot ids and tags, for the other two readers too.
  - {principal: p.canary-full, table: "governance.access_canary__base.events$refs", denied: true}
  - {principal: p.canary-full, table: "governance.access_canary__base.events$snapshots", denied: true}
  - {principal: p.canary-scoped, table: "governance.access_canary__base.events$refs", denied: true}
  - {principal: p.canary-scoped, table: "governance.access_canary__base.events$snapshots", denied: true}
  # The base by its tag, by an old time, described, its statistics, its DDL: all refused.
  - {principal: p.canary-full, sql: "SELECT * FROM governance.access_canary__base.events FOR VERSION AS OF 'audited'", expect: denied}
  - {principal: p.canary-full, sql: "SELECT * FROM governance.access_canary__base.events FOR TIMESTAMP AS OF current_timestamp - INTERVAL '1' SECOND", expect: denied}
  - {principal: p.canary-full, sql: "DESCRIBE governance.access_canary__base.events", expect: denied}
  - {principal: p.canary-full, sql: "SHOW STATS FOR governance.access_canary__base.events", expect: denied}
  - {principal: p.canary-full, sql: "SHOW CREATE TABLE governance.access_canary__base.events", expect: denied}
  - {principal: p.canary-full, sql: "SELECT * FROM TABLE(governance.system.table_changes('access_canary__base', 'events', 0, 1))", expect: denied}
  # Readers never reach the writer catalog, the base or the view through it.
  - {principal: p.canary-full, table: governance_build.access_canary__base.events, denied: true}
  - {principal: p.canary-delayed, table: governance_build.access_canary.events, denied: true}
  # A reader sees the view's columns, never how it is built.
  - {principal: p.canary-full, sql: "SHOW CREATE VIEW governance.access_canary.events", expect: denied}

  # No time travel on the view (h1.09) and no statistics for readers (h1.20, h1.23, h1.24).
  - {principal: p.canary-full, sql: "SELECT * FROM governance.access_canary.events FOR VERSION AS OF 1", expect: error}
  - {principal: p.canary-full, sql: "SELECT * FROM governance.access_canary.events FOR TIMESTAMP AS OF current_timestamp - INTERVAL '1' SECOND", expect: error}
  - {principal: p.canary-full, sql: "SHOW STATS FOR governance.access_canary.events", expect: noBounds}
  - {principal: p.canary-delayed, sql: "SET SESSION governance.statistics_enabled = true", expect: denied}
  - {principal: p.canary-delayed, sql: "SELECT count(*) FROM governance.access_canary.events", session: {governance.statistics_enabled: "true"}, expect: denied}
  - {principal: p.canary-scoped, sql: "SET SESSION governance.statistics_enabled = true", expect: denied}
  - {principal: p.canary-full, sql: "SELECT count(*) FROM governance.access_canary.events", session: {governance.statistics_enabled: "true"}, expect: denied}

  # Only the publisher changes the view; it still writes nothing through the reader catalog
  # (h1.02, h1.12, h1.19, h1.33).
  - {principal: dbt_access_canary, sql: "CREATE OR REPLACE VIEW governance_build.access_canary.events AS SELECT 1 x", expect: denied}
  - {principal: dbt_access_canary, sql: "DROP VIEW governance_build.access_canary.events", expect: denied}
  - {principal: dbt_access_canary, sql: "CREATE TABLE governance_build.access_canary.planted AS SELECT * FROM governance_build.access_canary__base.events", expect: denied}
  - {principal: svc.platform, sql: "CREATE OR REPLACE VIEW governance_build.access_canary.events AS SELECT 1 x", expect: denied}
  - {principal: pub_access_canary, sql: "CREATE VIEW governance_build.access_canary.planted SECURITY DEFINER AS SELECT id FROM governance.access_canary__base.events", expect: denied}
  - {principal: pub_access_canary, sql: "ALTER VIEW governance_build.access_canary.events SET AUTHORIZATION USER \"svc.platform\"", expect: denied}
  - {principal: pub_access_canary, sql: "INSERT INTO governance.access_canary__base.events SELECT * FROM governance.access_canary__base.events", expect: denied}
  - {principal: pub_access_canary, sql: "CALL governance.system.rollback_to_snapshot('access_canary__base', 'events', 1)", expect: denied}
  # Nobody on the pipeline side reads the reader view: not its builder, not the operator.
  - {principal: dbt_access_canary, table: governance.access_canary.events, denied: true}
  - {principal: svc.platform, table: governance.access_canary.events, denied: true}
  # A builder's definer view, planted by the test under a name no rule grants, is denied (h1.31).
  # access-verify plants it through the catalog API just before this row and removes it after.
  - {principal: p.canary-full, table: governance.access_canary.foreign_view, denied: true}

  # Impersonation: nobody becomes a principal the rules do not let them become (SET SESSION
  # AUTHORIZATION is checked against the impersonation rules). k2-api's svc.api may become a
  # declared person only, never a builder or a platform service; nobody else becomes anyone.
  - {principal: svc.api, sql: "SET SESSION AUTHORIZATION \"dbt_access_canary\"", expect: denied}
  - {principal: svc.api, sql: "SET SESSION AUTHORIZATION \"pub_access_canary\"", expect: denied}
  - {principal: svc.api, sql: "SET SESSION AUTHORIZATION \"svc.platform\"", expect: denied}
  - {principal: svc.platform, sql: "SET SESSION AUTHORIZATION \"p.canary-full\"", expect: denied}
  - {principal: pub_access_canary, sql: "SET SESSION AUTHORIZATION \"p.canary-full\"", expect: denied}
  - {principal: p.canary-full, sql: "SET SESSION AUTHORIZATION \"p.canary-delayed\"", expect: denied}

  # Query history, which holds every query's text, is the operator's alone (h1.03). The operator's
  # row comes after the readers' rows above, so it must find one of their queries.
  - {principal: p.canary-full, table: system.runtime.queries, denied: true}
  - {principal: svc.api, table: system.runtime.queries, denied: true}
  - {principal: dbt_access_canary, table: system.runtime.queries, denied: true}
  - {principal: pub_access_canary, table: system.runtime.queries, denied: true}
  - principal: svc.platform
    table: system.runtime.queries
    visible: [query_id, state, user, source, query, resource_group_id, queued_time_ms, analysis_time_ms,
              planning_time_ms, created, started, last_heartbeat, end, error_type, error_code]
    mustAppear: {where: "\"user\" = 'p.canary-full'", minRows: 1}

  # The owner-only products (reference-data.calendars, reference-data.currency-master): nobody
  # holds a role, so a reader of another product is refused each reader view, each base, the
  # seed's table, each bronze table and each landing.
  - {principal: p.canary-full, table: reference_data.calendars.target_days, denied: true}  # reader view: nobody holds a role
  - {principal: p.canary-full, table: reference_data.calendars__base.target_days, denied: true}  # base (ADR-061)
  - {principal: p.canary-full, table: reference_data.calendars__base.target_closing_days, denied: true}  # the seed's table in the base
  - {principal: p.canary-full, table: reference_data.currency_master.currency, denied: true}  # reader view, no role offered
  - {principal: p.canary-full, table: reference_data.currency_master__base.currency, denied: true}  # base (ADR-061)
  - {principal: p.canary-full, table: lake.currency_master.bronze_currencies, denied: true}  # bronze, which offers no role
  - {principal: p.canary-full, table: lake.currency_master.landing_files, denied: true}  # the product's landing
  - {principal: p.canary-full, table: governance.quality_results.test_results, denied: true}  # reader view, no role offered (svc.catalog's by rule)
  - {principal: p.canary-full, table: governance.quality_results__base.test_results, denied: true}  # base (ADR-061)
  # fx-reference.ecb-fx-rates (step W2-9): p.analyst-a holds full_reader, offered by gold alone
  # with no policy, so it reads gold's reader view whole and nothing else of the product. The read
  # row asserts columns, not rows (no mustAppear): a lab lake may hold no ECB rows yet.
  - {principal: p.analyst-a, table: fx_reference.ecb_fx_rates.gold_eur_rates_daily, via: [sql, rest], visible: [rate_date, currency, rate, is_carried, carried_days, rate_available_at]}  # gold, every column
  - {principal: p.canary-full, table: fx_reference.ecb_fx_rates.gold_eur_rates_daily, denied: true}  # a non-holder is still refused gold
  - {principal: p.analyst-a, table: fx_reference.ecb_fx_rates.silver_rates, denied: true}  # silver's reader view: no role offered
  - {principal: p.analyst-a, table: fx_reference.ecb_fx_rates__base.silver_rates, denied: true}  # base (ADR-061)
  - {principal: p.analyst-a, table: fx_reference.ecb_fx_rates__base.gold_eur_rates_daily, denied: true}  # base, even to gold's reader
  - {principal: p.analyst-a, table: "fx_reference.ecb_fx_rates__base.silver_rates$files", denied: true}  # metadata table: paths, column bounds
  - {principal: p.analyst-a, table: "fx_reference.ecb_fx_rates__base.gold_eur_rates_daily$files", denied: true}  # and gold's
  - {principal: p.analyst-a, table: lake.ecb_fx_rates.bronze_daily, via: [sql, rest], denied: true}  # bronze, which offers no role
  - {principal: p.analyst-a, table: lake.ecb_fx_rates.landing_files, denied: true}  # the product's landing
  - {principal: p.canary-full, table: lake.kraken_trades.landing, denied: true}  # a Kafka landing: every record, no reader
  - {principal: p.canary-full, table: lake.kraken_trades.bronze_trade, denied: true}  # bronze, which offers no role
  - {principal: p.canary-full, table: market_capture.kraken_instruments.silver_listing, denied: true}  # no grant yet: the product grants no reader
  - {principal: p.canary-full, table: market_capture.kraken_instruments__base.silver_listing, denied: true}  # the base, never a reader's
  - {principal: p.canary-full, table: lake.kraken_instruments.bronze_pairs, denied: true}  # bronze, which offers no role
  - {principal: p.canary-full, table: lake.kraken_instruments.landing_files, denied: true}  # the product's landing
  # No compaction by a consumer (plan 002's optimize line). The reader name is a view, which Trino
  # refuses as NOT_SUPPORTED before any access check, so the denials name the table under it.
  - {principal: p.analyst-a, sql: "ALTER TABLE fx_reference.ecb_fx_rates.silver_rates EXECUTE optimize", expect: error}  # a view: not supported
  - {principal: p.analyst-a, sql: "ALTER TABLE fx_reference.ecb_fx_rates__base.silver_rates EXECUTE optimize", expect: denied}  # read-only reader catalog
  - {principal: p.analyst-a, sql: "ALTER TABLE fx_reference_build.ecb_fx_rates__base.silver_rates EXECUTE optimize", expect: denied}  # writer catalog: not a consumer's

  # The catalog fence (ADR-059 part 7): Lakekeeper has no authentication, so nothing reaches it
  # but the catalog's own network. Run on the stack by scripts/verify/catalog-fence.sh.
  - {probe: {from: k2-net, target: "lakekeeper:8181"}, expect: refused}
  - {probe: {from: host, target: "127.0.0.1:18181"}, expect: refused}
  - {probe: {from: k2-catalog, target: "lakekeeper:8181"}, expect: open}
  # fetch, where product parsers run, is on k2-egress alone (2026-11-27): neither the catalog nor
  # the lake's storage resolves or answers there.
  - {probe: {from: fetch, target: "lakekeeper:8181"}, expect: refused}
  - {probe: {from: fetch, target: "minio:9000"}, expect: refused}
  # No path around Trino (W1-23): MinIO publishes no port, so the host reaches no object but through Trino.
  - {probe: {from: host, target: "127.0.0.1:9000"}, expect: refused}  # MinIO's S3 API
  - {probe: {from: host, target: "127.0.0.1:9001"}, expect: refused}  # MinIO's console, a root-pair login

  # Storage keys (phase 002): each engine's own MinIO key, signed by scripts/access_verify.py, does
  # what its policy (docker/lake/minio/policies/) allows and nothing else. They mean something only
  # because every warehouse has remote signing off (docker/lake/init-lake.sh). Warehouse k2 holds the
  # landings' tables and bronze; governance stands for every domain warehouse.
  - {storageKey: {engine: spark, target: k2-lake/warehouse/k2, operation: write}, expect: allowed}            # Spark writes bronze
  - {storageKey: {engine: spark, target: k2-lake/warehouse/governance, operation: write}, expect: refused}    # never a domain warehouse
  - {storageKey: {engine: spark, target: k2-landing, operation: write}, expect: allowed}                       # it lands files (it cannot delete one: the maintenance pair removes the probe)
  - {storageKey: {engine: trino, target: k2-lake/warehouse/governance, operation: write}, expect: allowed}    # Trino builds the domain warehouses
  - {storageKey: {engine: trino, target: k2-lake/warehouse/k2, operation: read}, expect: allowed}             # the lake catalog reads bronze
  - {storageKey: {engine: trino, target: k2-lake/warehouse/k2, operation: write}, expect: refused}            # but never writes it
  - {storageKey: {engine: trino, target: k2-landing, operation: read}, expect: refused}                        # and never sees a landing
  - {storageKey: {engine: maintenance, target: k2-lake/warehouse/governance, operation: read}, expect: allowed}  # reads what it expires
  - {storageKey: {engine: maintenance, target: k2-lake/warehouse/governance, operation: write}, expect: refused} # deletes, never puts
  - {storageKey: {engine: maintenance, target: k2-lake/warehouse/k2, operation: write}, expect: refused}         # in no warehouse
  - {storageKey: {engine: maintenance, target: k2-landing, operation: write}, expect: refused}                 # expires landings, never lands one
  - {storageKey: {engine: backup, target: k2-lake/warehouse/k2, operation: read}, expect: allowed}             # backup reads the lake
  - {storageKey: {engine: backup, target: k2-landing, operation: read}, expect: allowed}                       # and the landings
  - {storageKey: {engine: backup, target: k2-lake/warehouse/k2, operation: write}, expect: refused}            # and writes nowhere: k2,
  - {storageKey: {engine: backup, target: k2-lake/warehouse/governance, operation: write}, expect: refused}    # a domain warehouse,
  - {storageKey: {engine: backup, target: k2-landing, operation: write}, expect: refused}                      # the landing bucket
  - {storageKey: {engine: tools, target: k2-lake/warehouse/governance, operation: read}, expect: allowed}     # tools reads the lake
  - {storageKey: {engine: tools, target: k2-landing, operation: read}, expect: allowed}                        # and the landings
  - {storageKey: {engine: tools, target: k2-lake/warehouse/k2, operation: write}, expect: refused}             # and writes nowhere: k2,
  - {storageKey: {engine: tools, target: k2-lake/warehouse/governance, operation: write}, expect: refused}     # a domain warehouse,
  - {storageKey: {engine: tools, target: k2-landing, operation: write}, expect: refused}                       # the landing bucket

  # The catalog equals the release: no planted view, table or tag (ADR-061 part 6).
  - {drift: catalog, expect: clean}
