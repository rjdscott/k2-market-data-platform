name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (capture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/capture-rust

    steps:
      - uses: actions/checkout@v7

      # Pinned to the channel services/capture-rust/rust-toolchain.toml declares.
      # `@stable` was a no-op: rustup honours the toolchain file, so the action's
      # `components:` never applied and 1.98.0 was downloaded on every run anyway
      # (rust-cache caches build artefacts, not toolchains).
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/capture-rust

      # rdkafka's cmake build and zstd-sys both need a C toolchain. libcurl
      # headers too: the runner ships libcurl.so, librdkafka's cmake detects it
      # and enables the OAuth/OIDC code path, and the build then fails on
      # `curl/curl.h` (run 32994901727). The Docker builder has no libcurl at
      # all, so it never hit this; here the header package is the fix.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake clang libclang-dev libcurl4-openssl-dev

      - run: cargo fmt --check

      # --locked: the Docker build compiles against the committed Cargo.lock, so
      # CI must too. Without it a transitive minor bump can be green here and a
      # different dependency set in the image.
      - run: cargo clippy --locked --all-targets -- -D warnings

      - run: cargo test --locked

  python:
    name: Python (lake + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Ruff
        run: uv run --no-project --with ruff ruff check docker/lake tests

      - name: Pytest
        run: uv run --no-project --with pytest --with pyyaml pytest tests -q

  docker:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prefect
            dockerfile: docker/prefect/Dockerfile
          - name: spark
            dockerfile: docker/spark/Dockerfile
          - name: capture
            dockerfile: services/capture-rust/Dockerfile
            # Only this image declares the ARG; passing it to the others would
            # just print an unconsumed-build-arg warning on three legs.
            build_args: K2_GIT_SHA=${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Every one of these COPYs from the repo root, so the context is `.` and
      # matches docker-compose.yml. capture-rust is NOT a standalone crate: it
      # compiles the wire contract in from the repo with
      # `include_str!("../../../schemas/avro/trade.avsc")` (src/record.rs), and
      # its Dockerfile.dockerignore is what keeps the context small.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose:
    name: Compose (config validation)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # `config` resolves every variable, mount and dependency without pulling
      # an image or starting anything, so it catches a bad service definition on
      # the PR rather than at `docker compose up` on the host. .env.example
      # supplies the variables; no secret is needed to validate the shape.
      - name: docker compose config
        run: docker compose --env-file .env.example config -q

      # A service that declares no CPU or memory limit silently escapes the
      # 16 CPU / 40 GB budget ADR-010 states, and nothing else would notice.
      - name: every service declares resource limits
        run: |
          docker compose --env-file .env.example config \
            | python3 -c '
          import sys, yaml
          services = yaml.safe_load(sys.stdin)["services"]
          missing = [
              name for name, svc in services.items()
              if not (svc.get("deploy") or {}).get("resources", {}).get("limits")
          ]
          if missing:
              sys.exit("services with no deploy.resources.limits: " + ", ".join(missing))
          print(f"{len(services)} services, all with limits")
          '

  docs:
    name: Docs (link/word/rule gates)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - run: bash scripts/check-docs.sh

  security:
    name: Security (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read          # upload-sarif reads the workflow run
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # legacy/ is archived, unbuilt and shipped by nothing — a CVE in v1's
          # lockfile or the retired Kotlin tier has no runtime to reach, so it
          # would be an unfixable finding on every PR forever.
          skip-dirs: legacy
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif

      # Code scanning is free on public repos; on a private repo this step fails with
      # 'Code scanning is not enabled' — don't let that fail the build.
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
