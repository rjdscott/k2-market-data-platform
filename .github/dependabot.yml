# No gradle ecosystem here: the only Gradle project is legacy/v2-kotlin/, archived
# and unbuilt since ADR-019. Dependency PRs against an archive are noise.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # The tag IS the toolchain version; Dependabot bumped it to 1.100.0 before
      # that Rust existed and main went red (2026-08-27). Bump by hand when a
      # release is out, together with the Dockerfile's rust image.
      - dependency-name: "dtolnay/rust-toolchain"
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "docker"
    directories:
      - "/docker/airflow"
      - "/docker/spark"
      - "/services/capture-rust"
    schedule:
      interval: "monthly"
    ignore:
      # Three pins move together in docker/airflow/Dockerfile: the FROM tag,
      # the apache-airflow pin and the constraints URL. A bump of the tag alone
      # builds an image whose pip step reinstalls the old Airflow over the new.
      # The version is also gated on astronomer-cosmos support outside beta
      # (ADR-034), which no bot checks. Bump by hand.
      - dependency-name: "apache/airflow"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "build"
      include: "scope"

  # Weekly, not monthly: capture-rust is the only tier producing data now, and its
  # tree (rdkafka, rustls, tokio) is where a CVE would actually reach the wire.
  - package-ecosystem: "cargo"
    directory: "/services/capture-rust"
    schedule:
      interval: "weekly"
    ignore:
      # 0.x minor bumps are breaking in cargo semantics. sha2 0.10 -> 0.11 changed
      # the digest output type and broke the replay tests (2026-08-27); take it by
      # hand with the {:x} call sites, not from a bot.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-minor"]
    # One pull request per run for all security fixes, not one per advisory.
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 3
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "build"
      include: "scope"

  # platform/k2gen/ is live; legacy/v1 is archived and runs nowhere
  # (SECURITY.md), and notebooks/ moved to legacy/v3-lake-ingest/ with the old
  # lake ingest. Limit 0 switches off version-update pull requests for both. It
  # does not switch off security updates: 26 single-advisory pull requests
  # arrived against notebooks/ and legacy/v1 by 2026-11-24. The group folds
  # security fixes into one pull request per directory. Alerts stay visible in
  # the Security tab either way; the legacy residue is recorded in
  # legacy/v1/README.md.
  - package-ecosystem: "uv"
    directories:
      - "/platform/k2gen"
      - "/legacy/v1"
    schedule:
      interval: "monthly"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 0
    labels: ["dependencies", "python:uv"]
    commit-message:
      prefix: "build"
      include: "scope"
