# No gradle ecosystem here: the only Gradle project is legacy/v2-kotlin/, archived
# and unbuilt since ADR-019. Dependency PRs against an archive are noise.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # The tag IS the toolchain version; Dependabot bumped it to 1.100.0 before
      # that Rust existed and main went red (2026-08-27). Bump by hand when a
      # release is out, together with the Dockerfile's rust image.
      - dependency-name: "dtolnay/rust-toolchain"
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "docker"
    directories:
      - "/docker/prefect"
      - "/docker/spark"
      - "/services/capture-rust"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "build"
      include: "scope"

  # Weekly, not monthly: capture-rust is the only tier producing data now, and its
  # tree (rdkafka, rustls, tokio) is where a CVE would actually reach the wire.
  - package-ecosystem: "cargo"
    directory: "/services/capture-rust"
    schedule:
      interval: "weekly"
    ignore:
      # 0.x minor bumps are breaking in cargo semantics. sha2 0.10 -> 0.11 changed
      # the digest output type and broke the replay tests (2026-08-27); take it by
      # hand with the {:x} call sites, not from a bot.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-minor"]
    open-pull-requests-limit: 3
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "build"
      include: "scope"

  # legacy/v1 is archived and runs nowhere (SECURITY.md). Alerts on its lockfile
  # stay visible in the Security tab; this entry exists only to switch off the
  # security-update PRs for that manifest, which is what a 0 limit does — the
  # lockfile was upgraded in-constraint once (#84) and the residue is recorded
  # in legacy/v1/README.md. Without this entry Dependabot opens one PR per
  # advisory against an archive.
  - package-ecosystem: "uv"
    directory: "/legacy/v1"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
