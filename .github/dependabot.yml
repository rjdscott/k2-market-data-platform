# No gradle ecosystem here: the only Gradle project is legacy/v2-kotlin/, archived
# and unbuilt since ADR-019. Dependency PRs against an archive are noise.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "docker"
    directories:
      - "/docker/prefect"
      - "/docker/spark"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "build"
      include: "scope"

  # Weekly, not monthly: capture-rust is the only tier producing data now, and its
  # tree (rdkafka, rustls, tokio) is where a CVE would actually reach the wire.
  - package-ecosystem: "cargo"
    directory: "/services/capture-rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "build"
      include: "scope"
