models:
  - name: venue_quality_scorecard
    description: >-
      Per venue and UTC day, how complete the lake is: one row per (exchange, utc_date) on
      which the venue has a trade in lake.gold.trades or a check in lake.audit.checks.
      Product venue-quality, contracts/market-analytics/venue-quality/product.yaml.
    columns:
      - name: exchange
        description: A venue that has at least one trade in gold.trades.
        data_tests: [not_null]
      - name: utc_date
        description: The UTC date of the trade's exchange_ts, or of the check's run_ts.
        data_tests: [not_null]
      - name: trades
        description: Trades that day.
      - name: trades_after_gap
        description: Trades whose previous trade id for the symbol was more than one below (seq_gap), so trades the archive never received came before them.
      - name: trade_ids_missing
        description: How many trade ids those gaps leave out (sum of missing_before); the trades never received, counted by their ids.
      - name: trades_gap_unknown
        description: Trades with no earlier trade of the symbol inside silver's lookback, so whether ids are missing before them is unknowable (seq_gap null).
      - name: audit_checks
        description: Maintenance audits run that day whose scope is one of the venue's tables or topic partitions, silver_flags left out.
      - name: audit_checks_failed
        description: Of those, how many failed, a check that raised included.
      - name: records_lost
        description: Records Redpanda evicted before the lake read them, from the ingest's offset_gap rows that day on the venue's topics.
    data_tests:
      # The grain, as the contract declares it; scripts/dbt_manifest_check.py requires this test.
      - dbt_expectations.expect_compound_columns_to_be_unique:
          name: venue_quality_scorecard_unique_on_its_grain
          arguments:
            column_list: [exchange, utc_date]
      # Every count is a part of the one beside it: a gap trade is a trade, it leaves out at
      # least one id (lake.sql: missing_before is 0 when seq_gap is false, NULL with it), and a
      # failed check is a check.
      - dbt_expectations.expression_is_true:
          name: venue_quality_scorecard_counts_nest
          arguments:
            expression: >-
              trades_after_gap + trades_gap_unknown <= trades and trades_after_gap <= trade_ids_missing
              and audit_checks_failed <= audit_checks and records_lost >= 0

unit_tests:
  # Made-up venues (alpha, beta) and values, so the logic is tested and not the market.
  - name: venue_quality_scorecard_counts_trades_per_venue_and_utc_day
    description: >-
      The last microsecond of a day and the first of the next fall on two days; venues never
      mix; a gap trade adds its missing ids, a null seq_gap counts as unknowable.
    model: venue_quality_scorecard
    given:
      - input: ref('stg_gold__trades')
        rows:
          - {exchange: alpha, exchange_ts: "2001-01-01 23:59:59.999999 UTC", seq_gap: false, missing_before: 0}
          - {exchange: alpha, exchange_ts: "2001-01-01 12:00:00.000000 UTC", seq_gap: true, missing_before: 3}
          - {exchange: alpha, exchange_ts: "2001-01-01 00:00:00.000000 UTC", seq_gap: null, missing_before: null}
          - {exchange: alpha, exchange_ts: "2001-01-02 00:00:00.000000 UTC", seq_gap: true, missing_before: 2}
          - {exchange: beta, exchange_ts: "2001-01-01 08:00:00.000000 UTC", seq_gap: false, missing_before: 0}
      - input: ref('stg_audit__checks')
        rows: []
    expect:
      rows:
        - {exchange: alpha, utc_date: 2001-01-01, trades: 3, trades_after_gap: 1, trade_ids_missing: 3, trades_gap_unknown: 1, audit_checks: 0, audit_checks_failed: 0, records_lost: 0}
        - {exchange: alpha, utc_date: 2001-01-02, trades: 1, trades_after_gap: 1, trade_ids_missing: 2, trades_gap_unknown: 0, audit_checks: 0, audit_checks_failed: 0, records_lost: 0}
        - {exchange: beta, utc_date: 2001-01-01, trades: 1, trades_after_gap: 0, trade_ids_missing: 0, trades_gap_unknown: 0, audit_checks: 0, audit_checks_failed: 0, records_lost: 0}

  - name: venue_quality_scorecard_files_a_check_under_the_venue_its_scope_names
    description: >-
      A scope names a venue as a whole token, in each of the four shapes the lake writes;
      alphabet is not alpha, and a cross-venue scope is no venue's. silver_flags, operator
      rows and replay rows are not counted; an offset_gap row adds its records; a check on a
      day without trades still makes a row.
    model: venue_quality_scorecard
    given:
      - input: ref('stg_gold__trades')
        rows:
          - {exchange: alpha, exchange_ts: "2001-01-01 10:00:00.000000 UTC", seq_gap: false, missing_before: 0}
          - {exchange: beta, exchange_ts: "2001-01-01 10:00:00.000000 UTC", seq_gap: false, missing_before: 0}
      - input: ref('stg_audit__checks')
        rows:
          - {run_ts: "2001-01-01 03:00:00.000000 UTC", job: maintenance, check_name: bronze_unparseable, scope: lake.bronze.alpha_trade, passed: true, observed: 0}
          - {run_ts: "2001-01-01 03:00:00.000000 UTC", job: maintenance, check_name: silver_parity, scope: lake.silver.trades_alpha, passed: false, observed: 5}
          - {run_ts: "2001-01-01 03:00:00.000000 UTC", job: maintenance, check_name: gold_parity, scope: lake.gold.trades/alpha, passed: true, observed: 0}
          - {run_ts: "2001-01-01 03:00:00.000000 UTC", job: maintenance, check_name: offset_continuity, scope: market.crypto.v3.raw.alpha/7, passed: true, observed: 0}
          - {run_ts: "2001-01-01 03:00:00.000000 UTC", job: maintenance, check_name: silver_flags, scope: lake.silver.trades_alpha, passed: true, observed: 9}
          - {run_ts: "2001-01-01 03:00:00.000000 UTC", job: maintenance, check_name: duplicate_identifiers, scope: lake.bronze.alphabet_trade, passed: false, observed: 1}
          - {run_ts: "2001-01-01 03:00:00.000000 UTC", job: maintenance, check_name: duplicate_identifiers, scope: lake.gold.trades, passed: false, observed: 1}
          - {run_ts: "2001-01-01 04:00:00.000000 UTC", job: operator, check_name: manual_purge, scope: lake.bronze.alpha_trade, passed: true, observed: 40}
          - {run_ts: "2001-01-01 05:00:00.000000 UTC", job: replay, check_name: replay, scope: market.crypto.v3.raw.alpha/1, passed: true, observed: 40}
          - {run_ts: "2001-01-01 06:00:00.000000 UTC", job: ingest, check_name: offset_gap, scope: market.crypto.v3.raw.alpha/7, passed: false, observed: 11}
          - {run_ts: "2001-01-01 06:00:00.000000 UTC", job: ingest, check_name: offset_gap, scope: market.crypto.v3.trades.alpha/2, passed: false, observed: 4}
          - {run_ts: "2001-01-02 03:00:00.000000 UTC", job: maintenance, check_name: kraken_checksum, scope: lake.silver.book_beta, passed: false, observed: 2}
    expect:
      rows:
        - {exchange: alpha, utc_date: 2001-01-01, trades: 1, audit_checks: 4, audit_checks_failed: 1, records_lost: 15}
        - {exchange: beta, utc_date: 2001-01-01, trades: 1, audit_checks: 0, audit_checks_failed: 0, records_lost: 0}
        - {exchange: beta, utc_date: 2001-01-02, trades: 0, audit_checks: 1, audit_checks_failed: 1, records_lost: 0}
