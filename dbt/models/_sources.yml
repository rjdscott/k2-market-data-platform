# Generated by `k2gen generate` from contracts/. Do not edit: change the contract, then `make generate`.
version: 2
sources:
- name: audit
  description: Lake namespace audit, through Trino's read-only catalog lake (ADR-044).
  database: lake
  schema: audit
  tables:
  - name: checks
    description: 'One row per check per run of a lake job, append-only: a failed check is never edited out. The checks read every layer (docker/lake/maintenance.py AUDITS, the ingest''s offset_gap rows), which is why no upstream is declared: a list of every lake table would say less than the code does.'
    config:
      meta:
        contract: contracts/market-capture/lake-audit/audit.checks.odcs.yaml
        owner: capture-team
        read_by:
        - market_analytics.venue_quality.venue_quality_scorecard
    columns:
    - name: run_ts
      data_type: timestamp(6) with time zone
      description: When the maintenance run that produced this row started
    - name: job
      data_type: varchar
      description: 'Who wrote it: maintenance | ingest | verify | operator | replay. replay is one row per `scripts/replay-lake.sh` run (docker/lake/record_check.py): the raw.messages snapshot, the conn_id and the crate sha in detail, the output hash in scope-free form, so a result is reproducible by re-running the same ids and comparing one digest. operator means a human filed it by hand at the moment of a decision: the two runbook rows that record a deliberate purge and a known offset gap. The column exists to answer "who asserted this", so a hand-filed row claiming maintenance would be the one lie that matters'
    - name: check_name
      data_type: varchar
      description: 'job=maintenance writes the names in docker/lake/maintenance.py AUDITS: offset_continuity, duplicate_identifiers, bronze_unparseable, bronze_schema_drift, silver_parity, silver_flags (informational, no pass/fail), gold_parity, ohlcv_parity, bars_parity, kraken_checksum. job=ingest writes unresolvable_schema_id, bronze_parity, and offset_gap (a --accept-data-loss run recording records Redpanda evicted before the lake read them, one row per partition, written BEFORE the skip it licenses). job=operator writes manual_purge (a deletion, not a finding, kept distinct so a query over this table never reads a purge as a check result) and checksum_failure_acknowledged. job=replay writes replay (scripts/replay-lake.sh)'
    - name: scope
      data_type: varchar
      description: 'What was checked: a table name, or topic/partition'
    - name: passed
      data_type: boolean
      description: false here is what makes the maintenance run exit non-zero
    - name: observed
      data_type: bigint
      description: 'The number the check produced: gap count, duplicate count. NULL where the check has no count'
    - name: detail
      data_type: varchar
      description: Human-readable specifics for a failure; empty on success
- name: gold
  description: Lake namespace gold, through Trino's read-only catalog lake (ADR-044).
  database: lake
  schema: gold
  tables:
  - name: trades
    description: 'Canonical trades: the venue_replay = false rows of silver, one to one, keyed by (exchange, canonical_symbol, trade_id).'
    config:
      meta:
        contract: contracts/market-analytics/canonical-trades/gold.trades.odcs.yaml
        owner: analytics-team
        read_by:
        - market_analytics.candles.ohlcv_1m
        - market_analytics.delayed_candles.ohlcv_delayed_20m
        - market_analytics.venue_quality.venue_quality_scorecard
      loaded_at_field: ingest_ts
      freshness:
        error_after:
          count: 30
          period: minute
    columns:
    - name: exchange
      data_type: varchar
      description: binance | kraken | coinbase
    - name: canonical_symbol
      data_type: varchar
      description: BASE/QUOTE from config/instruments.yaml
    - name: symbol
      data_type: varchar
      description: Venue-native symbol
    - name: trade_id
      data_type: varchar
      description: The venue trade id, as sent
    - name: trade_seq
      data_type: bigint
      description: trade_id as a number
    - name: price_e8
      data_type: bigint
      description: Price x 1e8, exact (silver DECIMAL(28,10) has no more than 8 decimals on any venue here. precision_loss in silver says when that stops being true)
    - name: qty_e8
      data_type: bigint
      description: Base quantity x 1e8
    - name: side
      data_type: varchar
      description: 'Taker side: buy | sell'
    - name: exchange_ts
      data_type: timestamp(6) with time zone
      description: Venue clock, UTC microseconds
    - name: recv_ts_ns
      data_type: bigint
      description: K2 receive clock of the winning delivery
    - name: conn_id
      data_type: varchar
    - name: conn_msg_seq
      data_type: bigint
    - name: seq_gap
      data_type: boolean
      description: 'From silver: trade ids missing before this one (NULL = unknowable)'
    - name: missing_before
      data_type: bigint
    - name: src_topic
      data_type: varchar
      description: Lineage to the silver row, which is the bronze row, which is the raw.messages row
    - name: src_partition
      data_type: integer
    - name: src_offset
      data_type: bigint
    - name: src_index
      data_type: integer
    - name: ingest_ts
      data_type: timestamp(6) with time zone
    data_tests:
    - dbt_expectations.expect_compound_columns_to_be_unique:
        arguments:
          column_list:
          - exchange
          - canonical_symbol
          - trade_id
          row_condition: exchange_ts >= current_timestamp - interval '6' hour
