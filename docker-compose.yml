#   lake-ddl           0.5  | 1G    v3 raw/bronze/audit table DDL (docker/lake/ddl/lake.sql)
#   airflow-migrate    0.5  | 1G    airflow role + database, then `airflow db migrate`
#   ----------------------------------------------------------------------------
#   one-shot subtotal  2.0  | 2.5G
#
# Bootstrap peak: 21.30 CPU / 36.812 GiB, all 24 default-profile services,
# against the 25 CPU / 48 GiB ceiling ADR-035 sets at the bootstrap peak
# (superseding ADR-034's 20 CPU / 36 GiB, which superseded ADR-010's 16 CPU /
# 40 GB). scripts/check-budget.py fails CI over it. Headroom: 3.70 CPU and
# 11.188 GiB. The host gives Docker 28 CPU / 49.5 GiB; 3 cores and 1.5 GiB stay
# outside the ceiling for the OS and the engine (ADR-035 says why that is enough).
#
# `legacy` profile, the Prefect rollback, not started by default:
#
#   prefect-server     1.0  | 1G    Orchestration UI/API (Prefect 3.x)
#   prefect-worker     0.5  | 512M  Workflow executor (Prefect 3.x)
#
# With it the peak is 22.80 CPU / 38.312 GiB across 26, inside the ceiling but
