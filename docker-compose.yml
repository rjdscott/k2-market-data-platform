# K2 Market Data Platform v2 - Consolidated Architecture
# Version: 2.0.0-consolidated
# Last Updated: 2026-02-12
# Target: 16 CPU cores / 40GB RAM

#############################################################################
# NETWORKS
#############################################################################
networks:
  k2-net:
    driver: bridge

#############################################################################
# VOLUMES
#############################################################################
volumes:
  # Redpanda data
  redpanda-data:
    driver: local

  # ClickHouse data
  clickhouse-data:
    driver: local
  clickhouse-logs:
    driver: local

  # Monitoring data
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

  # Orchestration data
  postgres-data:
    driver: local

  # Object storage data
  minio-data:
    driver: local


#############################################################################
# SERVICES - STREAMING BACKBONE
#############################################################################
services:

  # ───────────────────────────────────────────────────────────────────────
  # Redpanda - Kafka-compatible streaming platform (C++, single binary)
  # ───────────────────────────────────────────────────────────────────────
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.4
    container_name: k2-redpanda
    hostname: redpanda
    networks:
      - k2-net
    ports:
      - "9092:9092"     # Kafka API
      - "9644:9644"     # Admin API
      - "8081:8081"     # Schema Registry
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1500M
    environment:
      REDPANDA_PANDAPROXY_CLIENT_RETRIES: 5
      REDPANDA_PANDAPROXY_CLIENT_RETRY_BASE_BACKOFF_MS: 100
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      com.k2.service: "streaming"
      com.k2.tier: "hot"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Redpanda Console - Web UI for Redpanda/Kafka
  # ───────────────────────────────────────────────────────────────────────
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.5.1
    container_name: k2-redpanda-console
    hostname: console
    networks:
      - k2-net
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: true
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/admin/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "ui"
      com.k2.tier: "management"
      com.k2.version: "v2"

#############################################################################
# SERVICES - WARM STORAGE (ClickHouse)
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # ClickHouse - OLAP database for real-time analytics
  # ───────────────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: k2-clickhouse
    hostname: clickhouse
    networks:
      - k2-net
    ports:
      - "8123:8123"     # HTTP interface
      - "9002:9000"     # Native protocol (9002 to avoid MinIO conflict)
      - "9363:9363"     # Prometheus metrics
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.d/k2-config.xml:ro
      # - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/k2-users.xml:ro  # Removed: using default auth with CLICKHOUSE_PASSWORD env var
      - ./docker/clickhouse/ddl:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: k2
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      com.k2.service: "storage"
      com.k2.tier: "warm"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # MinIO - S3-compatible object storage for Iceberg
  # ───────────────────────────────────────────────────────────────────────
  # Until Phase B, MinIO was provisioned but carried no data — the v2 Iceberg
  # warehouse is a bind-mounted hadoop catalog (docker/iceberg/warehouse, see
  # ADR-013). The v3 `k2-lake` bucket behind Lakekeeper is its first real user.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z  # console still present at :9001
    container_name: k2-minio
    hostname: minio
    networks:
      - k2-net
    ports:
      - "9000:9000"     # API
      - "9001:9001"     # Console
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "storage"
      com.k2.tier: "cold"
      com.k2.version: "v2"

#############################################################################
# SERVICES - MONITORING & OBSERVABILITY
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # Prometheus - Metrics collection
  # ───────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: k2-prometheus
    hostname: prometheus
    networks:
      - k2-net
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "monitoring"
      com.k2.tier: "observability"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Grafana - Metrics visualization
  # ───────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.0
    container_name: k2-grafana
    hostname: grafana
    networks:
      - k2-net
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_LOG_LEVEL: info
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      com.k2.service: "monitoring"
      com.k2.tier: "observability"
      com.k2.version: "v2"

#############################################################################
# SERVICES - ORCHESTRATION LAYER
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # PostgreSQL - Prefect metadata + watermarks
  # ───────────────────────────────────────────────────────────────────────
  prefect-db:
    image: postgres:15-alpine
    container_name: k2-prefect-db
    hostname: prefect-db
    networks:
      - k2-net
    ports:
      - "127.0.0.1:15432:5432"   # host access only; 5432 is often taken locally
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/ddl:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${PREFECT_DB_USER}
      POSTGRES_PASSWORD: ${PREFECT_DB_PASSWORD}
      POSTGRES_DB: ${PREFECT_DB_NAME}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    # TCP, not the default socket probe. `pg_isready -U $$POSTGRES_USER` talks to
    # the Unix socket, which the *initdb temp server* is already listening on —
    # that server runs with listen_addresses='' while it executes
    # /docker-entrypoint-initdb.d/*.sql. So a socket probe reports healthy before
    # 10-lakekeeper-db.sql has run and before postgres listens on 5432 at all.
    # `lakekeeper-migrate` connects over TCP, does not retry (fails in ~0.3 s with
    # "Error creating write pool") and is `restart: "no"` — on a fresh clone the
    # whole v3 lake tier would silently never come up. -h 127.0.0.1 forces the
    # probe down the same path the dependants use; -d the app DB makes it also
    # prove the database exists, not merely that a postmaster answers.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "orchestration"
      com.k2.tier: "control-plane"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Prefect Server - Workflow orchestration UI/API (v3.x)
  # ───────────────────────────────────────────────────────────────────────
  prefect-server:
    image: prefecthq/prefect:3-python3.12
    container_name: k2-prefect-server
    hostname: prefect-server
    networks:
      - k2-net
    ports:
      - "4200:4200"
    volumes:
      - ./docker/prefect:/root/.prefect
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_UI_API_URL: http://localhost:4200/api   # what the browser on the host uses
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/${PREFECT_DB_NAME}
    command: prefect server start --host 0.0.0.0
    depends_on:
      prefect-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      com.k2.service: "orchestration"
      com.k2.tier: "control-plane"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Prefect Worker - Workflow executor (v3.x uses workers not agents)
  # ───────────────────────────────────────────────────────────────────────
  prefect-worker:
    build:
      context: .
      dockerfile: docker/prefect/Dockerfile
    image: k2-prefect-worker:3-python3.12  # local tag after build
    container_name: k2-prefect-worker
    hostname: prefect-worker
    networks:
      - k2-net
    volumes:
      - ./docker/prefect:/root/.prefect
      - ./docker/offload:/opt/prefect/offload
      - ./docker/offload/flows:/opt/prefect/flows
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for container orchestration
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PYTHONPATH: /opt/prefect
      DOCKER_API_VERSION: "1.44"
    # Register (upsert) the two scheduled deployments, then start the worker.
    command: >
      sh -c "prefect work-pool create iceberg-offload --type process 2>/dev/null || true
      && python /opt/prefect/flows/deploy_production.py
      && python /opt/prefect/flows/deploy_maintenance.py
      && prefect worker start --pool iceberg-offload --type process"
    depends_on:
      prefect-server:
        condition: service_healthy
      iceberg-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    labels:
      com.k2.service: "orchestration"
      com.k2.tier: "control-plane"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Iceberg offload metrics exporter — Prometheus job 'iceberg-scheduler'
  # ───────────────────────────────────────────────────────────────────────
  # Derives every offload metric from the offload_watermarks table rather than
  # from in-process counters: Prefect runs each flow in a short-lived
  # subprocess that exits long before Prometheus scrapes it.
  #
  # Deliberately a separate service, not a sidecar in prefect-worker: if the
  # worker crashes, this keeps reporting the rising offload lag that the
  # alerts exist to catch. Reuses the worker image (psycopg2 + prometheus
  # -client are already installed there), so it costs no extra build.
  iceberg-metrics:
    image: k2-prefect-worker:3-python3.12  # built by the prefect-worker service
    container_name: k2-iceberg-metrics
    hostname: iceberg-metrics
    networks:
      - k2-net
    volumes:
      - ./docker/offload:/opt/prefect/offload:ro
    environment:
      PREFECT_DB_HOST: prefect-db
      PREFECT_DB_PORT: "5432"
      PREFECT_DB_NAME: ${PREFECT_DB_NAME}
      PREFECT_DB_USER: ${PREFECT_DB_USER}
      PREFECT_DB_PASSWORD: ${PREFECT_DB_PASSWORD}
    command: ["python", "/opt/prefect/offload/metrics.py", "--serve"]
    depends_on:
      prefect-db:
        condition: service_healthy
      prefect-worker:
        condition: service_started  # only for the image build
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    restart: unless-stopped
    labels:
      com.k2.service: "observability"
      com.k2.tier: "control-plane"
      com.k2.version: "v2"

#############################################################################
# SERVICES - ETL / OFFLOAD LAYER
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # Spark + Iceberg - ETL engine for cold tier offload
  # ───────────────────────────────────────────────────────────────────────
  spark-iceberg:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: k2-spark-iceberg:3.5.5_1.8.1  # local tag after build
    container_name: k2-spark-iceberg
    hostname: spark-iceberg
    networks:
      - k2-net
    ports:
      - "18080:8080"    # Spark Master UI (mapped to 18080 to avoid conflict)
      - "4040:4040"     # Spark Application UI
      - "8888:8888"     # Jupyter (if needed)
    volumes:
      - ./docker/iceberg/warehouse:/home/iceberg/warehouse
      - ./docker/offload:/home/iceberg/offload
      - ./docker/offload/flows:/home/iceberg/offload/flows
      - ./docker/lake:/home/iceberg/lake          # v3 lake catalog session builder
    environment:
      # MinIO / S3 credentials (Iceberg cold storage)
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
      - AWS_S3_ENDPOINT=http://minio:9000
      # Same credentials under their own names — docker/lake/spark_conf.py passes
      # them to the `lake` catalog's S3FileIO explicitly, not via the AWS chain.
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      # ClickHouse credentials (read by offload_generic.py via os.environ)
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      # PostgreSQL / watermark credentials (read by offload_generic.py via os.environ)
      - PREFECT_DB_HOST=prefect-db
      - PREFECT_DB_PORT=5432
      - PREFECT_DB_NAME=${PREFECT_DB_NAME}
      - PREFECT_DB_USER=${PREFECT_DB_USER}
      - PREFECT_DB_PASSWORD=${PREFECT_DB_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      prefect-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped
    labels:
      com.k2.service: "etl"
      com.k2.tier: "cold"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Iceberg Init - One-shot service to create the cold.* Iceberg tables
  # Runs once at startup; prefect-worker depends on service_completed_successfully
  # so the first offload can never hit TABLE_OR_VIEW_NOT_FOUND on a clean clone.
  # Idempotent (CREATE ... IF NOT EXISTS) — safe to re-run on an existing warehouse.
  # ───────────────────────────────────────────────────────────────────────
  iceberg-init:
    image: k2-spark-iceberg:3.5.5_1.8.1  # built by the spark-iceberg service
    container_name: k2-iceberg-init
    networks:
      - k2-net
    volumes:
      - ./docker/iceberg/warehouse:/home/iceberg/warehouse
      - ./docker/iceberg/ddl:/home/iceberg/ddl:ro
    entrypoint: ["/bin/bash", "/home/iceberg/ddl/00-run-all-ddl.sh"]
    depends_on:
      - spark-iceberg
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    restart: "no"
    labels:
      com.k2.service: "etl"
      com.k2.tier: "cold"
      com.k2.version: "v2"

#############################################################################
# SERVICES - v3 LAKE CATALOG (ADR-018)
#############################################################################
# Lakekeeper replaces v2's bind-mounted hadoop catalog (ADR-013) as the Iceberg
# catalog, making Iceberg-on-MinIO the system of record rather than a JDBC copy
# of ClickHouse. Runs alongside the v2 `k2` hadoop catalog until Phase D.
#
# Its metadata lives in a `lakekeeper` database on the existing prefect-db —
# see docker/postgres/ddl/10-lakekeeper-db.sql. PostgreSQL init scripts only run
# when the data directory is first created, so on a stack whose postgres-data
# volume predates this change, create the database once by hand:
#
#   docker exec k2-prefect-db psql -U "$PREFECT_DB_USER" -d postgres \
#     -c 'CREATE DATABASE lakekeeper'

  # ───────────────────────────────────────────────────────────────────────
  # Lakekeeper Migrate - One-shot schema migration for the catalog DB
  # `migrate` creates the PostgreSQL extensions it needs itself, so the DDL
  # file above only has to create an empty database.
  # ───────────────────────────────────────────────────────────────────────
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.3
    container_name: k2-lakekeeper-migrate
    networks:
      - k2-net
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
    command: ["migrate"]
    depends_on:
      prefect-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: "no"
    labels:
      com.k2.service: "init"
      com.k2.tier: "cold"
      com.k2.version: "v3"

  # ───────────────────────────────────────────────────────────────────────
  # Lakekeeper - Iceberg REST catalog
  # ───────────────────────────────────────────────────────────────────────
  # Port published on loopback only: the catalog runs unauthenticated on a
  # single host, and the only host-side consumers are the Phase E DuckDB /
  # PyIceberg notebooks. Same reasoning as prefect-db's 127.0.0.1:15432.
  # 18181 rather than 8181 because Redpanda already owns host 8081/8082.
  #
  # The image is distroless (no shell), so the healthcheck is the binary's own
  # `healthcheck` subcommand — it GETs http://localhost:8181/health and exits
  # non-zero on failure. CMD form, not CMD-SHELL: there is no shell to run.
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.3
    container_name: k2-lakekeeper
    hostname: lakekeeper
    networks:
      - k2-net
    ports:
      - "127.0.0.1:18181:8181"
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
      LAKEKEEPER__BASE_URI: http://lakekeeper:8181
    command: ["serve"]
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    labels:
      com.k2.service: "catalog"
      com.k2.tier: "cold"
      com.k2.version: "v3"

  # ───────────────────────────────────────────────────────────────────────
  # Lake Init - One-shot: MinIO bucket, catalog bootstrap, warehouse, namespaces
  # ───────────────────────────────────────────────────────────────────────
  # Reuses the minio/minio image because it is the only image already in this
  # stack carrying BOTH `mc` (bucket create) and `curl` (Lakekeeper REST) —
  # minio/mc has no curl, curlimages/curl has no mc, and either alone would cost
  # a second one-shot service. Idempotent; see docker/lake/init-lake.sh.
  lake-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: k2-lake-init
    networks:
      - k2-net
    volumes:
      - ./docker/lake:/init:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/bash", "/init/init-lake.sh"]
    depends_on:
      minio:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: "no"
    labels:
      com.k2.service: "init"
      com.k2.tier: "cold"
      com.k2.version: "v3"

#############################################################################
# SERVICES - TOPIC INITIALIZATION
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # Redpanda Init - One-shot: topic creation + Avro schema registration
  # Runs once at startup; feed handlers depend on service_completed_successfully
  # ───────────────────────────────────────────────────────────────────────
  # The script moved out of this file in Phase B: v3 adds Avro subject
  # registration against the schema registry, which is more than a compose
  # inline command should carry. After editing docker/redpanda/init.sh, run
  # `docker compose up -d --force-recreate --no-deps redpanda-init`.
  #
  # A *directory* bind mount goes stale after a write-then-rename save exactly
  # like the file-level config/instruments.yaml mount does — the staleness is
  # held by the file-sharing layer for as long as ANY container has that host
  # directory mounted, so a recreated container reads the old file too if a
  # sibling still holds the path. `./docker/redpanda` is mounted by this service
  # and nothing else (verified: `grep -n docker/redpanda docker-compose.yml`),
  # so recreating redpanda-init alone is sufficient here. `./docker/lake` is
  # NOT — see docker/README.md "A bind-mounted script runs its old contents".
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.4
    container_name: k2-redpanda-init
    networks:
      - k2-net
    volumes:
      - ./docker/redpanda:/init:ro
      - ./schemas/avro:/schemas:ro
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/init.sh"]
    # Declared like the other one-shots so the bootstrap peak is arithmetic, not
    # a guess — see the RESOURCE SUMMARY footer. rpk + curl in a shell loop.
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: "no"
    labels:
      com.k2.service: "init"
      com.k2.tier: "hot"
      com.k2.version: "v2"

