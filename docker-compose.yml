#   airflow-migrate    0.5  | 1G    airflow role + database, then `airflow db migrate`
#   ----------------------------------------------------------------------------
#   one-shot subtotal  1.5  | 1.5G
#
# Bootstrap peak: 17.30 CPU / 29.250 GiB, all 23 default-profile services,
# against the 25 CPU / 48 GiB ceiling ADR-045 sets at the bootstrap peak
# (superseding ADR-034's 20 CPU / 36 GiB, which superseded ADR-010's 16 CPU /
# 40 GB). scripts/check-budget.py fails CI over it. Headroom: 7.70 CPU and
# 18.750 GiB. With `--profile hot-gold` (clickhouse, paused by ADR-057) the
# peak is 21.30 CPU / 37.250 GiB over 24 services; the script reports that line
