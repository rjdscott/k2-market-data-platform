# K2 Market Data Platform v2 - Consolidated Architecture
# Version: 2.0.0-consolidated
# Last Updated: 2026-02-12
# Target: 25 CPU / 48 GiB at the bootstrap peak (ADR-035; was 20 CPU / 36 GiB, ADR-034, and 16 CPU / 40 GB, ADR-010)

#############################################################################
# NETWORKS
#############################################################################
networks:
  k2-net:
    driver: bridge

#############################################################################
# VOLUMES
#############################################################################
volumes:
  # Redpanda data
  redpanda-data:
    driver: local

  # ClickHouse data
  clickhouse-data:
    driver: local
  clickhouse-logs:
    driver: local

  # Monitoring data
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

  # Orchestration data
  postgres-data:
    driver: local

  # Object storage data
  minio-data:
    driver: local


# ── shared build definition for the three capture-* services ────────────────
# Context is the REPOSITORY ROOT, not the crate: src/record.rs compiles the wire
# contract in with `include_str!("../../../schemas/avro/trade.avsc")`, and
# services/capture-rust/Dockerfile.dockerignore is what keeps the context small.
# One image for all three capture services. Only capture-binance carries a
# `build:`; kraken and coinbase reuse the tag. Three `build:` blocks for one tag
# race on export in a fresh clone (`image "k2-capture:v3": already exists`) and
# abort `docker compose up` before any container starts.
x-capture-build: &capture-build
  context: .
  dockerfile: services/capture-rust/Dockerfile
  args:
    # Stamped into k2_capture_build_info. `git describe --always --dirty` rather
    # than a bare sha: an image built from a dirty tree must not claim to be the
    # commit it was started from. `make build-capture` and scripts/dev-up.sh
    # export it; unset ships `unknown`, which is honest.
    K2_GIT_SHA: ${K2_GIT_SHA:-unknown}

# ── shared environment for the four airflow-* services (ADR-034) ────────────
# One image, k2-airflow:3.3.2, built by airflow-migrate only (the same
# one-build-per-tag rule as the capture image above). The scheduler, the
# api-server and the dag-processor must agree on every line here: the JWT
# secret signs the tokens the scheduler gives each task and the api-server
# checks, and the api secret key signs the request that fetches a task's log
# from the scheduler's log server.
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__PARALLELISM: "4"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@prefect-db:5432/airflow
  # base_url is what the browser on the host uses. Tasks must not derive the
  # execution API from it: localhost inside the scheduler is the scheduler.
  AIRFLOW__API__BASE_URL: http://localhost:${K2_AIRFLOW_PORT:-8090}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
  # Tags in InfluxDB form, which the statsd exporter turns into labels, and no
  # legacy names: those embed dag_id in the metric name and would arrive twice.
  AIRFLOW__METRICS__STATSD_ON: "True"
  AIRFLOW__METRICS__STATSD_HOST: airflow-statsd
  AIRFLOW__METRICS__STATSD_PORT: "9125"
  AIRFLOW__METRICS__STATSD_INFLUXDB_ENABLED: "True"
  AIRFLOW__METRICS__LEGACY_NAMES_ON: "False"

#############################################################################
# SERVICES - STREAMING BACKBONE
#############################################################################
services:

  # ───────────────────────────────────────────────────────────────────────
  # Redpanda - Kafka-compatible streaming platform (C++, single binary)
  # ───────────────────────────────────────────────────────────────────────
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.4
    container_name: k2-redpanda
    hostname: redpanda
    networks:
      - k2-net
    ports:
      - "9092:9092"     # Kafka API
      - "19092:19092"   # Kafka API, external listener advertised as localhost:19092 (host tooling: scripts/parity)
      - "9644:9644"     # Admin API
      - "8081:8081"     # Schema Registry
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1500M
    environment:
      REDPANDA_PANDAPROXY_CLIENT_RETRIES: 5
      REDPANDA_PANDAPROXY_CLIENT_RETRY_BASE_BACKOFF_MS: 100
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      com.k2.service: "streaming"
      com.k2.tier: "hot"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Redpanda Console - Web UI for Redpanda/Kafka
  # ───────────────────────────────────────────────────────────────────────
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.5.1
    container_name: k2-redpanda-console
    hostname: console
    networks:
      - k2-net
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      # Console v3 moved the schema registry out from under `kafka.`:
      # KAFKA_SCHEMAREGISTRY_* is silently ignored and the UI shows
      # "Schema Registry: Not configured" with every Avro value undecodable.
      SCHEMAREGISTRY_ENABLED: true
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/admin/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "ui"
      com.k2.tier: "management"
      com.k2.version: "v2"

#############################################################################
# SERVICES - WARM STORAGE (ClickHouse)
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # ClickHouse - OLAP database for real-time analytics
  # ───────────────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: k2-clickhouse
    # Pinned off the capture cores (12-14) so a compaction or a heavy query
    # cannot steal a capture container's cycles; the Phase D noisy-neighbour
    # experiment (capacity-model.md) is what makes this claim measurable.
    cpuset: ${K2_HEAVY_CPUSET-0-11}
    hostname: clickhouse
    networks:
      - k2-net
    ports:
      - "8123:8123"     # HTTP interface
      - "9002:9000"     # Native protocol (9002 to avoid MinIO conflict)
      - "9363:9363"     # Prometheus metrics
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.d/k2-config.xml:ro
      # Profiles (default 6 GB, quant 3 GiB read-only) and the quant user.
      # Password from K2_QUANT_PASSWORD below; CLICKHOUSE_* still make `default`.
      - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/k2-users.xml:ro
      - ./docker/clickhouse/ddl:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: gold
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      K2_QUANT_PASSWORD: ${K2_QUANT_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      com.k2.service: "storage"
      com.k2.tier: "warm"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # MinIO - S3-compatible object storage for Iceberg
  # ───────────────────────────────────────────────────────────────────────
  # Until Phase B, MinIO was provisioned but carried no data — the v2 Iceberg
  # warehouse was a bind-mounted hadoop catalog (ADR-013), deleted in Phase D.
  # The v3 `k2-lake` bucket behind Lakekeeper is its first real user.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z  # console still present at :9001
    container_name: k2-minio
    hostname: minio
    networks:
      - k2-net
    ports:
      - "9000:9000"     # API
      - "9001:9001"     # Console
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "storage"
      com.k2.tier: "cold"
      com.k2.version: "v2"

#############################################################################
# SERVICES - MONITORING & OBSERVABILITY
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # Prometheus - Metrics collection
  # ───────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: k2-prometheus
    hostname: prometheus
    networks:
      - k2-net
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "monitoring"
      com.k2.tier: "observability"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Grafana - Metrics visualization
  # ───────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.0
    container_name: k2-grafana
    hostname: grafana
    networks:
      - k2-net
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_LOG_LEVEL: info
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      com.k2.service: "monitoring"
      com.k2.tier: "observability"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # cAdvisor - per-container CPU and memory, against each compose limit
  # ───────────────────────────────────────────────────────────────────────
  # Prometheus job 'cadvisor'; the K2 Resources dashboard reads it, and the
  # limits it plots are container_spec_cpu_quota / _period and
  # container_spec_memory_limit_bytes, read from the cgroups, not retyped.
  #
  # No published port: only Prometheus reads it, over k2-net. Not privileged
  # and no /dev/kmsg, so no OOM-event counter; every capability dropped and the
  # root filesystem read-only. The two sockets are what names a cgroup
  # `k2-clickhouse` (v0.61's Docker factory goes through containerd), and
  # `:ro` does not narrow a socket: whoever holds docker.sock can drive the
  # engine, the same privilege prefect-worker and airflow-scheduler hold.
  # cpu and memory only, one housekeeping pass per 15 s scrape instead of
  # cAdvisor's default 1 s, and Prometheus keeps seven series names of the
  # ~40 it exports (metric_relabel_configs in docker/prometheus/prometheus.yml).
  # Measured standalone on 2026-11-25: 18 MiB RSS, under 0.3% of a core.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    container_name: k2-cadvisor
    hostname: cadvisor
    networks:
      - k2-net
    volumes:
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    command:
      - --housekeeping_interval=15s
      - --max_housekeeping_interval=15s
      - --docker_only=true
      - --enable_metrics=cpu,memory,oom_event
      - --store_container_labels=false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "monitoring"
      com.k2.tier: "observability"
      com.k2.version: "v3"

#############################################################################
# SERVICES - ORCHESTRATION LAYER
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # PostgreSQL - Prefect, Airflow and Lakekeeper metadata
  # ───────────────────────────────────────────────────────────────────────
  # Keeps its name, its `prefect` role and the PREFECT_DB_* variables after
  # Airflow arrives: the role is physically named `prefect` in every existing
  # volume and the Lakekeeper URLs below carry it (ADR-034, Consequences).
  #
  # max_connections 200, up from the default 100, for Airflow's pools beside
  # Prefect's and the catalog's. The `airflow` role is capped at 100 of them
  # (docker/airflow/init-db.sh), so Airflow cannot starve the catalog. Takes
  # effect on recreate: `docker compose up -d --force-recreate --no-deps prefect-db`.
  prefect-db:
    image: postgres:15-alpine
    container_name: k2-prefect-db
    hostname: prefect-db
    networks:
      - k2-net
    ports:
      - "127.0.0.1:15432:5432"   # host access only; 5432 is often taken locally
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/ddl:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${PREFECT_DB_USER}
      POSTGRES_PASSWORD: ${PREFECT_DB_PASSWORD}
      POSTGRES_DB: ${PREFECT_DB_NAME}
    command: ["postgres", "-c", "max_connections=200"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M   # 1G until ADR-034: the extra connections each hold a backend
        reservations:
          cpus: '0.5'
          memory: 512M
    # TCP, not the default socket probe. `pg_isready -U $$POSTGRES_USER` talks to
    # the Unix socket, which the *initdb temp server* is already listening on —
    # that server runs with listen_addresses='' while it executes
    # /docker-entrypoint-initdb.d/*.sql. So a socket probe reports healthy before
    # 10-lakekeeper-db.sql has run and before postgres listens on 5432 at all.
    # `lakekeeper-migrate` connects over TCP, does not retry (fails in ~0.3 s with
    # "Error creating write pool") and is `restart: "no"` — on a fresh clone the
    # whole v3 lake tier would silently never come up. -h 127.0.0.1 forces the
    # probe down the same path the dependants use; -d the app DB makes it also
    # prove the database exists, not merely that a postmaster answers.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "orchestration"
      com.k2.tier: "control-plane"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Prefect Server - Workflow orchestration UI/API (v3.x)
  # ───────────────────────────────────────────────────────────────────────
  # `legacy` profile since the Airflow cutover (ADR-034): a plain
  # `docker compose up -d` leaves this and prefect-worker down, and the
  # rollback starts both by name,
  #   docker compose --profile legacy up -d prefect-server prefect-worker
  # then resumes the Prefect schedule (docs/runbooks/airflow-scheduling.md,
  # Rollback). Nothing in the default profile depends on either.
  prefect-server:
    profiles: ["legacy"]
    image: prefecthq/prefect:3-python3.12
    container_name: k2-prefect-server
    hostname: prefect-server
    networks:
      - k2-net
    # Host port is one variable, K2_PREFECT_PORT (.env, default 4200): it has to
    # move in lockstep with PREFECT_UI_API_URL, which is the URL the SPA in the
    # browser calls. Publishing on another port without moving that variable too
    # gives a UI that loads and then fails every request.
    ports:
      - "${K2_PREFECT_PORT:-4200}:4200"
    volumes:
      - ./docker/prefect:/root/.prefect
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_UI_API_URL: http://localhost:${K2_PREFECT_PORT:-4200}/api   # what the browser on the host uses
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/${PREFECT_DB_NAME}
    command: prefect server start --host 0.0.0.0
    depends_on:
      prefect-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      com.k2.service: "orchestration"
      com.k2.tier: "control-plane"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Prefect Worker - Workflow executor (v3.x uses workers not agents)
  # ───────────────────────────────────────────────────────────────────────
  prefect-worker:
    profiles: ["legacy"]   # the rollback, see prefect-server above
    build:
      context: .
      dockerfile: docker/prefect/Dockerfile
    image: k2-prefect-worker:3-python3.12  # local tag after build
    container_name: k2-prefect-worker
    hostname: prefect-worker
    networks:
      - k2-net
    volumes:
      - ./docker/prefect:/root/.prefect
      - ./docker/lake/flows:/opt/prefect/lake-flows:ro   # v3 lake deployments
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for container orchestration
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PYTHONPATH: /opt/prefect
      DOCKER_API_VERSION: "1.44"
    # Register (upsert) the two lake deployments, then start the worker.
    # v2's cold-tier pool and its two deployments went with docker/offload/ in
    # Phase D: a fresh clone must not register deployments whose code no longer
    # exists. A stack upgraded in place keeps the old, empty pool until someone
    # deletes it by hand — `prefect work-pool ls` shows it, nothing runs on it.
    command: >
      sh -c "prefect work-pool create lake --type process 2>/dev/null || true
      && python /opt/prefect/lake-flows/deploy_lake.py
      && prefect worker start --pool lake --type process"
    depends_on:
      prefect-server:
        condition: service_healthy
      # NOT gated on lake-ddl, and that is deliberate: lake-ddl is
      # `restart: "no"`, so gating here means one transient DDL failure at boot
      # leaves the worker down until someone notices. The cost of not gating is
      # bounded and self-healing — the first lake-ingest-5min tick may hit
      # TABLE_OR_VIEW_NOT_FOUND, the flow retries once after 60 s, and the next
      # tick is five minutes later, against LakeIngestFailed's 35-minute
      # threshold.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    labels:
      com.k2.service: "orchestration"
      com.k2.tier: "control-plane"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Airflow 3 - the lake schedules (ADR-034)
  # ───────────────────────────────────────────────────────────────────────
  # The only scheduler of the lake writes since the cutover: lake_ingest every
  # 5 minutes, lake_maintenance at 03:00 UTC, lake_rebuild by hand.
  # docker/airflow/dags/lake.py has the DAGs; docs/runbooks/airflow-scheduling.md
  # the cutover, the rollback to Prefect and the recoveries.
  #
  # LocalExecutor, so tasks run inside airflow-scheduler, and that is the only
  # service given the Docker socket. No triggerer: nothing here defers.
  #
  # ./docker/airflow/dags is a directory bind mount held by the scheduler and
  # the dag-processor. A write-then-rename edit needs both recreated (CLAUDE.md,
  # bind-mount gotcha).

  # One-shot: creates the `airflow` role and database on prefect-db when
  # missing (docker/airflow/init-db.sh), then `airflow db migrate`.
  airflow-migrate:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: k2-airflow:3.3.2
    container_name: k2-airflow-migrate
    networks:
      - k2-net
    environment:
      <<: *airflow-env
      PGHOST: prefect-db
      PGUSER: ${PREFECT_DB_USER}
      PGPASSWORD: ${PREFECT_DB_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    command: ["bash", "/opt/k2/init-db.sh"]
    depends_on:
      prefect-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    restart: "no"
    labels:
      com.k2.service: "init"
      com.k2.tier: "control-plane"
      com.k2.version: "v3"

  # UI and REST API, plus the execution API every task reports to. Loopback
  # only: a trigger here runs `docker exec` in the Spark container. Host port
  # is one variable, K2_AIRFLOW_PORT, because AIRFLOW__API__BASE_URL above is
  # built from it too. Log in as `admin`; the password is generated on first
  # start: docker exec k2-airflow-api-server cat /opt/airflow/simple_auth_manager_passwords.json.generated
  airflow-api-server:
    image: k2-airflow:3.3.2  # built by airflow-migrate
    container_name: k2-airflow-api-server
    hostname: airflow-api-server
    networks:
      - k2-net
    ports:
      - "127.0.0.1:${K2_AIRFLOW_PORT:-8090}:8080"
    environment: *airflow-env
    command: ["api-server"]
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "orchestration"
      com.k2.tier: "control-plane"
      com.k2.version: "v3"

  # Scheduler, and with LocalExecutor the four task slots too. The Docker
  # socket is the same privilege prefect-worker holds today: root on the Docker
  # engine, whatever the uid inside (ADR-034). It runs as the image's `airflow`
  # user; group_add gives it the socket's group, which is 0 on Docker Desktop
  # and `docker` on a Linux engine: set K2_DOCKER_GID (.env.example).
  #
  # stop_grace_period covers a task's on_kill, which stops the Spark driver
  # (up to 10 s) before the container goes: without it, `docker compose stop`
  # would leave a driver holding the lake lock.
  airflow-scheduler:
    image: k2-airflow:3.3.2  # built by airflow-migrate
    container_name: k2-airflow-scheduler
    hostname: airflow-scheduler
    networks:
      - k2-net
    volumes:
      - ./docker/airflow/dags:/opt/airflow/dags:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${K2_DOCKER_GID:-0}"
    environment:
      <<: *airflow-env
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    command: ["scheduler"]
    # lake-ddl too: lake_maintenance starts unpaused and runs its latest 03:00
    # slot as soon as it is parsed, and on a fresh clone that must not reach
    # the Spark container before the tables exist (retries=0: a failed run and
    # an alert on every fresh install). The cost is prefect-worker's reason
    # for not gating: a DDL that fails at boot leaves the scheduler down until
    # `docker compose up -d` runs again, which AirflowSchedulerHeartbeatLost
    # reports within 5 minutes. A later `up` of this service re-runs the
    # idempotent one-shots it depends on; `--no-deps` does not.
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
      lake-ddl:
        condition: service_completed_successfully
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "orchestration"
      com.k2.tier: "control-plane"
      com.k2.version: "v3"

  # Parses docker/airflow/dags into the database; in Airflow 3 the scheduler
  # no longer does. No socket, no published port.
  airflow-dag-processor:
    image: k2-airflow:3.3.2  # built by airflow-migrate
    container_name: k2-airflow-dag-processor
    hostname: airflow-dag-processor
    networks:
      - k2-net
    volumes:
      - ./docker/airflow/dags:/opt/airflow/dags:ro
    environment: *airflow-env
    command: ["dag-processor"]
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "orchestration"
      com.k2.tier: "control-plane"
      com.k2.version: "v3"

  # statsd in, Prometheus out (job airflow-statsd, :9102). Default names:
  # Airflow sends InfluxDB-style tags and the exporter makes them labels, so
  # `airflow.ti.finish,dag_id=lake_ingest,task_id=ingest,state=skipped:1|c`
  # becomes airflow_ti_finish{dag_id="lake_ingest",state="skipped",...}. The
  # mapping file has one rule, a ttl on the ti.running gauge, and says why.
  # It is a file bind mount: after editing it, recreate this service
  # (`docker compose up -d --force-recreate --no-deps airflow-statsd`).
  # Counters live in this process: a restart resets them, which the rules in
  # docker/prometheus/rules/airflow-alerts.yml allow for.
  airflow-statsd:
    image: prom/statsd-exporter:v0.31.0
    container_name: k2-airflow-statsd
    hostname: airflow-statsd
    command: ["--statsd.mapping-config=/etc/statsd-mapping.yml"]
    volumes:
      - ./docker/airflow/statsd-mapping.yml:/etc/statsd-mapping.yml:ro
    networks:
      - k2-net
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9102/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "observability"
      com.k2.tier: "control-plane"
      com.k2.version: "v3"

#############################################################################
# SERVICES - ETL LAYER
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # Spark + Iceberg - batch engine for the v3 lake ingest and maintenance
  # ───────────────────────────────────────────────────────────────────────
  spark-iceberg:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: k2-spark-iceberg:3.5.5_1.8.1  # local tag after build
    container_name: k2-spark-iceberg
    # Pinned off the capture cores (12-14) so a compaction or a heavy query
    # cannot steal a capture container's cycles; the Phase D noisy-neighbour
    # experiment (capacity-model.md) is what makes this claim measurable.
    cpuset: ${K2_HEAVY_CPUSET-0-11}
    hostname: spark-iceberg
    networks:
      - k2-net
    ports:
      - "18080:8080"    # Spark Master UI (mapped to 18080 to avoid conflict)
      - "4040:4040"     # Spark Application UI
      # The Spark image also starts its own sample-notebook server on 8888:
      # unauthenticated, root, and it holds the MinIO keys. Nothing in K2 uses
      # it, so it is not published. K2's notebooks are `make notebooks`, 8889.
    volumes:
      - ./docker/lake:/home/iceberg/lake          # ingest, maintenance, DDL, session builder
      # Silver derives canonical_symbol from the registry, not from the Avro
      # topics. File-level bind mount: edit in place needs --force-recreate
      # (CLAUDE.md, bind-mount gotcha).
      - ./config/instruments.yaml:/home/iceberg/config/instruments.yaml:ro
      - ./config/bars.yaml:/home/iceberg/config/bars.yaml:ro                # gold.bars thresholds (docker/lake/bars.py)
    environment:
      # MinIO / S3 credentials (Iceberg cold storage)
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
      - AWS_S3_ENDPOINT=http://minio:9000
      # Same credentials under their own names — docker/lake/spark_conf.py passes
      # them to the `lake` catalog's S3FileIO explicitly, not via the AWS chain.
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    # ClickHouse and PostgreSQL credentials went with docker/offload/: the lake
    # ingest reads Redpanda and writes Iceberg, and carries its exactly-once
    # state in the snapshot summary (ADR-022). Phase E's ClickHouse reload pulls
    # from the lake rather than being pushed into, so nothing here needs them.
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped
    labels:
      com.k2.service: "etl"
      com.k2.tier: "cold"
      com.k2.version: "v3"

#############################################################################
# SERVICES - v3 LAKE CATALOG (ADR-018)
#############################################################################
# Lakekeeper replaced v2's bind-mounted hadoop catalog (ADR-013) as the Iceberg
# catalog, making Iceberg-on-MinIO the system of record rather than a JDBC copy
# of ClickHouse. The hadoop catalog and the offload that fed it were deleted in
# Phase D — see the Outcome sections of ADR-014 and ADR-017.
#
# Its metadata lives in a `lakekeeper` database on the existing prefect-db —
# see docker/postgres/ddl/10-lakekeeper-db.sql. PostgreSQL init scripts only run
# when the data directory is first created, so on a stack whose postgres-data
# volume predates this change, create the database once by hand:
#
#   docker exec k2-prefect-db psql -U "$PREFECT_DB_USER" -d postgres \
#     -c 'CREATE DATABASE lakekeeper'

  # ───────────────────────────────────────────────────────────────────────
  # Lakekeeper Migrate - One-shot schema migration for the catalog DB
  # `migrate` creates the PostgreSQL extensions it needs itself, so the DDL
  # file above only has to create an empty database.
  # ───────────────────────────────────────────────────────────────────────
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.9
    container_name: k2-lakekeeper-migrate
    networks:
      - k2-net
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
    command: ["migrate"]
    depends_on:
      prefect-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: "no"
    labels:
      com.k2.service: "init"
      com.k2.tier: "cold"
      com.k2.version: "v3"

  # ───────────────────────────────────────────────────────────────────────
  # Lakekeeper - Iceberg REST catalog
  # ───────────────────────────────────────────────────────────────────────
  # Port published on loopback only: the catalog runs unauthenticated on a
  # single host, and the only host-side consumers are the Phase E DuckDB /
  # PyIceberg notebooks. Same reasoning as prefect-db's 127.0.0.1:15432.
  # 18181 rather than 8181 because Redpanda already owns host 8081/8082.
  #
  # The image is distroless (no shell), so the healthcheck is the binary's own
  # `healthcheck` subcommand — it GETs http://localhost:8181/health and exits
  # non-zero on failure. CMD form, not CMD-SHELL: there is no shell to run.
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.9
    container_name: k2-lakekeeper
    hostname: lakekeeper
    networks:
      - k2-net
    ports:
      - "127.0.0.1:18181:8181"
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
      # BASE_URI stays on the compose network: it is what the catalog puts in
      # the links it hands back to Spark and PyIceberg *inside* docker.
      # The SPA runs in the browser on the host, which cannot resolve
      # `lakekeeper`, so the UI gets its own published-port URL.
      LAKEKEEPER__BASE_URI: http://lakekeeper:8181
      LAKEKEEPER__UI__LAKEKEEPER_URL: http://localhost:18181
    command: ["serve"]
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    labels:
      com.k2.service: "catalog"
      com.k2.tier: "cold"
      com.k2.version: "v3"

  # ───────────────────────────────────────────────────────────────────────
  # Lake Init - One-shot: MinIO bucket, catalog bootstrap, warehouse, namespaces
  # ───────────────────────────────────────────────────────────────────────
  # Reuses the minio/minio image because it is the only image already in this
  # stack carrying BOTH `mc` (bucket create) and `curl` (Lakekeeper REST) —
  # minio/mc has no curl, curlimages/curl has no mc, and either alone would cost
  # a second one-shot service. Idempotent; see docker/lake/init-lake.sh.
  lake-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: k2-lake-init
    networks:
      - k2-net
    volumes:
      - ./docker/lake:/init:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/bash", "/init/init-lake.sh"]
    depends_on:
      minio:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: "no"
    labels:
      com.k2.service: "init"
      com.k2.tier: "cold"
      com.k2.version: "v3"

  # ───────────────────────────────────────────────────────────────────────
  # Lake DDL - One-shot: the four Iceberg tables (docker/lake/ddl/lake.sql)
  # ───────────────────────────────────────────────────────────────────────
  # Runs in the Spark image because the DDL uses Iceberg's Spark extensions —
  # `SET IDENTIFIER FIELDS`, `WRITE DISTRIBUTED BY PARTITION LOCALLY ORDERED BY`
  # — which the REST API does not expose. That is why table DDL costs a JVM
  # start here where docker/lake/init-lake.sh could create namespaces with curl.
  #
  # Idempotent (CREATE TABLE IF NOT EXISTS + converging ALTERs); verified as a
  # no-op on re-run against a live warehouse.
  lake-ddl:
    image: k2-spark-iceberg:3.5.5_1.8.1  # built by the spark-iceberg service
    container_name: k2-lake-ddl
    # Pinned off the capture cores (12-14) so a compaction or a heavy query
    # cannot steal a capture container's cycles; the Phase D noisy-neighbour
    # experiment (capacity-model.md) is what makes this claim measurable.
    cpuset: ${K2_HEAVY_CPUSET-0-11}
    networks:
      - k2-net
    volumes:
      - ./docker/lake:/home/iceberg/lake:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # This container is capped at 1 GiB, not the 4 GiB spark-iceberg gets, so
      # spark_conf.py's 768m default plus ~550 MB of JVM overhead would not fit.
      # The DDL is nine catalog round-trips and no data, so the heap is not the
      # constraint here — see the sizing comment in docker/lake/spark_conf.py.
      K2_LAKE_DRIVER_MEMORY: 512m
    entrypoint: ["python3", "/home/iceberg/lake/apply_ddl.py"]
    depends_on:
      lake-init:
        condition: service_completed_successfully
      spark-iceberg:
        condition: service_started  # only for the image build
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    restart: "no"
    labels:
      com.k2.service: "init"
      com.k2.tier: "cold"
      com.k2.version: "v3"

  # ───────────────────────────────────────────────────────────────────────
  # Lake metrics exporter — Prometheus job 'lake-metrics'
  # ───────────────────────────────────────────────────────────────────────
  # Derives every metric from Iceberg snapshot summaries over the Lakekeeper
  # REST API rather than from in-process counters: Prefect runs each job in a
  # subprocess that exits long before Prometheus scrapes it. A separate service,
  # not a sidecar in prefect-worker, so a worker crash still leaves the rising
  # commit age visible. Its own pinned image (docker/lake-metrics/) since
  # ADR-034, so it outlives whichever orchestrator runs the jobs; until then it
  # borrowed the Prefect worker image for its prometheus-client.
  #
  # NOT the Spark image, even though docker/lake/*.py otherwise runs there:
  # reading the catalog through PyIceberg needs a FileIO, and
  # `import pyiceberg.io.pyarrow` alone measures 122 MB RSS against this 128 MB
  # limit. urllib against the REST API costs 27 MB doing the whole refresh.
  #
  # minio-data is mounted read-only purely so `os.statvfs` can report free space
  # on the filesystem the lake actually lands on. Nothing reads the objects.
  lake-metrics:
    build:
      context: .
      dockerfile: docker/lake-metrics/Dockerfile
    image: k2-lake-metrics:3.15.1  # local tag after build: the Python it runs
    container_name: k2-lake-metrics
    hostname: lake-metrics
    networks:
      - k2-net
    volumes:
      - ./docker/lake:/opt/lake:ro
      - minio-data:/minio-data:ro
    environment:
      K2_LAKE_CATALOG_URI: http://lakekeeper:8181/catalog
      K2_LAKE_WAREHOUSE: k2
      K2_LAKE_DISK_PATH: /minio-data
    command: ["python", "/opt/lake/metrics.py", "--serve"]
    depends_on:
      lakekeeper:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    restart: unless-stopped
    labels:
      com.k2.service: "observability"
      com.k2.tier: "cold"
      com.k2.version: "v3"

#############################################################################
# SERVICES - SQL OVER THE LAKE (ADR-035)
#############################################################################
  # One Trino node, coordinator and worker in one JVM, over the Lakekeeper REST
  # catalog with the static MinIO keys (docker/trino/README.md). Catalog `lake`
  # (warehouse k2) is read-only at the connector; catalog `marts` (warehouse
  # marts, same bucket, prefix warehouse/marts) is the only place it writes.
  # Checked by `make test-trino`. Identity is the X-Trino-User header, not
  # authenticated, so the port is loopback only, like Airflow's.
  #
  # Heap 2816M (etc/jvm.config) under the 4G limit leaves 1.25 GiB for
  # metaspace, code cache, thread stacks and direct buffers. The 2026-11-25 spike
  # ran every single query at 1 CPU / 2 GiB; the rest is for concurrent dbt
  # threads (ADR-035).
  trino:
    image: trinodb/trino:484
    container_name: k2-trino
    hostname: trino
    # Off the capture cores, like the other two engines.
    cpuset: ${K2_HEAVY_CPUSET-0-11}
    networks:
      - k2-net
    ports:
      - "127.0.0.1:${K2_TRINO_PORT:-8088}:8080"
    volumes:
      - ./docker/trino/etc:/etc/trino:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      lakekeeper:
        condition: service_healthy
      minio:
        condition: service_healthy
      lake-init:   # creates warehouse `marts`
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "query"
      com.k2.tier: "cold"
      com.k2.version: "v3"

#############################################################################
# SERVICES - TOPIC INITIALIZATION
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # Redpanda Init - One-shot: topic creation + Avro schema registration
  # Runs once at startup; feed handlers depend on service_completed_successfully
  # ───────────────────────────────────────────────────────────────────────
  # The script moved out of this file in Phase B: v3 adds Avro subject
  # registration against the schema registry, which is more than a compose
  # inline command should carry. After editing docker/redpanda/init.sh, run
  # `docker compose up -d --force-recreate --no-deps redpanda-init`.
  #
  # A *directory* bind mount goes stale after a write-then-rename save exactly
  # like the file-level config/instruments.yaml mount does — the staleness is
  # held by the file-sharing layer for as long as ANY container has that host
  # directory mounted, so a recreated container reads the old file too if a
  # sibling still holds the path. `./docker/redpanda` is mounted by this service
  # and nothing else (verified: `grep -n docker/redpanda docker-compose.yml`),
  # so recreating redpanda-init alone is sufficient here. `./docker/lake` is
  # NOT — see docker/README.md "A bind-mounted script runs its old contents".
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.4
    container_name: k2-redpanda-init
    networks:
      - k2-net
    volumes:
      - ./docker/redpanda:/init:ro
      - ./schemas/avro:/schemas:ro
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/init.sh"]
    # Declared like the other one-shots so the bootstrap peak is arithmetic, not
    # a guess — see the RESOURCE SUMMARY footer. rpk + curl in a shell loop.
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: "no"
    labels:
      com.k2.service: "init"
      com.k2.tier: "hot"
      com.k2.version: "v2"

#############################################################################
# SERVICES - RUST CAPTURE (v3 — the only capture tier)
#############################################################################
# See docs/plans/2026-08-26-v3-quant-research-platform/002-phase-c-rust-capture.md.
# Three `k2-capture:v3` containers, one per exchange, carrying trades and L2 book
# on one connection each. They ran beside the three Kotlin feed handlers for a
# labelled 2-hour parity window; the handlers retired on that gate and are
# archived in legacy/v2-kotlin/, no longer in this file. ADR-019's Outcome
# carries the window's numbers.
#
# The v2 topics they wrote (`market.crypto.trades.<ex>[.raw]`) and the ClickHouse
# `k2` database fed from them are FROZEN, not dropped: no producer writes them
# from this commit on, and Phase E deletes them.
#
# `./config` is a *directory* bind mount here (all of config/, not just
# instruments.yaml). Directory mounts go stale the same way the file-level
# mount does — see docker/README.md "A bind-mounted script runs its old
# contents after you edited it": a write-then-rename edit survives only if
# `--force-recreate` covers every service still holding the directory.

  # ───────────────────────────────────────────────────────────────────────
  # Binance Capture - Rust k2-capture (trades + L2 book, one connection)
  # ───────────────────────────────────────────────────────────────────────
  capture-binance:
    build: *capture-build
    image: k2-capture:v3
    container_name: k2-capture-binance
    hostname: capture-binance
    networks:
      - k2-net
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - K2_EXCHANGE=binance
      - K2_INSTRUMENTS_FILE=/app/config/instruments.yaml
      - K2_KAFKA_BROKERS=redpanda:9092
      - K2_SCHEMA_REGISTRY_URL=http://redpanda:8081
      - K2_METRICS_PORT=8082
      - K2_SNAPSHOT_INTERVAL_MS=1000
      - K2_TOPIC_PREFIX=market.crypto.v3
      - RUST_LOG=info
    volumes:
      - ./config:/app/config:ro
    cpuset: ${K2_CAPTURE_CPUSET-12-14}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "/k2-capture", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "capture"
      com.k2.exchange: "binance"
      com.k2.tier: "hot"
      com.k2.version: "v3"

  # ───────────────────────────────────────────────────────────────────────
  # Kraken Capture - Rust k2-capture (trades + L2 book, one connection)
  # ───────────────────────────────────────────────────────────────────────
  capture-kraken:
    image: k2-capture:v3
    container_name: k2-capture-kraken
    hostname: capture-kraken
    networks:
      - k2-net
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - K2_EXCHANGE=kraken
      - K2_INSTRUMENTS_FILE=/app/config/instruments.yaml
      - K2_KAFKA_BROKERS=redpanda:9092
      - K2_SCHEMA_REGISTRY_URL=http://redpanda:8081
      - K2_METRICS_PORT=8082
      - K2_SNAPSHOT_INTERVAL_MS=1000
      - K2_TOPIC_PREFIX=market.crypto.v3
      - RUST_LOG=info
    volumes:
      - ./config:/app/config:ro
    cpuset: ${K2_CAPTURE_CPUSET-12-14}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "/k2-capture", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "capture"
      com.k2.exchange: "kraken"
      com.k2.tier: "hot"
      com.k2.version: "v3"

  # ───────────────────────────────────────────────────────────────────────
  # Coinbase Capture - Rust k2-capture (trades + L2 book, one connection)
  # ───────────────────────────────────────────────────────────────────────
  # 512M not 256M: Coinbase's full-depth BTreeMap<i64,i64> book (vs. Binance's
  # top-20 no-state and Kraken's depth=25) is the larger resident structure.
  capture-coinbase:
    image: k2-capture:v3
    container_name: k2-capture-coinbase
    hostname: capture-coinbase
    networks:
      - k2-net
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - K2_EXCHANGE=coinbase
      - K2_INSTRUMENTS_FILE=/app/config/instruments.yaml
      - K2_KAFKA_BROKERS=redpanda:9092
      - K2_SCHEMA_REGISTRY_URL=http://redpanda:8081
      - K2_METRICS_PORT=8082
      - K2_SNAPSHOT_INTERVAL_MS=1000
      - K2_TOPIC_PREFIX=market.crypto.v3
      - RUST_LOG=info
    volumes:
      - ./config:/app/config:ro
    cpuset: ${K2_CAPTURE_CPUSET-12-14}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "/k2-capture", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "capture"
      com.k2.exchange: "coinbase"
      com.k2.tier: "hot"
      com.k2.version: "v3"

