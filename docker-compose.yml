# K2 Market Data Platform v2 - Consolidated Architecture
# Version: 2.0.0-consolidated
# Last Updated: 2026-02-12
# Target: 25 CPU / 48 GiB at the bootstrap peak (ADR-045; was 20 CPU / 36 GiB, ADR-034, and 16 CPU / 40 GB, ADR-010)
#
# Published ports: every `ports:` entry is bound to 127.0.0.1, in every profile.
# Containers reach each other by service name (minio:9000 on k2-net,
# lakekeeper:8181 on k2-catalog only) and never through a published port; host
# tools use localhost. A bare "9000:9000" listens on every interface, which put the MinIO
# API and console, and every unauthenticated UI here, on the local network
# until 2026-11-26. scripts/check-budget.py fails CI on a port without the
# prefix. Loopback stops other machines, not other users of this host
# (SECURITY.md).

#############################################################################
# NETWORKS
#############################################################################
networks:
  k2-net:
    driver: bridge
  # The catalog's own network (phase 001, docs/development/phase-001-interfaces.md A8;
  # ADR-059 part 7). Lakekeeper has no authentication, so the network is its fence:
  # it is on k2-catalog alone, with no host port, and only the platform's own services
  # join it (lakekeeper, lakekeeper-migrate, prefect-db, minio, trino, spark-iceberg,
  # lake-init, tools, dbt-runner). `fetch`, caller-facing services and third-party
  # images never join it.
  k2-catalog:
    driver: bridge

#############################################################################
# VOLUMES
#############################################################################
volumes:
  # Redpanda data
  redpanda-data:
    driver: local

  # ClickHouse data
  clickhouse-data:
    driver: local
  clickhouse-logs:
    driver: local

  # Monitoring data
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  # Alertmanager's silences and notification log, so a silence outlives a recreate
  alertmanager-data:
    driver: local

  # Orchestration data
  postgres-data:
    driver: local

  # Object storage data
  minio-data:
    driver: local

  # The fetch one-shot's spool, /spool/<dagId>/<runId>/ (phase-001-interfaces.md): fetch writes
  # it; the operator mounts it as <project>_k2-spool, so it keeps compose's default name.
  k2-spool:
    driver: local

  # The generated sites (W3-11), <name>/current/ of each: catalog/ by k2site.py in the tools
  # one-shot, dbt-docs/ by `k2-dbt docs` in a dbt-runner one-shot, both run by deploy as the host
  # user; k2-api serves them read-only. Public pages only. Its root is mode 1777 from whichever
  # image mounts it first, empty (tools /site, k2-api /srv/k2-site).
  k2-site:
    driver: local


# Every container's local log is capped. Docker's json-file driver keeps a container's
# output in one file that grows without limit unless told otherwise; on 2026-11-26 the
# catalog's log alone was growing about 15 GiB a day (measured over ingest-only windows
# with `docker logs --tail N --timestamps`). 50 MB a file, five files, older files
# compressed: at most about 250 MB a container. A cap takes effect only when a container
# is recreated, not on restart. json-file is kept (not `local`) so a log collector can
# tail the files later.
x-logging: &k2-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

# ── the releases root (phase 001, A1) ──────────────────────────────────────
# Created once by `make deploy`, never recreated (a bind mount pins its inode, the
# CLAUDE.md gotcha), and mounted whole, read-only, at /k2/releases: a service reads
# a release through its pointer, never a release directory of its own. Not created
# here if missing (docker would make it root-owned). `tools` is the one read-write
# mount. Mounted by every service that reads a pointer (scripts/deploy.py POINTERS):
# trino, airflow-scheduler, airflow-dag-processor, spark-iceberg, prometheus, and the
# profiled stubs; and by lake-init, for the storage plan (the trino pointer's, or the
# release deploy names in K2_STORAGE_PLAN). Airflow's DAG folder and Prometheus's rules
# are read through their pointers (`platform/` in the release, k2gen PLATFORM_CODE); a
# Spark task runs the scripts of the release its run pinned, /k2/releases/<id>/platform/.
x-k2-releases-ro: &k2-releases-ro
  type: bind
  source: ${K2_RELEASES:-${HOME}/k2-releases}
  target: /k2/releases
  read_only: true
  bind:
    create_host_path: false

# ── shared build definition for the three capture-* services ────────────────
# Context is the REPOSITORY ROOT, not the crate: src/record.rs compiles the wire
# contract in with `include_str!("../../../schemas/avro/trade.avsc")`, and
# services/capture-rust/Dockerfile.dockerignore is what keeps the context small.
# One image for all three capture services. Only capture-binance carries a
# `build:`; kraken and coinbase reuse the tag. Three `build:` blocks for one tag
# race on export in a fresh clone (`image "k2-capture:v3": already exists`) and
# abort `docker compose up` before any container starts.
x-capture-build: &capture-build
  context: .
  dockerfile: services/capture-rust/Dockerfile
  args:
    # Stamped into k2_capture_build_info. `git describe --always --dirty` rather
    # than a bare sha: an image built from a dirty tree must not claim to be the
    # commit it was started from. `make build-capture` and scripts/dev-up.sh
    # export it; unset ships `unknown`, which is honest.
    K2_GIT_SHA: ${K2_GIT_SHA:-unknown}

# ── shared environment for the four airflow-* services (ADR-034) ────────────
# One image, k2-airflow:3.3.2, built by airflow-migrate only (the same
# one-build-per-tag rule as the capture image above). The scheduler, the
# api-server and the dag-processor must agree on every line here: the JWT
# secret signs the tokens the scheduler gives each task and the api-server
# checks, and the api secret key signs the request that fetches a task's log
# from the scheduler's log server.
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__PARALLELISM: "4"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@prefect-db:5432/airflow
  # base_url is what the browser on the host uses. Tasks must not derive the
  # execution API from it: localhost inside the scheduler is the scheduler.
  AIRFLOW__API__BASE_URL: http://localhost:${K2_AIRFLOW_PORT:-8090}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
  # The DAG folder is the airflow pointer's release (ADR-058), read through the releases root:
  # the default bundle, dags-folder, follows it. A dangling path (no pointer yet, or a release
  # without platform/) is an empty folder to Airflow 3.3: the bundle logs a warning, no file is
  # found, no DAG, and every service starts healthy. Files are listed every 300 s
  # ([dag_processor] refresh_interval) and each parsed every 30 s, so a swap reaches factory.py,
  # whose path does not change, within 30 s.
  AIRFLOW__CORE__DAGS_FOLDER: /k2/releases/pointers/airflow/platform/docker/airflow/dags
  # A scheduler that dies under a running task leaves it running until the orphan check resets
  # it, by default every 300 s (scripts/verify/oneshot-slots.sh, W0-8).
  AIRFLOW__SCHEDULER__ORPHANED_TASKS_CHECK_INTERVAL: "30"
  # Tags in InfluxDB form, which the statsd exporter turns into labels, and no
  # legacy names: those embed dag_id in the metric name and would arrive twice.
  AIRFLOW__METRICS__STATSD_ON: "True"
  AIRFLOW__METRICS__STATSD_HOST: airflow-statsd
  AIRFLOW__METRICS__STATSD_PORT: "9125"
  AIRFLOW__METRICS__STATSD_INFLUXDB_ENABLED: "True"
  AIRFLOW__METRICS__LEGACY_NAMES_ON: "False"
  # astronomer-cosmos, in the image since ADR-034's dbt DAG (retired; no DAG
  # uses cosmos today), sends usage telemetry and dbt anonymous usage stats
  # unless told not to, and both are off.
  # Cosmos keys its dbt ls cache on a hash of the project's files; a host
  # checkout's dbt/.venv is no part of the project.
  AIRFLOW__COSMOS__ENABLE_TELEMETRY: "False"
  AIRFLOW__COSMOS__PROJECT_HASH_EXCLUDED_DIRS: ".venv"
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

#############################################################################
# SERVICES - STREAMING BACKBONE
#############################################################################
services:

  # ───────────────────────────────────────────────────────────────────────
  # Redpanda - Kafka-compatible streaming platform (C++, single binary)
  # ───────────────────────────────────────────────────────────────────────
  redpanda:
    logging: *k2-logging
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.4
    container_name: k2-redpanda
    hostname: redpanda
    networks:
      - k2-net
    ports:
      - "127.0.0.1:9092:9092"     # Kafka API
      - "127.0.0.1:19092:19092"   # Kafka API, external listener advertised as localhost:19092 (host tooling)
      - "127.0.0.1:9644:9644"     # Admin API
      - "127.0.0.1:8081:8081"     # Schema Registry
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1500M
    environment:
      REDPANDA_PANDAPROXY_CLIENT_RETRIES: 5
      REDPANDA_PANDAPROXY_CLIENT_RETRY_BASE_BACKOFF_MS: 100
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      com.k2.service: "streaming"
      com.k2.tier: "hot"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Redpanda Console - Web UI for Redpanda/Kafka
  # ───────────────────────────────────────────────────────────────────────
  redpanda-console:
    logging: *k2-logging
    image: docker.redpanda.com/redpandadata/console:v3.5.1
    container_name: k2-redpanda-console
    hostname: console
    networks:
      - k2-net
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      # Console v3 moved the schema registry out from under `kafka.`:
      # KAFKA_SCHEMAREGISTRY_* is silently ignored and the UI shows
      # "Schema Registry: Not configured" with every Avro value undecodable.
      SCHEMAREGISTRY_ENABLED: true
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/admin/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "ui"
      com.k2.tier: "management"
      com.k2.version: "v2"

#############################################################################
# SERVICES - WARM STORAGE (ClickHouse)
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # ClickHouse - OLAP database for real-time analytics
  # ───────────────────────────────────────────────────────────────────────
  # Paused for the platform build (ADR-057): behind the profile `hot-gold`, so
  # `docker compose up` and `make up` leave it stopped; its volumes are kept.
  # `docker compose --profile hot-gold up -d clickhouse` starts it; after 7
  # days stopped its consumer-group offsets are due to expire, and a start
  # then leaves a hole (ADR-057, Decision 4).
  # The image line stays: scripts/clickhouse-schema-test.sh reads its tag.
  # No default-profile service depends on it.
  clickhouse:
    profiles: ["hot-gold"]
    logging: *k2-logging
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: k2-clickhouse
    # Pinned off the capture cores (12-14) so a compaction or a heavy query
    # cannot steal a capture container's cycles; the Phase D noisy-neighbour
    # experiment (capacity-model.md) is what makes this claim measurable.
    cpuset: ${K2_HEAVY_CPUSET-0-11}
    hostname: clickhouse
    networks:
      - k2-net
    ports:
      - "127.0.0.1:8123:8123"     # HTTP interface
      - "127.0.0.1:9002:9000"     # Native protocol (9002 to avoid MinIO conflict)
      - "127.0.0.1:9363:9363"     # Prometheus metrics
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.d/k2-config.xml:ro
      # Profiles (default 6 GB, quant 3 GiB read-only) and the quant user.
      # Password from K2_QUANT_PASSWORD below; CLICKHOUSE_* still make `default`.
      - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/k2-users.xml:ro
      - ./docker/clickhouse/ddl:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: gold
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      K2_QUANT_PASSWORD: ${K2_QUANT_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      com.k2.service: "storage"
      com.k2.tier: "warm"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # MinIO - S3-compatible object storage for Iceberg
  # ───────────────────────────────────────────────────────────────────────
  # Until Phase B, MinIO was provisioned but carried no data — the v2 Iceberg
  # warehouse was a bind-mounted hadoop catalog (ADR-013), deleted in Phase D.
  # The v3 `k2-lake` bucket behind Lakekeeper is its first real user.
  # The image is the project's own mirror of minio/minio RELEASE.2025-09-07T16-13-09Z, pinned by digest alone
  # (the form the release manifest takes; a tag beside a digest is refused by its schema): the
  # vendor's repository stopped serving it (found 2026-11-27; NOTICE). linux/amd64 only.
  minio:
    logging: *k2-logging
    image: ghcr.io/rjdscott/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2  # console still present at :9001
    container_name: k2-minio
    hostname: minio
    networks:
      - k2-net
      - k2-catalog  # Lakekeeper reaches it (storage checks, purges); so do lake-init and drop.sh, from there
    ports:
      - "127.0.0.1:9000:9000"     # API
      - "127.0.0.1:9001:9001"     # Console
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "storage"
      com.k2.tier: "cold"
      com.k2.version: "v2"

#############################################################################
# SERVICES - MONITORING & OBSERVABILITY
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # Prometheus - Metrics collection
  # ───────────────────────────────────────────────────────────────────────
  prometheus:
    logging: *k2-logging
    image: prom/prometheus:v3.2.0
    container_name: k2-prometheus
    hostname: prometheus
    networks:
      - k2-net
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The rules: the prometheus pointer's platform/docker/prometheus/rules/*.yml
      # (prometheus.yml rule_files), reread on the SIGHUP deploy sends at each swap.
      - *k2-releases-ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "monitoring"
      com.k2.tier: "observability"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Grafana - Metrics visualization
  # ───────────────────────────────────────────────────────────────────────
  grafana:
    logging: *k2-logging
    image: grafana/grafana:11.5.0
    container_name: k2-grafana
    hostname: grafana
    networks:
      - k2-net
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_LOG_LEVEL: info
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      com.k2.service: "monitoring"
      com.k2.tier: "observability"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # cAdvisor - per-container CPU and memory, against each compose limit
  # ───────────────────────────────────────────────────────────────────────
  # Prometheus job 'cadvisor'; the K2 Resources dashboard reads it, and the
  # limits it plots are container_spec_cpu_quota / _period and
  # container_spec_memory_limit_bytes, read from the cgroups, not retyped.
  #
  # No published port: only Prometheus reads it, over k2-net. Not privileged
  # and no /dev/kmsg, so no OOM-event counter; every capability dropped and the
  # root filesystem read-only. The two sockets are what names a cgroup
  # `k2-clickhouse` (v0.61's Docker factory goes through containerd), and
  # `:ro` does not narrow a socket: whoever holds docker.sock can drive the
  # engine, the same privilege airflow-scheduler holds.
  # cpu and memory only, one housekeeping pass per 15 s scrape instead of
  # cAdvisor's default 1 s, and Prometheus keeps seven series names of the
  # ~40 it exports (metric_relabel_configs in docker/prometheus/prometheus.yml).
  # Measured standalone on 2026-11-25: 18 MiB RSS, under 0.3% of a core.
  cadvisor:
    logging: *k2-logging
    image: ghcr.io/google/cadvisor:v0.61.1
    container_name: k2-cadvisor
    hostname: cadvisor
    networks:
      - k2-net
    volumes:
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    command:
      - --housekeeping_interval=15s
      - --max_housekeeping_interval=15s
      - --docker_only=true
      - --enable_metrics=cpu,memory,oom_event
      - --store_container_labels=false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "monitoring"
      com.k2.tier: "observability"
      com.k2.version: "v3"

  # ───────────────────────────────────────────────────────────────────────
  # Alertmanager - every alert Prometheus fires, to one Slack channel
  # ───────────────────────────────────────────────────────────────────────
  # Routing, inhibition and the message: docker/alertmanager/alertmanager.yml.
  # Path, install, test and silence: docs/runbooks/where-an-alert-goes.md.
  #
  # The Slack webhook URL is a local secret, never in git: the directory
  # ${K2_SECRETS}/alertmanager/ is mounted read-only, and only it, so the
  # container sees that one file and none of the other secrets. A directory, not
  # the file: a file mount pins the inode (CLAUDE.md). On Docker Desktop even the
  # directory mount kept serving the old file after a rename over it (2026-11-26),
  # so `make alerts-install-webhook` writes the file in place. Alertmanager reads
  # it at every notification, so a new URL takes effect with no restart. If the directory
  # is missing Docker creates it empty (on Docker Desktop, owned by the user),
  # Alertmanager starts, and `make alert-test` says the webhook is not installed.
  #
  # On k2-net only: it must reach Slack, and never joins k2-catalog. Clustering
  # off (one instance, no gossip port). Measured on 2026-11-26 in the throwaway
  # copy `make alert-test-standin` runs: 19.5 MiB, CPU ~0%.
  alertmanager:
    logging: *k2-logging
    image: prom/alertmanager:v0.35.1@sha256:4e3d029e69c7f61dd53a2b31a3dc427a2b81736cffca185c0854075e07969e36
    container_name: k2-alertmanager
    hostname: alertmanager
    networks:
      - k2-net
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - alertmanager-data:/alertmanager
      - ./docker/alertmanager:/etc/alertmanager:ro
      - ${K2_SECRETS:-${HOME}/k2-secrets}/alertmanager:/run/k2-secrets:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--cluster.listen-address='
      - '--auto-gomemlimit'
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "monitoring"
      com.k2.tier: "observability"
      com.k2.version: "v3"

#############################################################################
# SERVICES - ORCHESTRATION LAYER
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # PostgreSQL - Airflow and Lakekeeper metadata
  # ───────────────────────────────────────────────────────────────────────
  # The name is historical. The service, its `prefect` role and the PREFECT_DB_*
  # variables are kept from before Airflow (legacy/prefect/): the role is physically named `prefect`
  # in every existing volume and the Lakekeeper URLs below carry it (ADR-034, Consequences).
  #
  # max_connections 200, up from the default 100, for Airflow's pools beside
  # the catalog's. The `airflow` role is capped at 100 of them
  # (docker/airflow/init-db.sh), so Airflow cannot starve the catalog. Takes
  # effect on recreate: `docker compose up -d --force-recreate --no-deps prefect-db`.
  prefect-db:
    logging: *k2-logging
    # 15.19-alpine as k2-prefect-db runs it (pulled 2026-08-13). By digest
    # alone: the 15.19-alpine tag has since moved to a rebuild, and a tag that
    # disagrees with its digest only confuses.
    image: postgres@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    container_name: k2-prefect-db
    hostname: prefect-db
    networks:
      - k2-net      # Airflow's database
      - k2-catalog  # the catalog's database
    ports:
      - "127.0.0.1:15432:5432"   # host access only; 5432 is often taken locally
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/ddl:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${PREFECT_DB_USER}
      POSTGRES_PASSWORD: ${PREFECT_DB_PASSWORD}
      POSTGRES_DB: ${PREFECT_DB_NAME}
    command: ["postgres", "-c", "max_connections=200"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M   # 1G until ADR-034: the extra connections each hold a backend
        reservations:
          cpus: '0.5'
          memory: 512M
    # TCP, not the default socket probe. `pg_isready -U $$POSTGRES_USER` talks to
    # the Unix socket, which the *initdb temp server* is already listening on —
    # that server runs with listen_addresses='' while it executes
    # /docker-entrypoint-initdb.d/*.sql. So a socket probe reports healthy before
    # 10-lakekeeper-db.sql has run and before postgres listens on 5432 at all.
    # `lakekeeper-migrate` connects over TCP, does not retry (fails in ~0.3 s with
    # "Error creating write pool") and is `restart: "no"` — on a fresh clone the
    # whole v3 lake tier would silently never come up. -h 127.0.0.1 forces the
    # probe down the same path the dependants use; -d the app DB makes it also
    # prove the database exists, not merely that a postmaster answers.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "orchestration"
      com.k2.tier: "control-plane"
      com.k2.version: "v2"

  # ───────────────────────────────────────────────────────────────────────
  # Airflow 3 - the lake schedules (ADR-034)
  # ───────────────────────────────────────────────────────────────────────
  # The scheduler of the lake writes. Its old DAGs (the 5-minute ingest, the
  # nightly maintenance, the rebuild and the hourly dbt marts) are retired to
  # legacy/v3-lake-ingest/airflow/ (ADR-056). The DAGs are the release's: one per
  # product from docker/airflow/dags/factory.py, read through the airflow pointer
  # (AIRFLOW__CORE__DAGS_FOLDER above), never from the checkout.
  # docs/runbooks/airflow-scheduling.md has the recoveries.
  #
  # LocalExecutor, so tasks run inside airflow-scheduler, and that is the only
  # service given the Docker socket. No triggerer: nothing here defers.
  #
  # ./dbt is a directory bind mount held by the scheduler and the dag-processor,
  # read-only: cosmos ran each dbt command in a temporary copy of symlinks, where
  # dbt writes target/ and logs/. A checkout switch or a write-then-rename edit
  # needs both recreated (CLAUDE.md, bind-mount gotcha).

  # One-shot: creates the `airflow` role and database on prefect-db when
  # missing (docker/airflow/init-db.sh), then `airflow db migrate`, then the three
  # pools the factory's tasks name (phase-001-interfaces.md, "Run-time contracts"):
  # a task in a pool that does not exist never schedules. `pools set` creates or
  # updates, so every run converges them.
  airflow-migrate:
    logging: *k2-logging
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: k2-airflow:3.3.2
    container_name: k2-airflow-migrate
    networks:
      - k2-net
    environment:
      <<: *airflow-env
      PGHOST: prefect-db
      PGUSER: ${PREFECT_DB_USER}
      PGPASSWORD: ${PREFECT_DB_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    command:
      - bash
      - -c
      - >-
        bash /opt/k2/init-db.sh
        && airflow pools set lake_spark 1 'Spark tasks: one driver at a time in spark-iceberg'
        && airflow pools set fetch 1 'fetch one-shots'
        && airflow pools set dbt 2 'dbt-runner one-shots'
    depends_on:
      prefect-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    restart: "no"
    labels:
      com.k2.service: "init"
      com.k2.tier: "control-plane"
      com.k2.version: "v3"

  # UI and REST API, plus the execution API every task reports to. Loopback
  # only: a trigger here runs `docker exec` in the Spark container. Host port
  # is one variable, K2_AIRFLOW_PORT, because AIRFLOW__API__BASE_URL above is
  # built from it too. Log in as `admin`; the password is generated on first
  # start: docker exec k2-airflow-api-server cat /opt/airflow/simple_auth_manager_passwords.json.generated
  airflow-api-server:
    logging: *k2-logging
    image: k2-airflow:3.3.2  # built by airflow-migrate
    container_name: k2-airflow-api-server
    hostname: airflow-api-server
    networks:
      - k2-net
    ports:
      - "127.0.0.1:${K2_AIRFLOW_PORT:-8090}:8080"
    environment: *airflow-env
    command: ["api-server"]
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "orchestration"
      com.k2.tier: "control-plane"
      com.k2.version: "v3"

  # Scheduler, and with LocalExecutor the four task slots too. The Docker
  # socket is root on the Docker
  # engine, whatever the uid inside (ADR-034). group_add gives it the socket's
  # group, which is 0 on Docker Desktop and `docker` on a Linux engine: set
  # K2_DOCKER_GID (.env.example).
  #
  # It runs as the host user, K2_RUN_UID, with group 0 (the image supports any
  # uid with group 0, as Airflow's own compose file runs it): `record` reads
  # svc.runs's password file, mode 600 and owned by the host user, as the
  # one-shots that mount secrets do (docker/airflow/dags/oneshot.py). The socket
  # already makes it root on the engine, so the uid widens nothing; the other
  # Airflow services keep the image's `airflow` user and mount no secret.
  #
  # The environment past the shared block is the one-shot operator's: the host
  # side of its mounts (K2_RELEASES, K2_SECRETS, as the daemon resolves a bind
  # source on the host), the project its networks and spool volume belong to,
  # the uid its secret-mounting kinds run as, and dbt-runner's fixed values,
  # passed on by name (the same values as the dbt-runner service's). K2_TRINO_HOST,
  # K2_TRINO_INTERNAL_PORT and K2_RUNS_USER are also `record`'s, through k2runs.connect():
  # Trino is on k2-net too, so the scheduler stays off k2-catalog. No storage key.
  #
  # stop_grace_period covers a task's on_kill, which stops the Spark driver
  # (up to 10 s) before the container goes: without it, `docker compose stop`
  # would leave a driver holding the lake lock.
  airflow-scheduler:
    logging: *k2-logging
    image: k2-airflow:3.3.2  # built by airflow-migrate
    container_name: k2-airflow-scheduler
    hostname: airflow-scheduler
    user: "${K2_RUN_UID:?set K2_RUN_UID in .env (make engine-keys)}:0"
    networks:
      - k2-net
    volumes:
      - ./dbt:/opt/k2/dbt:ro
      - *k2-releases-ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Each file by name, never created when missing (tests/test_secret_mounts.py).
      - type: bind
        source: ${K2_SECRETS:-${HOME}/k2-secrets}/principals/svc.runs.password
        target: /run/k2-secrets/runs.password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${K2_SECRETS:-${HOME}/k2-secrets}/tls/ca.pem
        target: /run/k2-secrets/tls/ca.pem
        read_only: true
        bind:
          create_host_path: false
    group_add:
      - "${K2_DOCKER_GID:-0}"
    environment:
      <<: *airflow-env
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
      K2_RELEASES: ${K2_RELEASES:-${HOME}/k2-releases}
      K2_SECRETS: ${K2_SECRETS:-${HOME}/k2-secrets}
      K2_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
      K2_RUN_UID: ${K2_RUN_UID:?set K2_RUN_UID in .env (make engine-keys)}
      K2_RUN_GID: ${K2_RUN_GID:?set K2_RUN_GID in .env (make engine-keys)}
      K2_TRINO_HOST: trino
      K2_TRINO_INTERNAL_PORT: "8443"
      K2_RUNS_USER: svc.runs
      K2_CATALOG_URI: http://lakekeeper:8181/catalog
    command: ["scheduler"]
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "orchestration"
      com.k2.tier: "control-plane"
      com.k2.version: "v3"

  # Parses the airflow pointer's DAG folder into the database; in Airflow 3 the
  # scheduler no longer does. No socket, no published port, no secret and none of
  # the one-shot environment: parsing reads only the release's files.
  airflow-dag-processor:
    logging: *k2-logging
    image: k2-airflow:3.3.2  # built by airflow-migrate
    container_name: k2-airflow-dag-processor
    hostname: airflow-dag-processor
    networks:
      - k2-net
    volumes:
      - ./dbt:/opt/k2/dbt:ro
      - *k2-releases-ro
    environment: *airflow-env
    command: ["dag-processor"]
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "orchestration"
      com.k2.tier: "control-plane"
      com.k2.version: "v3"

  # statsd in, Prometheus out (job airflow-statsd, :9102). Default names:
  # Airflow sends InfluxDB-style tags and the exporter makes them labels, so
  # `airflow.ti.finish,dag_id=<dag>,task_id=<task>,state=skipped:1|c`
  # becomes airflow_ti_finish{dag_id="<dag>",state="skipped",...}. The
  # mapping file has one rule, a ttl on the ti.running gauge, and says why.
  # It is a file bind mount: after editing it, recreate this service
  # (`docker compose up -d --force-recreate --no-deps airflow-statsd`).
  # Counters live in this process: a restart resets them, which the rules in
  # docker/prometheus/rules/airflow-alerts.yml allow for.
  airflow-statsd:
    logging: *k2-logging
    image: prom/statsd-exporter:v0.31.0
    container_name: k2-airflow-statsd
    hostname: airflow-statsd
    command: ["--statsd.mapping-config=/etc/statsd-mapping.yml"]
    volumes:
      - ./docker/airflow/statsd-mapping.yml:/etc/statsd-mapping.yml:ro
    networks:
      - k2-net
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9102/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.k2.service: "observability"
      com.k2.tier: "control-plane"
      com.k2.version: "v3"

#############################################################################
# SERVICES - ETL LAYER
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # Spark + Iceberg - the lake's batch engine (the old ingest and maintenance
  # jobs it ran are retired to legacy/v3-lake-ingest/, ADR-056)
  # ───────────────────────────────────────────────────────────────────────
  spark-iceberg:
    logging: *k2-logging
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: k2-spark-iceberg:3.5.9_1.8.1  # local tag after build
    container_name: k2-spark-iceberg
    # Pinned off the capture cores (12-14) so a compaction or a heavy query
    # cannot steal a capture container's cycles; the Phase D noisy-neighbour
    # experiment (capacity-model.md) is what makes this claim measurable.
    cpuset: ${K2_HEAVY_CPUSET-0-11}
    hostname: spark-iceberg
    networks:
      - k2-net
      - k2-catalog  # the lake's writer: Lakekeeper and MinIO
    # The image runs as `spark` (uid 185) and, between jobs, only the Spark History
    # Server under tini (docker/spark/Dockerfile): it runs the event-log cleaner,
    # so the container's running state is the cleaner's. The lake jobs are
    # local-mode drivers started by `docker exec`, as the same user.
    ports:
      - "127.0.0.1:18080:18080"   # Spark History Server: finished lake jobs, newest first
      - "127.0.0.1:4040:4040"     # the UI of the lake job running now, while it runs
    volumes:
      - ./docker/lake:/home/iceberg/lake          # the kept modules (offsets, wire, bars, books) and the session builder
      # The registry and the bar thresholds the kept modules read
      # (docker/lake/instruments.py, bars.py). File-level bind mounts: an edit in
      # place needs --force-recreate (CLAUDE.md, bind-mount gotcha).
      - ./config/instruments.yaml:/home/iceberg/config/instruments.yaml:ro
      - ./config/bars.yaml:/home/iceberg/config/bars.yaml:ro
      # A run's scripts: /k2/releases/<id>/platform/docker/lake/, the release its resolve pinned.
      - *k2-releases-ro
      # fetch's spool, read by the connector's load task. Read-only: only fetch writes it. The
      # image creates /spool with fetch's owner (docker/spark/Dockerfile), so whichever of the two
      # mounts the empty volume first, Docker gives its root fetch's uid and fetch can write.
      - k2-spool:/spool:ro
    # Two storage keys, never the root pair (docker/lake/minio/policies/, made by lake-init):
    # Spark's, which docker/lake/spark_conf.py hands each session's catalogs and the connector signs
    # landings with, and the maintenance key, which only expire's session uses (docker/lake/expire.py).
    # The maintenance key lives here, not in the scheduler: the scheduler never holds a storage key.
    environment:
      K2_SPARK_S3_ACCESS_KEY: ${K2_SPARK_S3_ACCESS_KEY:?set K2_SPARK_S3_ACCESS_KEY in .env (make engine-keys)}
      K2_SPARK_S3_SECRET_KEY: ${K2_SPARK_S3_SECRET_KEY:?set K2_SPARK_S3_SECRET_KEY in .env (make engine-keys)}
      K2_MAINTENANCE_S3_ACCESS_KEY: ${K2_MAINTENANCE_S3_ACCESS_KEY:?set K2_MAINTENANCE_S3_ACCESS_KEY in .env (make engine-keys)}
      K2_MAINTENANCE_S3_SECRET_KEY: ${K2_MAINTENANCE_S3_SECRET_KEY:?set K2_MAINTENANCE_S3_SECRET_KEY in .env (make engine-keys)}
      K2_S3_ENDPOINT: http://minio:9000
      K2_S3_REGION: local-01
      # Spark's pair again under the AWS SDK's names, for one reader: scripts/deploy.py's spark-sql
      # DDL on warehouse k2 (SPARK_LAKE) sets no key and takes S3FileIO's default chain. They go when
      # deploy passes the K2_SPARK names instead.
      AWS_ACCESS_KEY_ID: ${K2_SPARK_S3_ACCESS_KEY:?set K2_SPARK_S3_ACCESS_KEY in .env (make engine-keys)}
      AWS_SECRET_ACCESS_KEY: ${K2_SPARK_S3_SECRET_KEY:?set K2_SPARK_S3_SECRET_KEY in .env (make engine-keys)}
      AWS_REGION: us-east-1
    # ClickHouse and PostgreSQL credentials went with docker/offload/ in Phase D,
    # and nothing that runs here needs them.
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped
    labels:
      com.k2.service: "etl"
      com.k2.tier: "cold"
      com.k2.version: "v3"

#############################################################################
# SERVICES - v3 LAKE CATALOG (ADR-018)
#############################################################################
# Lakekeeper replaced v2's bind-mounted hadoop catalog (ADR-013) as the Iceberg
# catalog, making Iceberg-on-MinIO the system of record rather than a JDBC copy
# of ClickHouse. The hadoop catalog and the offload that fed it were deleted in
# Phase D — see the Outcome sections of ADR-014 and ADR-017.
#
# Its metadata lives in a `lakekeeper` database on the existing prefect-db —
# see docker/postgres/ddl/10-lakekeeper-db.sql. PostgreSQL init scripts only run
# when the data directory is first created, so on a stack whose postgres-data
# volume predates this change, create the database once by hand:
#
#   docker exec k2-prefect-db psql -U "$PREFECT_DB_USER" -d postgres \
#     -c 'CREATE DATABASE lakekeeper'

  # ───────────────────────────────────────────────────────────────────────
  # Lakekeeper Migrate - One-shot schema migration for the catalog DB
  # `migrate` creates the PostgreSQL extensions it needs itself, so the DDL
  # file above only has to create an empty database.
  # ───────────────────────────────────────────────────────────────────────
  lakekeeper-migrate:
    logging: *k2-logging
    image: quay.io/lakekeeper/catalog:v0.13.9
    container_name: k2-lakekeeper-migrate
    networks:
      - k2-catalog  # prefect-db is there; nothing else is needed
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
    command: ["migrate"]
    depends_on:
      prefect-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: "no"
    labels:
      com.k2.service: "init"
      com.k2.tier: "cold"
      com.k2.version: "v3"

  # ───────────────────────────────────────────────────────────────────────
  # Lakekeeper - Iceberg REST catalog
  # ───────────────────────────────────────────────────────────────────────
  # On k2-catalog only, with no host port (ADR-059 part 7). The catalog has no
  # authentication: anything that reaches lakekeeper:8181 can create, replace or
  # drop a table or a view, around every rule Trino enforces. So the network is
  # the fence: only the platform's own services share k2-catalog with it, and
  # neither the host nor a service on k2-net alone can reach it. Its UI went with
  # the port. To ask it something from the host, go through a container on
  # k2-catalog, as scripts/drop.sh does. Leaving k2-net and the port takes a
  # recreate (`make deploy ... ALLOW_STATEFUL=lakekeeper`,
  # docs/runbooks/first-cutover-to-releases.md).
  #
  # The image is distroless (no shell), so the healthcheck is the binary's own
  # `healthcheck` subcommand — it GETs http://localhost:8181/health and exits
  # non-zero on failure. CMD form, not CMD-SHELL: there is no shell to run.
  lakekeeper:
    logging: *k2-logging
    image: quay.io/lakekeeper/catalog:v0.13.9
    container_name: k2-lakekeeper
    hostname: lakekeeper
    networks:
      - k2-catalog
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://${PREFECT_DB_USER}:${PREFECT_DB_PASSWORD}@prefect-db:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
      # The catalog signs every storage request the engines make, and its audit
      # trace wrote one log line per request: 99% of about 15 GiB a day of log
      # (2026-11-26). Off; the request traffic itself is unchanged.
      LAKEKEEPER__AUDIT__TRACING__ENABLED: "false"
      # BASE_URI is its name on k2-catalog: what the catalog puts in the links it
      # hands back to Trino and Spark.
      LAKEKEEPER__BASE_URI: http://lakekeeper:8181
    command: ["serve"]
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    labels:
      com.k2.service: "catalog"
      com.k2.tier: "cold"
      com.k2.version: "v3"

  # ───────────────────────────────────────────────────────────────────────
  # Lake Init - One-shot: MinIO bucket, catalog bootstrap, warehouses
  # ───────────────────────────────────────────────────────────────────────
  # Reuses the MinIO image (the mirror pinned on the `minio` service) because it is the only image already in this
  # stack carrying BOTH `mc` (bucket create) and `curl` (Lakekeeper REST) —
  # minio/mc has no curl, curlimages/curl has no mc, and either alone would cost
  # a second one-shot service. Idempotent; see docker/lake/init-lake.sh.
  lake-init:
    logging: *k2-logging
    image: ghcr.io/rjdscott/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    container_name: k2-lake-init
    networks:
      - k2-catalog  # it calls Lakekeeper and MinIO, both there
    volumes:
      - ./docker/lake:/init:ro
      - *k2-releases-ro  # the warehouse list: the release's compiled/lake/storage-plan.json
    # The one service besides minio holding the root pair: it makes the buckets, the warehouses
    # (whose storage credential Lakekeeper keeps) and one MinIO user per engine from the ten names
    # below, refusing a pair unset, equal to the root's or shared (init-lake.sh).
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      K2_SPARK_S3_ACCESS_KEY: ${K2_SPARK_S3_ACCESS_KEY:?set K2_SPARK_S3_ACCESS_KEY in .env (make engine-keys)}
      K2_SPARK_S3_SECRET_KEY: ${K2_SPARK_S3_SECRET_KEY:?set K2_SPARK_S3_SECRET_KEY in .env (make engine-keys)}
      K2_TRINO_S3_ACCESS_KEY: ${K2_TRINO_S3_ACCESS_KEY:?set K2_TRINO_S3_ACCESS_KEY in .env (make engine-keys)}
      K2_TRINO_S3_SECRET_KEY: ${K2_TRINO_S3_SECRET_KEY:?set K2_TRINO_S3_SECRET_KEY in .env (make engine-keys)}
      K2_MAINTENANCE_S3_ACCESS_KEY: ${K2_MAINTENANCE_S3_ACCESS_KEY:?set K2_MAINTENANCE_S3_ACCESS_KEY in .env (make engine-keys)}
      K2_MAINTENANCE_S3_SECRET_KEY: ${K2_MAINTENANCE_S3_SECRET_KEY:?set K2_MAINTENANCE_S3_SECRET_KEY in .env (make engine-keys)}
      K2_BACKUP_S3_ACCESS_KEY: ${K2_BACKUP_S3_ACCESS_KEY:?set K2_BACKUP_S3_ACCESS_KEY in .env (make engine-keys)}
      K2_BACKUP_S3_SECRET_KEY: ${K2_BACKUP_S3_SECRET_KEY:?set K2_BACKUP_S3_SECRET_KEY in .env (make engine-keys)}
      K2_TOOLS_S3_ACCESS_KEY: ${K2_TOOLS_S3_ACCESS_KEY:?set K2_TOOLS_S3_ACCESS_KEY in .env (make engine-keys)}
      K2_TOOLS_S3_SECRET_KEY: ${K2_TOOLS_S3_SECRET_KEY:?set K2_TOOLS_S3_SECRET_KEY in .env (make engine-keys)}
      # Empty: the script reads the plan through the trino pointer. Deploy sets it to the
      # release being deployed, so a first deploy and a new warehouse read that release.
      K2_STORAGE_PLAN: ${K2_STORAGE_PLAN:-}
    entrypoint: ["/bin/bash", "/init/init-lake.sh"]
    depends_on:
      minio:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: "no"
    labels:
      com.k2.service: "init"
      com.k2.tier: "cold"
      com.k2.version: "v3"

#############################################################################
# SERVICES - SQL OVER THE LAKE (ADR-035)
#############################################################################
  # One Trino node, coordinator and worker in one JVM, over the Lakekeeper REST
  # catalog. Its whole etc is the release's, read through the trino pointer
  # (ADR-058): catalogs, rules, groups and the password authenticator compiled by
  # k2gen (platform/k2gen/k2gen/emit/trino_etc.py). HTTPS only on 8443 with a
  # password login (ADR-060): the server key and certificate are the FILE
  # tls/trino.pem (never the tls/ directory, which holds ca.key), password.db is
  # read through its directory, reread every 5 s. The shared secret and the S3
  # key pair come from .env and reach the etc only as ${ENV:...}. On k2-catalog
  # for Lakekeeper and MinIO, and on k2-net for its clients. Checked by
  # `make test-trino`.
  #
  # The image's own health-check reads /etc/trino/config.properties, which is not
  # the etc here, and so probes plain HTTP 8080, which is off: the check below
  # asks HTTPS 8443 itself.
  #
  # Heap 2816M (etc/jvm.config) under the 5G limit leaves 2.25 GiB for
  # metaspace, code cache, thread stacks and direct buffers, which jvm.config
  # does not cap. The 2026-11-25 spike ran every single query at 1 CPU / 2 GiB;
  # the rest is for concurrent dbt threads. 4G until the dbt marts' first
  # builds left the cgroup's anon memory 0.2 GiB under it (ADR-035 Outcome).
  trino:
    logging: *k2-logging
    image: trinodb/trino:484
    container_name: k2-trino
    hostname: trino
    # Off the capture cores, like the other two engines.
    cpuset: ${K2_HEAVY_CPUSET-0-11}
    command: ["/usr/lib/trino/bin/launcher", "run", "--etc-dir=/k2/releases/pointers/trino/compiled/trino/etc"]
    networks:
      - k2-net
      - k2-catalog
    ports:
      - "127.0.0.1:${K2_TRINO_PORT:-8443}:8443"
    volumes:
      - *k2-releases-ro
      - ${K2_SECRETS:-${HOME}/k2-secrets}/tls/trino.pem:/run/k2-secrets/tls/trino.pem:ro
      - ${K2_SECRETS:-${HOME}/k2-secrets}/trino:/run/k2-secrets/trino:ro
    environment:
      K2_TRINO_SHARED_SECRET: ${K2_TRINO_SHARED_SECRET:?set K2_TRINO_SHARED_SECRET in .env (openssl rand -hex 32)}
      # Its own MinIO user (policy docker/lake/minio/policies/trino.json), never the root pair.
      K2_TRINO_S3_ACCESS_KEY: ${K2_TRINO_S3_ACCESS_KEY:?set K2_TRINO_S3_ACCESS_KEY in .env (make engine-keys)}
      K2_TRINO_S3_SECRET_KEY: ${K2_TRINO_S3_SECRET_KEY:?set K2_TRINO_S3_SECRET_KEY in .env (make engine-keys)}
    depends_on:
      lakekeeper:
        condition: service_healthy
      minio:
        condition: service_healthy
      lake-init:   # creates the domain warehouses
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 5G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "bash", "-c", "i=$$(curl -fsk https://localhost:8443/v1/info) && [[ $$i == *'\"starting\":false'* ]]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "query"
      com.k2.tier: "cold"
      com.k2.version: "v3"

#############################################################################
# SERVICES - TOPIC INITIALIZATION
#############################################################################

  # ───────────────────────────────────────────────────────────────────────
  # Redpanda Init - One-shot: topic creation + Avro schema registration
  # Runs once at startup; feed handlers depend on service_completed_successfully
  # ───────────────────────────────────────────────────────────────────────
  # The script moved out of this file in Phase B: v3 adds Avro subject
  # registration against the schema registry, which is more than a compose
  # inline command should carry. After editing docker/redpanda/init.sh, run
  # `docker compose up -d --force-recreate --no-deps redpanda-init`.
  #
  # A *directory* bind mount goes stale after a write-then-rename save exactly
  # like the file-level config/instruments.yaml mount does — the staleness is
  # held by the file-sharing layer for as long as ANY container has that host
  # directory mounted, so a recreated container reads the old file too if a
  # sibling still holds the path. `./docker/redpanda` is mounted by this service
  # and nothing else (verified: `grep -n docker/redpanda docker-compose.yml`),
  # so recreating redpanda-init alone is sufficient here. `./docker/lake` is
  # NOT — see docker/README.md "A bind-mounted script runs its old contents".
  redpanda-init:
    logging: *k2-logging
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.4
    container_name: k2-redpanda-init
    networks:
      - k2-net
    volumes:
      - ./docker/redpanda:/init:ro
      - ./schemas/avro:/schemas:ro
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/init.sh"]
    # Declared like the other one-shots so the bootstrap peak is arithmetic, not
    # a guess — see the RESOURCE SUMMARY footer. rpk + curl in a shell loop.
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: "no"
    labels:
      com.k2.service: "init"
      com.k2.tier: "hot"
      com.k2.version: "v2"

#############################################################################
# SERVICES - RUST CAPTURE (v3 — the only capture tier)
#############################################################################
# See docs/plans/2026-08-26-v3-quant-research-platform/002-phase-c-rust-capture.md.
# Three `k2-capture:v3` containers, one per exchange, carrying trades and L2 book
# on one connection each. They ran beside the three Kotlin feed handlers for a
# labelled 2-hour parity window; the handlers retired on that gate and are
# archived in legacy/v2-kotlin/, no longer in this file. ADR-019's Outcome
# carries the window's numbers.
#
# The v2 topics they wrote (`market.crypto.trades.<ex>[.raw]`) and the ClickHouse
# `k2` database fed from them are FROZEN, not dropped: no producer writes them
# from this commit on, and Phase E deletes them.
#
# `./config` is a *directory* bind mount here (all of config/, not just
# instruments.yaml). Directory mounts go stale the same way the file-level
# mount does — see docker/README.md "A bind-mounted script runs its old
# contents after you edited it": a write-then-rename edit survives only if
# `--force-recreate` covers every service still holding the directory.

  # ───────────────────────────────────────────────────────────────────────
  # Binance Capture - Rust k2-capture (trades + L2 book, one connection)
  # ───────────────────────────────────────────────────────────────────────
  capture-binance:
    logging: *k2-logging
    build: *capture-build
    image: k2-capture:v3
    container_name: k2-capture-binance
    hostname: capture-binance
    networks:
      - k2-net
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - K2_EXCHANGE=binance
      - K2_INSTRUMENTS_FILE=/app/config/instruments.yaml
      - K2_KAFKA_BROKERS=redpanda:9092
      - K2_SCHEMA_REGISTRY_URL=http://redpanda:8081
      - K2_METRICS_PORT=8082
      - K2_SNAPSHOT_INTERVAL_MS=1000
      - K2_TOPIC_PREFIX=market.crypto.v3
      - RUST_LOG=info
    volumes:
      - ./config:/app/config:ro
    cpuset: ${K2_CAPTURE_CPUSET-12-14}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "/k2-capture", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "capture"
      com.k2.exchange: "binance"
      com.k2.tier: "hot"
      com.k2.version: "v3"

  # ───────────────────────────────────────────────────────────────────────
  # Kraken Capture - Rust k2-capture (trades + L2 book, one connection)
  # ───────────────────────────────────────────────────────────────────────
  capture-kraken:
    logging: *k2-logging
    image: k2-capture:v3
    container_name: k2-capture-kraken
    hostname: capture-kraken
    networks:
      - k2-net
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - K2_EXCHANGE=kraken
      - K2_INSTRUMENTS_FILE=/app/config/instruments.yaml
      - K2_KAFKA_BROKERS=redpanda:9092
      - K2_SCHEMA_REGISTRY_URL=http://redpanda:8081
      - K2_METRICS_PORT=8082
      - K2_SNAPSHOT_INTERVAL_MS=1000
      - K2_TOPIC_PREFIX=market.crypto.v3
      - RUST_LOG=info
    volumes:
      - ./config:/app/config:ro
    cpuset: ${K2_CAPTURE_CPUSET-12-14}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "/k2-capture", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "capture"
      com.k2.exchange: "kraken"
      com.k2.tier: "hot"
      com.k2.version: "v3"

  # ───────────────────────────────────────────────────────────────────────
  # Coinbase Capture - Rust k2-capture (trades + L2 book, one connection)
  # ───────────────────────────────────────────────────────────────────────
  # 512M not 256M: Coinbase's full-depth BTreeMap<i64,i64> book (vs. Binance's
  # top-20 no-state and Kraken's depth=25) is the larger resident structure.
  capture-coinbase:
    logging: *k2-logging
    image: k2-capture:v3
    container_name: k2-capture-coinbase
    hostname: capture-coinbase
    networks:
      - k2-net
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - K2_EXCHANGE=coinbase
      - K2_INSTRUMENTS_FILE=/app/config/instruments.yaml
      - K2_KAFKA_BROKERS=redpanda:9092
      - K2_SCHEMA_REGISTRY_URL=http://redpanda:8081
      - K2_METRICS_PORT=8082
      - K2_SNAPSHOT_INTERVAL_MS=1000
      - K2_TOPIC_PREFIX=market.crypto.v3
      - RUST_LOG=info
    volumes:
      - ./config:/app/config:ro
    cpuset: ${K2_CAPTURE_CPUSET-12-14}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "/k2-capture", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    labels:
      com.k2.service: "capture"
      com.k2.exchange: "coinbase"
      com.k2.tier: "hot"
      com.k2.version: "v3"

#############################################################################
# SERVICES - PHASE 001 STUBS (profiles only, never started by default)
#############################################################################
  # Declared now so the budget gate counts and pin-checks them and later steps
  # fill them in place (docs/development/phase-001-interfaces.md A13). Each is
  # a stub on alpine that prints SKIP and exits until its owning step replaces the
  # image and command (tools, fetch, dbt-runner and k2-api all have). k2-api has since
  # left the profiles for the default set (W3-11); the other three stay one-shots.
  # The tools one-shot (ADR-058): `make deploy` runs it to move the release pointers on the VM
  # side of Docker Desktop's file sharing, and `make release` to compile a tag with that tag's
  # k2gen. `make release` builds it from the tag and tags it tools:<image id 12>, which the release
  # pins; deploy runs that image, never this tag. Its command is the deploy's (k2tools ...).
  tools:
    profiles: ["tools"]
    logging: *k2-logging
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
    image: tools:local
    command: ["k2tools"]
    networks:
      - k2-net
      - k2-catalog
    # No storage key: nothing a `compose run tools` step runs reads one. scripts/backup-lake.sh
    # passes the backup's to its own `docker run -e`, and a step that needs a key passes it by
    # name for that run alone, so swap, pointers and k2site never hold one.
    environment:
      # The catalog site's run-time facts, read as svc.catalog (platform/catalog-site/k2site.py).
      K2_TRINO_HOST: trino
      K2_TRINO_INTERNAL_PORT: "8443"
    volumes:
      # The one read-write mount of the releases root: pointers swap only here (A1).
      - <<: *k2-releases-ro
        read_only: false
      # k2site.py --out /site/catalog; k2-api reads it as /srv/k2-site/catalog/current.
      - type: volume
        source: k2-site
        target: /site
      # svc.catalog's password and the CA, for k2site.py's facts. Each file by name, never created
      # when missing (tests/test_secret_mounts.py): a short-syntax bind would make a directory
      # where `make password` later writes the file.
      - &k2-secret-file
        type: bind
        source: ${K2_SECRETS:-${HOME}/k2-secrets}/principals/svc.catalog.password
        target: /run/k2-secrets/catalog.password
        read_only: true
        bind:
          create_host_path: false
      - <<: *k2-secret-file
        source: ${K2_SECRETS:-${HOME}/k2-secrets}/tls/ca.pem
        target: /run/k2-secrets/tls/ca.pem
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: "no"

  # The two run one-shots (phase 002). Airflow starts them with `docker run` from the release's
  # compiled/oneshots.json (docker/airflow/dags/oneshot.py), never with compose: these services
  # are what the budget gate counts and pin-checks, what `make release` builds and pins into the
  # manifest, and what k2gen's ONESHOT_KINDS must agree with (tests/test_catalog_fence_compose.py,
  # platform/k2gen/tests/test_emit_pipeline.py). Each runs as the operator runs it: a read-only
  # root, a 64m noexec /tmp, no capability, no new privileges, never the Docker socket.
  fetch:
    profiles: ["fetch"]
    logging: *k2-logging
    build:
      context: .
      dockerfile: docker/fetch/Dockerfile
    image: fetch:local
    command: ["k2-fetch"]
    networks:
      - k2-net  # egress only, never k2-catalog (A8)
    # No environment but the release (oneshots.json's env); no storage key and no secret mount:
    # what a parser can reach, it can leak.
    environment:
      K2_RELEASE:
    volumes:
      - *k2-releases-ro
      - k2-spool:/spool
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: "no"

  dbt-runner:
    profiles: ["build"]
    logging: *k2-logging
    build:
      context: .
      dockerfile: docker/dbt-runner/Dockerfile
    image: dbt-runner:local
    command: ["k2-dbt"]
    networks:
      - k2-catalog  # Trino is on it too; the tag commit goes to the catalog (A7, A13)
    # Exactly the wrapper's seven names (phase-001-interfaces.md, "The dbt wrapper"). The builder,
    # the publisher and the release are per run: the operator passes them; by hand, export
    # K2_TRINO_USER=dbt_<fence> K2_PUB_USER=pub_<fence> K2_RELEASE=<id>, which also pick the two
    # password files below. Passwords are files, read by the wrapper alone, never variables.
    environment:
      K2_TRINO_HOST: trino
      K2_TRINO_INTERNAL_PORT: "8443"
      K2_TRINO_USER:
      K2_PUB_USER:
      K2_RUNS_USER: svc.runs
      K2_CATALOG_URI: http://lakekeeper:8181/catalog
      K2_RELEASE:
    # Each file by name (tests/test_secret_mounts.py), never created when missing: a short-syntax
    # bind would make a directory where `make password` later writes the file.
    volumes:
      - *k2-releases-ro
      - <<: *k2-secret-file
        source: ${K2_SECRETS:-${HOME}/k2-secrets}/principals/${K2_TRINO_USER:-}.password
        target: /run/k2-secrets/builder.password
      - <<: *k2-secret-file
        source: ${K2_SECRETS:-${HOME}/k2-secrets}/principals/${K2_PUB_USER:-}.password
        target: /run/k2-secrets/publisher.password
      - <<: *k2-secret-file
        source: ${K2_SECRETS:-${HOME}/k2-secrets}/principals/svc.runs.password
        target: /run/k2-secrets/runs.password
      - <<: *k2-secret-file
        source: ${K2_SECRETS:-${HOME}/k2-secrets}/tls/ca.pem
        target: /run/k2-secrets/tls/ca.pem
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
    restart: "no"

  # k2-api (phase 003): read-only REST over the release's data products (services/k2-api/:
  # its routes are openapi.yaml). It reads the release through its pointer at every request,
  # so a deploy moves it without a recreate. It runs as the host user, K2_RUN_UID, with group
  # 0, as airflow-scheduler does: svc.api's password file and api/keys.json are mode 600 and
  # owned by the host user (the image's own uid, 10004, is for any other run). Exactly two
  # environment names and four read-only mounts, each never created when missing
  # (tests/test_catalog_fence_compose.py, tests/test_secret_mounts.py): the releases root, the
  # api/ directory (keys.json is rewritten in place, so the directory, never the file), svc.api's
  # password file and the CA; and the k2-site volume, read-only, for /catalog/ and /dbt-docs/.
  # No storage key, no Docker socket. In the default set (W3-11): plan 003's exit has every part,
  # k2-api included, report the release, and deploy moves only the default set.
  k2-api:
    logging: *k2-logging
    build:
      context: .
      dockerfile: services/k2-api/Dockerfile
    image: k2-api:local
    user: "${K2_RUN_UID:?set K2_RUN_UID in .env (make engine-keys)}:0"
    networks:
      # Trino only, as svc.api: it reads rows through the reader view and the tested
      # snapshot id from `t$refs` over SQL, never Lakekeeper's REST API, so never
      # k2-catalog, where a caller-facing service could forge a view (ADR-061 part 6).
      - k2-net
    ports:
      - "127.0.0.1:${K2_API_PORT:-8095}:8095"
    environment:
      K2_TRINO_HOST: trino
      K2_TRINO_INTERNAL_PORT: "8443"
    volumes:
      - *k2-releases-ro
      - &k2-api-secret
        type: bind
        source: ${K2_SECRETS:-${HOME}/k2-secrets}/api
        target: /run/k2-secrets/api
        read_only: true
        bind:
          create_host_path: false
      - <<: *k2-api-secret
        source: ${K2_SECRETS:-${HOME}/k2-secrets}/principals/svc.api.password
        target: /run/k2-secrets/api.password
      - <<: *k2-api-secret
        source: ${K2_SECRETS:-${HOME}/k2-secrets}/tls/ca.pem
        target: /run/k2-secrets/tls/ca.pem
      - type: volume
        source: k2-site
        target: /srv/k2-site
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No curl in the slim image: the image's own Python asks the route that reaches nothing.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

#############################################################################
# RESOURCE SUMMARY (Consolidated - Full Platform)
#############################################################################
# Service               | CPU Limit | Memory Limit | Purpose
# ----------------------|-----------|--------------|---------------------------
# redpanda              | 2.0       | 2G           | Streaming backbone
# redpanda-console      | 0.5       | 256M         | Streaming UI
# clickhouse            | 4.0       | 8G           | Gold hot tier; profile hot-gold, paused (ADR-057), not in the sums
# minio                 | 1.0       | 1G           | S3-compatible storage
# prometheus            | 1.0       | 2G           | Metrics collection
# grafana               | 0.5       | 512M         | Visualization
# cadvisor              | 0.1       | 128M         | Per-container CPU and memory (Prometheus job cadvisor)
