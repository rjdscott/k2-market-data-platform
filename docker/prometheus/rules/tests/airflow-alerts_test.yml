# promtool unit tests for docker/prometheus/rules/airflow-alerts.yml
#
#   docker run --rm --entrypoint sh -v "$PWD/docker/prometheus/rules:/r" \
#     prom/prometheus:v3.2.0 -c 'promtool test rules /r/tests/*_test.yml'
#
# Run by `make check-alerts` and `make check-docs` gate (c2). Series are what
# the airflow-statsd exporter serves: counters with no `_total` suffix, labels
# from Airflow's InfluxDB-style tags, and a series that does not exist until
# its first increment. `_` is a missing sample; at a 1m interval the value at
# position i is the value at minute i.

rule_files:
  - ../airflow-alerts.yml

evaluation_interval: 30s

tests:
  # ── AirflowSchedulerHeartbeatLost ────────────────────────────────────────
  # Healthy: 12 heartbeats a minute (every 5 s). Never fires.
  - interval: 1m
    input_series:
      - series: 'airflow_scheduler_heartbeat'
        values: '0+12x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: AirflowSchedulerHeartbeatLost
        exp_alerts: []

  # The scheduler stops at minute 10: rate is 0 from minute 12, firing after
  # the 3m `for`.
  - interval: 1m
    input_series:
      - series: 'airflow_scheduler_heartbeat'
        values: '0+12x10 120x30'
    alert_rule_test:
      - eval_time: 13m
        alertname: AirflowSchedulerHeartbeatLost
        exp_alerts: []
      - eval_time: 20m
        alertname: AirflowSchedulerHeartbeatLost
        exp_alerts:
          - exp_labels:
              severity: warning
              component: orchestration
              tier: control-plane
            exp_annotations: &heartbeat-annotations
              summary: "Airflow scheduler has not heartbeated for 5 minutes"
              description: |
                No scheduler heartbeat has reached the statsd exporter for five
                minutes, so no DAG run is being created or started. Either the
                airflow-scheduler container is down or wedged, or airflow-statsd
                is, in which case every Airflow series is missing and this is the
                only rule that says so.
              runbook: docs/runbooks/airflow-scheduling.md

  # Never heartbeated at all (scheduler never started, or the exporter is down).
  - interval: 1m
    input_series:
      - series: 'up{job="airflow-statsd"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: AirflowSchedulerHeartbeatLost
        exp_alerts:
          - exp_labels:
              severity: warning
              component: orchestration
              tier: control-plane
            exp_annotations: *heartbeat-annotations

  # ── AirflowTaskFailed ────────────────────────────────────────────────────
  # The first failure since the exporter started: a new series at 1, which
  # increase() alone reads as 0. Fires, then clears after 15 minutes.
  # up_for_retry, a try that will be retried, never fires.
  - interval: 1m
    input_series:
      - series: 'airflow_ti_finish{dag_id="lake_maintenance",task_id="maintain",state="failed"}'
        values: '_x10 1x40'
      - series: 'airflow_ti_finish{dag_id="lake_ingest",task_id="ingest",state="up_for_retry"}'
        values: '_x10 1x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: AirflowTaskFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              component: orchestration
              tier: control-plane
              dag_id: lake_maintenance
              task_id: maintain
              state: failed
            exp_annotations:
              summary: "Airflow task lake_maintenance.maintain failed"
              description: |
                lake_maintenance.maintain ended in state failed
                within the last 15 minutes, its retries spent. The task log has the
                script's own output and its exit code; a lake audit failure, a
                Spark exception and a timeout read differently there.
              runbook: docs/runbooks/airflow-scheduling.md
      - eval_time: 35m
        alertname: AirflowTaskFailed
        exp_alerts: []

  # A later failure on a series that already exists is an increase.
  - interval: 1m
    input_series:
      - series: 'airflow_ti_finish{dag_id="lake_ingest",task_id="ingest",state="failed"}'
        values: '2x30 3x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: AirflowTaskFailed
        exp_alerts: []
      - eval_time: 33m
        alertname: AirflowTaskFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              component: orchestration
              tier: control-plane
              dag_id: lake_ingest
              task_id: ingest
              state: failed
            exp_annotations:
              summary: "Airflow task lake_ingest.ingest failed"
              description: |
                lake_ingest.ingest ended in state failed
                within the last 15 minutes, its retries spent. The task log has the
                script's own output and its exit code; a lake audit failure, a
                Spark exception and a timeout read differently there.
              runbook: docs/runbooks/airflow-scheduling.md

  # ── AirflowLakeIngestSkippedRepeatedly ───────────────────────────────────
  # Skips at minutes 21, 26 and 31 on a long-lived exporter, successes before.
  # Two skips do not fire; the third does; the next run's absence of a skip
  # clears it.
  - interval: 1m
    input_series:
      - series: 'airflow_ti_finish{dag_id="lake_ingest",task_id="ingest",state="skipped"}'
        values: '5x20 6x4 7x4 8x30'
      - series: 'airflow_ti_finish{dag_id="lake_ingest",task_id="ingest",state="success"}'
        values: '10x60'
    alert_rule_test:
      - eval_time: 29m
        alertname: AirflowLakeIngestSkippedRepeatedly
        exp_alerts: []
      - eval_time: 34m
        alertname: AirflowLakeIngestSkippedRepeatedly
        exp_alerts:
          - exp_labels: &skipped-labels
              severity: warning
              component: orchestration
              tier: control-plane
              dag_id: lake_ingest
              task_id: ingest
              state: skipped
            exp_annotations: &skipped-annotations
              summary: "lake_ingest skipped 3 times in 15 minutes: the lake lock is held"
              description: |
                Three or more lake_ingest runs in a row exited 75: another lake
                writer holds /tmp/k2-lake-ingest.lock in the Spark container and
                no Airflow maintenance or rebuild is running. Nothing is being
                written to the lake while this fires, and the Redpanda retention
                clock is running.

                Find the process that holds the lock before anything else. A
                driver left by a killed run is the usual cause.
              runbook: docs/runbooks/airflow-scheduling.md
      - eval_time: 40m
        alertname: AirflowLakeIngestSkippedRepeatedly
        exp_alerts: []

  # Three skips inside 15 minutes with a success among them (minute 30) are
  # not three in a row.
  - interval: 1m
    input_series:
      - series: 'airflow_ti_finish{dag_id="lake_ingest",task_id="ingest",state="skipped"}'
        values: '5x20 6x4 7x7 8x30'
      - series: 'airflow_ti_finish{dag_id="lake_ingest",task_id="ingest",state="success"}'
        values: '10x29 11x40'
    alert_rule_test:
      - eval_time: 36m
        alertname: AirflowLakeIngestSkippedRepeatedly
        exp_alerts: []

  # Exporter restarted at minute 20: the skipped series is new, and the first
  # three skips after the restart still fire.
  - interval: 1m
    input_series:
      - series: 'airflow_ti_finish{dag_id="lake_ingest",task_id="ingest",state="skipped"}'
        values: '_x20 1x4 2x4 3x30'
    alert_rule_test:
      - eval_time: 33m
        alertname: AirflowLakeIngestSkippedRepeatedly
        exp_alerts:
          - exp_labels: *skipped-labels
            exp_annotations: *skipped-annotations

  # Maintenance holds the lock on purpose from minute 15 to 38, the first run
  # since the exporter started (no finish series until it ends). Skips under
  # it are expected and stay quiet; skips after it has finished fire.
  - interval: 1m
    input_series:
      - series: 'airflow_ti_finish{dag_id="lake_ingest",task_id="ingest",state="skipped"}'
        values: '5x20 6x4 7x4 8x4 9x4 10x30'
      - series: 'airflow_ti_start{dag_id="lake_maintenance",task_id="maintain"}'
        values: '_x15 1x50'
      - series: 'airflow_ti_finish{dag_id="lake_maintenance",task_id="maintain",state="success"}'
        values: '_x38 1x30'
    alert_rule_test:
      - eval_time: 34m
        alertname: AirflowLakeIngestSkippedRepeatedly
        exp_alerts: []
      - eval_time: 42m
        alertname: AirflowLakeIngestSkippedRepeatedly
        exp_alerts:
          - exp_labels: *skipped-labels
            exp_annotations: *skipped-annotations

  # A maintenance try killed with the scheduler: a ti_start at minute 0 and
  # no ti_finish ever. Skips every 5 minutes from minute 41. Inside the
  # try's dagrun_timeout (2h05m) it still reads as in flight and the skips
  # stay quiet; past it the mute ends and three skips fire. Before the bound
  # the difference held at 1 and muted this until the exporter restarted.
  - interval: 1m
    input_series:
      - series: 'airflow_ti_start{dag_id="lake_maintenance",task_id="maintain"}'
        values: '1x200'
      - series: 'airflow_ti_finish{dag_id="lake_ingest",task_id="ingest",state="skipped"}'
        values: '0x40 1x4 2x4 3x4 4x4 5x4 6x4 7x4 8x4 9x4 10x4 11x4 12x4 13x4 14x4 15x4 16x4 17x4 18x4 19x4 20x4 21x4 22x4 23x4 24x4 25x4 26x4 27x4 28x4 29x4 30x4 31x4 32x4'
    alert_rule_test:
      - eval_time: 60m
        alertname: AirflowLakeIngestSkippedRepeatedly
        exp_alerts: []
      - eval_time: 150m
        alertname: AirflowLakeIngestSkippedRepeatedly
        exp_alerts:
          - exp_labels: *skipped-labels
            exp_annotations: *skipped-annotations

  # ── AirflowLakeIngestNotRunning ──────────────────────────────────────────
  # The scheduler stops creating runs after minute 20 (the stale DAG folder
  # of 2026-11-25): the counters stay at their last value. 15 minutes with
  # no finish is minute 35, firing 5 minutes later.
  - interval: 1m
    input_series:
      - series: 'airflow_scheduler_heartbeat'
        values: '0+12x60'
      - series: 'airflow_ti_start{dag_id="lake_ingest",task_id="ingest"}'
        values: '0+1x20 20x40'
      - series: 'airflow_ti_finish{dag_id="lake_ingest",task_id="ingest",state="success"}'
        values: '0+1x20 20x40'
    alert_rule_test:
      - eval_time: 38m
        alertname: AirflowLakeIngestNotRunning
        exp_alerts: []
      - eval_time: 42m
        alertname: AirflowLakeIngestNotRunning
        exp_alerts:
          - exp_labels: &not-running-labels
              severity: warning
              component: orchestration
              tier: control-plane
            exp_annotations: &not-running-annotations
              summary: "No lake_ingest task has finished for 20 minutes"
              description: |
                No lake_ingest task has finished, in any state, for 15 minutes
                held for 5, and none is running: the 5-minute schedule is not
                creating runs. Check the DAG is not stale or paused before
                anything else; a stale DAG folder after a checkout switch shows
                nothing else, every container stays healthy.
              runbook: docs/runbooks/airflow-scheduling.md

  # No lake_ingest task has ever finished, with a scheduler that has been up
  # for more than 15 minutes: the series is absent and that still fires. In
  # the first 15 minutes of a scheduler it does not, so a fresh install's
  # first slot is not a warning.
  - interval: 1m
    input_series:
      - series: 'airflow_scheduler_heartbeat'
        values: '0+12x60'
    alert_rule_test:
      - eval_time: 18m
        alertname: AirflowLakeIngestNotRunning
        exp_alerts: []
      - eval_time: 22m
        alertname: AirflowLakeIngestNotRunning
        exp_alerts:
          - exp_labels: *not-running-labels
            exp_annotations: *not-running-annotations

  # The same silence while maintenance holds the lock from minute 15 with no
  # finish yet, and while one lake_ingest try runs long from minute 21: quiet.
  - interval: 1m
    input_series:
      - series: 'airflow_scheduler_heartbeat'
        values: '0+12x60'
      - series: 'airflow_ti_start{dag_id="lake_ingest",task_id="ingest"}'
        values: '0+1x20 20x40'
      - series: 'airflow_ti_finish{dag_id="lake_ingest",task_id="ingest",state="success"}'
        values: '0+1x20 20x40'
      - series: 'airflow_ti_start{dag_id="lake_maintenance",task_id="maintain"}'
        values: '_x15 1x45'
    alert_rule_test:
      - eval_time: 50m
        alertname: AirflowLakeIngestNotRunning
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'airflow_scheduler_heartbeat'
        values: '0+12x60'
      - series: 'airflow_ti_start{dag_id="lake_ingest",task_id="ingest"}'
        values: '0+1x21 21x40'
      - series: 'airflow_ti_finish{dag_id="lake_ingest",task_id="ingest",state="success"}'
        values: '0+1x20 20x40'
    alert_rule_test:
      - eval_time: 50m
        alertname: AirflowLakeIngestNotRunning
        exp_alerts: []

  # ── Healthy: every run succeeds ──────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'airflow_scheduler_heartbeat'
        values: '0+12x60'
      - series: 'airflow_ti_start{dag_id="lake_ingest",task_id="ingest"}'
        values: '0+0.2x60'
      - series: 'airflow_ti_finish{dag_id="lake_ingest",task_id="ingest",state="success"}'
        values: '0+0.2x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: AirflowSchedulerHeartbeatLost
        exp_alerts: []
      - eval_time: 50m
        alertname: AirflowTaskFailed
        exp_alerts: []
      - eval_time: 50m
        alertname: AirflowLakeIngestSkippedRepeatedly
        exp_alerts: []
      - eval_time: 50m
        alertname: AirflowLakeIngestNotRunning
        exp_alerts: []
