# promtool unit tests for docker/prometheus/rules/airflow-alerts.yml
#
#   docker run --rm --entrypoint sh -v "$PWD/docker/prometheus/rules:/r" \
#     prom/prometheus:v3.2.0 -c 'promtool test rules /r/tests/*_test.yml'
#
# Run by `make check-alerts` and `make check-docs` gate (c2). Series are what
# the airflow-statsd exporter serves: counters with no `_total` suffix, labels
# from Airflow's InfluxDB-style tags, and a series that does not exist until
# its first increment. `_` is a missing sample; at a 1m interval the value
# at position i is the value at minute i. The DAG and task ids are made up:
# no DAG runs until phase 002.

rule_files:
  - ../airflow-alerts.yml

evaluation_interval: 30s

tests:
  # ── AirflowSchedulerHeartbeatLost ────────────────────────────────────────
  # Healthy: 12 heartbeats a minute (every 5 s). Never fires.
  - interval: 1m
    input_series:
      - series: 'airflow_scheduler_heartbeat'
        values: '0+12x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: AirflowSchedulerHeartbeatLost
        exp_alerts: []

  # The scheduler stops at minute 10: rate is 0 from minute 12, firing after
  # the 3m `for`.
  - interval: 1m
    input_series:
      - series: 'airflow_scheduler_heartbeat'
        values: '0+12x10 120x30'
    alert_rule_test:
      - eval_time: 13m
        alertname: AirflowSchedulerHeartbeatLost
        exp_alerts: []
      - eval_time: 20m
        alertname: AirflowSchedulerHeartbeatLost
        exp_alerts:
          - exp_labels:
              severity: warning
              component: orchestration
              tier: control-plane
            exp_annotations: &heartbeat-annotations
              summary: "Airflow scheduler has not heartbeated for 5 minutes"
              description: |
                No scheduler heartbeat has reached the statsd exporter for five
                minutes, so no DAG run is being created or started. Either the
                airflow-scheduler container is down or wedged, or airflow-statsd
                is, in which case every Airflow series is missing and this is the
                only rule that says so.
              runbook: docs/runbooks/airflow-scheduling.md

  # Never heartbeated at all (scheduler never started, or the exporter is down).
  - interval: 1m
    input_series:
      - series: 'up{job="airflow-statsd"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: AirflowSchedulerHeartbeatLost
        exp_alerts:
          - exp_labels:
              severity: warning
              component: orchestration
              tier: control-plane
            exp_annotations: *heartbeat-annotations

  # ── AirflowTaskFailed ────────────────────────────────────────────────────
  # The first failure since the exporter started: a new series at 1, which
  # increase() alone reads as 0. Fires, then clears after 15 minutes.
  # up_for_retry, a try that will be retried, never fires.
  - interval: 1m
    input_series:
      - series: 'airflow_ti_finish{dag_id="example_dag",task_id="build",state="failed"}'
        values: '_x10 1x40'
      - series: 'airflow_ti_finish{dag_id="example_dag",task_id="fetch",state="up_for_retry"}'
        values: '_x10 1x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: AirflowTaskFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              component: orchestration
              tier: control-plane
              dag_id: example_dag
              task_id: build
              state: failed
            exp_annotations:
              summary: "Airflow task example_dag.build failed"
              description: |
                example_dag.build ended in state failed
                within the last 15 minutes, its retries spent. The task log has the
                script's own output and its exit code; a failed check, a
                Spark exception and a timeout read differently there.
              runbook: docs/runbooks/airflow-scheduling.md
      - eval_time: 35m
        alertname: AirflowTaskFailed
        exp_alerts: []

  # A later failure on a series that already exists is an increase.
  - interval: 1m
    input_series:
      - series: 'airflow_ti_finish{dag_id="example_dag",task_id="fetch",state="failed"}'
        values: '2x30 3x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: AirflowTaskFailed
        exp_alerts: []
      - eval_time: 33m
        alertname: AirflowTaskFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              component: orchestration
              tier: control-plane
              dag_id: example_dag
              task_id: fetch
              state: failed
            exp_annotations:
              summary: "Airflow task example_dag.fetch failed"
              description: |
                example_dag.fetch ended in state failed
                within the last 15 minutes, its retries spent. The task log has the
                script's own output and its exit code; a failed check, a
                Spark exception and a timeout read differently there.
              runbook: docs/runbooks/airflow-scheduling.md

  # ── Healthy: every run succeeds ──────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'airflow_scheduler_heartbeat'
        values: '0+12x60'
      - series: 'airflow_ti_finish{dag_id="example_dag",task_id="fetch",state="success"}'
        values: '0+0.2x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: AirflowSchedulerHeartbeatLost
        exp_alerts: []
      - eval_time: 50m
        alertname: AirflowTaskFailed
        exp_alerts: []
