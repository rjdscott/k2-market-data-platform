# K2 Market Data Platform v2 - ClickHouse Alert Rules
# Purpose: Alert on ClickHouse pipeline, MV processing, and resource issues
# Last Updated: 2026-02-19

groups:
  - name: clickhouse_critical
    interval: 30s
    rules:

      # CRITICAL: ClickHouse is unreachable
      - alert: ClickHouseDown
        expr: up{job="clickhouse"} == 0
        for: 2m
        labels:
          severity: critical
          component: clickhouse
          tier: warm-storage
        annotations:
          summary: "ClickHouse is unreachable"
          description: |
            Prometheus cannot scrape ClickHouse metrics. The server may be down
            or the Prometheus listener failed to start.

            **Impact:** the served `gold` tier is unreadable — dashboards and every
            quant query. **Nothing is lost.** `gold` is derived (ADR-026): the lake
            holds every row, the Kafka-engine consumers resume from their committed
            offsets, and capture keeps producing into Redpanda's 48 h retention.
            The medallion this alert used to describe (`k2.bronze/silver/gold`) was
            dropped at the Phase E cutover.

            **Immediate Actions:**
            1. Check status: `docker compose ps clickhouse`
            2. Check logs: `docker logs k2-clickhouse --tail 100`
            3. Restart: `docker compose restart clickhouse`
          runbook: docs/runbooks/failure-recovery.md

      # CRITICAL: ClickHouse memory near limit (>90% of limit)
      - alert: ClickHouseHighMemoryUsage
        expr: |
          ClickHouseAsyncMetrics_MemoryResident
          / ClickHouseAsyncMetrics_OSMemoryTotal > 0.85
        for: 5m
        labels:
          severity: critical
          component: clickhouse
          tier: warm-storage
        annotations:
          summary: "ClickHouse memory usage critical (>85% of system RAM)"
          description: |
            ClickHouse is using {{ $value | humanizePercentage }} of system RAM.
            Risk of OOM kill or query failures.

            **Actions:**
            1. Check top consumers: `docker exec k2-clickhouse clickhouse-client -q "SELECT * FROM system.processes ORDER BY memory_usage DESC LIMIT 10"`
            2. Consider reducing max_memory_usage in config
            3. If near OOM: restart with `docker compose restart clickhouse`
          runbook: docs/runbooks/failure-recovery.md

      # CRITICAL: Too many failed queries
      - alert: ClickHouseQueryFailureRateHigh
        expr: |
          rate(ClickHouseProfileEvents_FailedQuery[5m]) > 0.1
        for: 3m
        labels:
          severity: critical
          component: clickhouse
          tier: warm-storage
        annotations:
          summary: "High ClickHouse query failure rate"
          description: |
            ClickHouse is failing {{ $value | humanize }} queries/sec.
            This may indicate memory pressure, disk issues, or misconfiguration.
            Read the exception before acting — `system.query_log` groups them
            (failure-recovery.md §7).
          runbook: docs/runbooks/failure-recovery.md

  # ClickHouseBronzeInsertRateLow and the clickhouse:insert_rate:5m recording rule
  # were removed on 2026-08-26 and archived at
  # legacy/v2-kotlin/runbooks/clickhouse-v2-ingest-alerts.yml. Both read
  # ClickHouseProfileEvents_InsertedRows as a proxy for "is the Kafka engine
  # consuming", and the thing they proxied for was the Kotlin feed handlers'
  # output. With those retired (ADR-019) the alert can only ever fire, which is
  # noise rather than monitoring.
  - name: clickhouse_warning
    interval: 1m
    rules:

      # WARNING: Large number of background merges queued
      - alert: ClickHouseMergeQueueLarge
        expr: |
          ClickHouseMetrics_BackgroundMergesAndMutationsPoolTask > 10
        for: 5m
        labels:
          severity: warning
          component: clickhouse
          tier: warm-storage
        annotations:
          summary: "ClickHouse merge queue building up"
          description: |
            {{ $value }} background merge tasks queued. This may indicate
            the insert rate exceeds merge throughput, which can degrade query performance.
            A draining queue needs nothing; a flat one under continued inserts is a
            `kafka_max_block_size` question (failure-recovery.md §7).
          runbook: docs/runbooks/failure-recovery.md

  - name: clickhouse_recording
    rules:
      # Mean query duration in seconds (5-min window).
      # ClickHouse's Prometheus endpoint exposes counters only — no native
      # histograms — so p99 is not derivable; total time / query count is.
      - record: clickhouse:query_duration_mean:5m
        expr: |
          rate(ClickHouseProfileEvents_QueryTimeMicroseconds[5m])
          / clamp_min(rate(ClickHouseProfileEvents_Query[5m]), 0.001) / 1e6

  # ── v3 gold (Phase E, ADR-026). The served tier is fed by Kafka-engine
  # consumers; these are the two ways that feed fails quietly. ──────────────
  - name: clickhouse_gold
    interval: 30s
    rules:

      # The consumers have read nothing for 10 minutes while a capture is
      # still receiving trades. Either signal alone is ambiguous — a quiet
      # market or a stopped capture also reads as "no messages" — so both are
      # required: the capture's own freshness gauge says frames are arriving.
      - alert: ClickHouseGoldFeedStale
        expr: |
          sum(rate(ClickHouseProfileEvents_KafkaMessagesRead[10m])) == 0
          and on()
          min(time() - k2_capture_last_message_ts_seconds{stream="trade"}) < 300
        for: 5m
        labels:
          severity: warning
          component: clickhouse
          tier: hot
        annotations:
          summary: "gold Kafka consumers have read nothing for 10 minutes while capture is live"
          description: |
            ClickHouse's Kafka-engine tables (gold.q_trades, gold.q_book) are not
            consuming although capture reports fresh trades. Dashboards on gold
            are going stale; nothing is lost — the lake still archives every
            frame and gold is rebuildable from it.

            1. `SELECT * FROM system.kafka_consumers` — assignments, last error
            2. `docker logs k2-clickhouse --tail 200 | grep -i kafka`
            3. A consumer group stuck on a bad record: see KafkaRowsRejected below
          runbook: docs/runbooks/clickhouse-rebuild-from-lake.md

      # A record the AvroConfluent decoder could not read. With
      # kafka_handle_error_mode = 'stream' it is skipped and lands in
      # gold.feed_errors with its bytes; this counter is what moves. (Not
      # KafkaRowsRejected: that counts rows discarded on a rebalance and
      # re-consumed — 450 K of them during the 2026-08-27 head-start drain,
      # none lost.) One is a foreign producer or a schema evolution the DDL
      # does not know about; the lake has the bytes either way.
      - alert: ClickHouseKafkaMessagesFailed
        expr: increase(ClickHouseProfileEvents_KafkaMessagesFailed[15m]) > 0
        labels:
          severity: warning
          component: clickhouse
          tier: hot
        annotations:
          summary: "ClickHouse could not decode {{ $value }} Kafka records in 15 min"
          description: |
            AvroConfluent could not decode a record into gold.q_trades /
            gold.q_book; it was skipped into gold.feed_errors
            (`SELECT topic, partition, offset, error FROM gold.feed_errors ORDER BY seen_at DESC`).
            Compare the registered schema
            (`curl redpanda:8081/subjects/<topic>-value/versions/latest`)
            against docker/clickhouse/ddl/20-gold-kafka.sql; a new field the
            queue table lacks is the usual cause (/schema-change). Once the DDL
            agrees, the skipped window is reloaded from the lake.
          runbook: docs/runbooks/clickhouse-rebuild-from-lake.md
