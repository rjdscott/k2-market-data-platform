# K2 Market Data Platform - Airflow alert rules (ADR-034)
# Purpose: the scheduler is alive, no lake task has failed, lake_ingest is
#          not being refused the writer lock over and over, and dbt_marts
#          keeps succeeding.
# Metrics: Airflow statsd, through the airflow-statsd exporter (docker-compose.yml)
# Scrape:  job airflow-statsd
# Tests:   docker/prometheus/rules/tests/airflow-alerts_test.yml
#
# Two kinds of series, both held in the exporter's memory:
#
#   * COUNTERS (ti_finish, scheduler_heartbeat), sent at each event. A counter
#     exists only from its first increment. Its first failure arrives as a
#     brand-new series at 1, and increase() over a series with no earlier
#     sample is 0, so `increase(x[15m]) > 0` alone never sees the first one.
#     Each rule adds the case of a series that is new in the window. An
#     exporter restart resets every counter to nothing, and for 15 minutes
#     after one an `offset 15m` reads the old process's count: the two lake
#     rules below each say which way they go then.
#   * The GAUGE ti_running: how many tries of a task the database holds as
#     running, sent by the scheduler every 30 s (ti_metrics_interval). It is
#     read from database state, not counted from events, so it is right again
#     within 30 s of an exporter restart and has no first-increment case. A
#     task that stops running is sent once more as 0; a task never seen
#     running is not sent at all, and the exporter drops a value not re-sent
#     for 2 minutes, so the series is often absent: absent is not running.
#
# Observed firing 2026-11-25, falsely: AirflowLakeIngestSkippedRepeatedly at
# the end of the first lake_maintenance under Airflow. The grace below is the
# fix.

groups:
  - name: airflow
    interval: 30s
    rules:

      # WARNING: the scheduler has stopped heartbeating.
      #
      # It heartbeats every 5 s (scheduler_heartbeat_sec). Two minutes with no
      # increase, held for three, is about five minutes of no scheduling at
      # all. `absent()` covers a scheduler that never started and an exporter
      # that is down, which look the same from here: the runbook tells them
      # apart with up{job="airflow-statsd"}.
      #
      # Warning, not critical: LakeIngestFailed is the critical backstop once
      # Airflow owns the ingest, 35 minutes after the last commit.
      - alert: AirflowSchedulerHeartbeatLost
        expr: |
          rate(airflow_scheduler_heartbeat[2m]) == 0
            or absent(airflow_scheduler_heartbeat)
        for: 3m
        labels:
          severity: warning
          component: orchestration
          tier: control-plane
        annotations:
          summary: "Airflow scheduler has not heartbeated for 5 minutes"
          description: |
            No scheduler heartbeat has reached the statsd exporter for five
            minutes, so no DAG run is being created or started. Either the
            airflow-scheduler container is down or wedged, or airflow-statsd
            is, in which case every Airflow series is missing and this is the
            only rule that says so.
          runbook: docs/runbooks/airflow-scheduling.md

      # WARNING: a lake task ended failed, after its retries.
      #
      # state="failed" is the final state. A first try that fails and is
      # retried ends `up_for_retry`, which does not fire. A pulse: it fires
      # for the 15 minutes after a failure, and the task log is the record.
      #
      # Not dbt_marts: one failed hour of a mart rebuild is the next hour's to
      # repair, and DbtMartsNotSucceeding below says when it is not.
      - alert: AirflowTaskFailed
        expr: |
          increase(airflow_ti_finish{state="failed",dag_id!="dbt_marts"}[15m]) > 0
            or (airflow_ti_finish{state="failed",dag_id!="dbt_marts"}
                  unless airflow_ti_finish{state="failed",dag_id!="dbt_marts"} offset 15m)
        labels:
          severity: warning
          component: orchestration
          tier: control-plane
        annotations:
          summary: "Airflow task {{ $labels.dag_id }}.{{ $labels.task_id }} failed"
          description: |
            {{ $labels.dag_id }}.{{ $labels.task_id }} ended in state failed
            within the last 15 minutes, its retries spent. The task log has the
            script's own output and its exit code; a lake audit failure, a
            Spark exception and a timeout read differently there.
          runbook: docs/runbooks/airflow-scheduling.md

      # WARNING: lake_ingest has been refused the writer lock three runs in a row.
      #
      # ingest.py exits 75 when another lake writer holds the flock, and the DAG
      # maps 75 to skipped. One skip is the lock doing its job. Three in a row
      # with no success between, at a 5-minute cadence, is something holding
      # the lock for 10 minutes or more: a stuck lock.
      #
      # 15 minutes holds exactly three runs. The subtraction is exact where
      # increase() extrapolates; `or (x * 0)` reads a series that did not exist
      # 15 minutes ago as 0, the first-increment case above.
      #
      # After an exporter restart it errs quiet: for up to 15 minutes the
      # offset reads the old process's skip count, which the new count has to
      # beat by 3, so a lock held across the restart fires up to 15 minutes
      # late.
      #
      # Not while Airflow's own maintenance or rebuild is running, nor for a
      # 15-minute grace after it ends: both take the lock for longer than three
      # cycles on purpose, and a nightly page for it would be one nobody reads.
      # A writer started outside Airflow (a runbook, a chaos script,
      # `make lake-rebuild`) is not excluded, and the runbook says how to tell.
      #
      # The grace has to outlast one ingest slot starting and finishing after
      # the holder ends, or the window still holds the skips taken under it.
      # Observed 2026-11-25: lake_maintenance held the lock 06:10:21 to
      # 06:33:58, the 06:11 to 06:31 slots skipped, and this fired at 06:36
      # for about a minute, before the 06:36 run, the first to get the lock,
      # had finished. Up to 5 minutes to the next slot, plus the first run
      # after a hold, which reads the backlog the hold built (3.5 minutes that
      # day), plus about a minute of scheduling, the 15 s scrape and the 30 s
      # evaluation: 9.5 minutes. 15 is that with margin, and it is also the
      # skip window, so by the time the grace lapses the skips taken under the
      # holder have aged out of it even if that first run fails. The `> 0`
      # keeps it to samples of a running holder: an absent series, or one at
      # 0, mutes nothing.
      #
      # RECORDING: 1 while an Airflow lake_maintenance or lake_rebuild try is
      # running, absent otherwise. The ti_running gauge, not starts minus
      # finishes: the scheduler sends it from the database, so a zombie try
      # (killed without a ti_finish) clears when the scheduler fails it, after
      # task_instance_heartbeat_timeout (300 s), and a series first seen at 1
      # reads 1. No time bound is needed.
      #
      # The 0 for a task that stopped running is sent by the scheduler that saw
      # it run, from its memory: a scheduler stopped in the 30 s between a
      # try's end and its next send never sends it. The exporter drops a value
      # not re-sent for 2 minutes (docker/airflow/statsd-mapping.yml), so that
      # stuck 1 goes absent, and absent reads as not running here and in both
      # rules that read this.
      - record: airflow:lake_lock_holder_in_flight
        expr: max(airflow_ti_running{dag_id=~"lake_maintenance|lake_rebuild"}) > 0

      # RECORDING: 1 while a lake_ingest try is running, absent otherwise. The
      # same gauge, for the same reasons. Starts minus finishes also read one
      # short for the rest of an exporter's life after it restarted during a
      # try, and AirflowLakeIngestNotRunning then warned through a long
      # catch-up.
      - record: airflow:lake_ingest_in_flight
        expr: max(airflow_ti_running{dag_id="lake_ingest"}) > 0

      - alert: AirflowLakeIngestSkippedRepeatedly
        expr: |
          (
            airflow_ti_finish{dag_id="lake_ingest",state="skipped"}
              - (airflow_ti_finish{dag_id="lake_ingest",state="skipped"} offset 15m
                  or airflow_ti_finish{dag_id="lake_ingest",state="skipped"} * 0)
          ) >= 3
          unless on(dag_id) (
            airflow_ti_finish{dag_id="lake_ingest",state="success"}
              - (airflow_ti_finish{dag_id="lake_ingest",state="success"} offset 15m
                  or airflow_ti_finish{dag_id="lake_ingest",state="success"} * 0)
          ) > 0
          unless on() (max_over_time(airflow:lake_lock_holder_in_flight[15m]) > 0)
        for: 1m
        labels:
          severity: warning
          component: orchestration
          tier: control-plane
        annotations:
          summary: "lake_ingest skipped {{ $value }} times in 15 minutes: the lake lock is held"
          description: |
            Three or more lake_ingest runs in a row exited 75: another lake
            writer holds /tmp/k2-lake-ingest.lock in the Spark container and
            no Airflow maintenance or rebuild is running. Nothing is being
            written to the lake while this fires, and the Redpanda retention
            clock is running.

            Find the process that holds the lock before anything else. A
            driver left by a killed run is the usual cause.
          runbook: docs/runbooks/airflow-scheduling.md

      # WARNING: no lake_ingest task has finished in 15 minutes.
      #
      # Observed 2026-11-25: the DAG folder's bind mount went stale, the DAGs
      # were marked stale, and the scheduler created no run for 35 minutes
      # while every container stayed healthy and every other Airflow series
      # looked normal (heartbeat, dagbag size, parse age, import errors). A
      # finished task, success or skipped or failed, is the one signal that a
      # run happened at all. This also covers a DAG paused and forgotten and a
      # scheduler that heartbeats but does not schedule.
      #
      # The first clause reads a counter that stopped moving (the exporter
      # keeps its last value); the second a counter that has not existed for
      # 15 minutes (never started, or the exporter restarted and nothing has
      # finished since), once the scheduler has heartbeated for 15 minutes,
      # so a fresh stack's first slot does not warn. A scheduler that is not
      # heartbeating at all is AirflowSchedulerHeartbeatLost's. Not while a
      # lake_ingest try is running (a long catch-up), nor while Airflow's
      # maintenance or rebuild runs or for the 15-minute grace after it: an
      # ingest paused under a long rebuild (runbook §3) and unpaused as it
      # ends has no finish until the first run after it, the same slot plus
      # first run the skip rule's grace is sized for.
      #
      # Quiet for 15 minutes after an exporter restart, deliberately: the
      # offset then compares the old process's count with the new one, and
      # they can match by coincidence (for an exporter that had counted three
      # finishes when it restarted, the difference reads 0 the whole window).
      # resets() of the heartbeat counter marks the restart. If nothing has
      # finished since, the absent clause fires 20 minutes after it.
      - alert: AirflowLakeIngestNotRunning
        expr: |
          (
            (
              sum(airflow_ti_finish{dag_id="lake_ingest"})
                - (sum(airflow_ti_finish{dag_id="lake_ingest"} offset 15m) or vector(0))
            ) == 0
            or (
              sum(absent_over_time(airflow_ti_finish{dag_id="lake_ingest"}[15m]))
                and on() sum(airflow_scheduler_heartbeat offset 15m)
            )
          )
          unless on() (resets(airflow_scheduler_heartbeat[15m]) > 0)
          unless on() airflow:lake_ingest_in_flight
          unless on() (max_over_time(airflow:lake_lock_holder_in_flight[15m]) > 0)
        for: 5m
        labels:
          severity: warning
          component: orchestration
          tier: control-plane
        annotations:
          summary: "No lake_ingest task has finished for 20 minutes"
          description: |
            No lake_ingest task has finished, in any state, for 15 minutes
            held for 5, and none is running: the 5-minute schedule is not
            creating runs. Check the DAG is not stale or paused before
            anything else; a stale DAG folder after a checkout switch shows
            nothing else, every container stays healthy.
          runbook: docs/runbooks/airflow-scheduling.md

      # WARNING: no dbt_marts run has succeeded for 3 hours.
      #
      # dagrun.duration.success is the timer Airflow sends once for each DAG
      # run that ends in success (skipped tasks included, so the 23 hourly runs
      # that skip the maintenance count); the exporter serves its _count as a
      # counter of successful runs, labelled dag_id and run_type, summed here
      # so a manual run counts too. Three hours is three hourly slots: one
      # failed run leaves the marts an hour older and the next run rebuilds
      # them whole, three in a row is not a blip. The 10 minutes hold covers
      # the run that is still going at the third slot (a run took 31 to 40 s,
      # docs/runbooks/dbt-marts.md).
      #
      # The two clauses and the restart guard of AirflowLakeIngestNotRunning,
      # at 3 hours: a counter that stopped moving, and one that has not existed
      # for 3 hours while the scheduler has heartbeated for 3 hours, so a fresh
      # stack whose runs all fail fires 3 hours and 10 minutes after it starts,
      # and a fresh stack still inside its first 3 hours does not. Quiet for 3
      # hours after an exporter restart, when the offset compares two
      # processes' counts; if nothing has succeeded since, the absent clause
      # fires once the restart is 3 hours old. A paused dbt_marts fires too:
      # the marts stop moving either way.
      - alert: DbtMartsNotSucceeding
        expr: |
          (
            (
              sum(airflow_dagrun_duration_success_count{dag_id="dbt_marts"})
                - (sum(airflow_dagrun_duration_success_count{dag_id="dbt_marts"} offset 3h) or vector(0))
            ) == 0
            or (
              sum(absent_over_time(airflow_dagrun_duration_success_count{dag_id="dbt_marts"}[3h]))
                and on() sum(airflow_scheduler_heartbeat offset 3h)
            )
          )
          unless on() (resets(airflow_scheduler_heartbeat[3h]) > 0)
        for: 10m
        labels:
          severity: warning
          component: orchestration
          tier: control-plane
        annotations:
          summary: "No dbt_marts run has succeeded for 3 hours"
          description: |
            The hourly dbt_marts DAG has not finished a run in success for 3
            hours, held 10 minutes: every table mart on Trino is at least that
            old (a view reads its sources when queried). The failed task's log has
            dbt's own output; a stale lake (source freshness), a failed test,
            a Trino that refuses or is down, and a paused DAG read differently
            there.
          runbook: docs/runbooks/dbt-marts.md

      # WARNING: a domain's daily snapshot expiry has not succeeded for 26 hours.
      #
      # <domain>_expire_mart_snapshots runs once a day, in the 04:10 run, and
      # neither rule above sees it: AirflowTaskFailed leaves dbt_marts out, and
      # the other 23 runs of the day keep DbtMartsNotSucceeding quiet. Its
      # success counter, per task, has to move every 26 hours: one daily slot
      # and two hours to spare. A failed, skipped or upstream_failed expiry all
      # leave it flat, so this fires about two hours after the first missed
      # 04:10 run. The 10 minutes hold is the same as above.
      #
      # The same clauses and restart guard as DbtMartsNotSucceeding, at 26
      # hours: a counter that stopped moving (`or x * 0` reads a series that is
      # new in the window as 0, so a first success never fires), and no expiry
      # success of any domain for 26 hours on a scheduler up that long. A new
      # domain whose expiry has never succeeded, while another's has, is not
      # caught by the absent clause: its first failure has no series to compare.
      - alert: DbtMartsSnapshotExpiryStale
        expr: |
          (
            (
              airflow_ti_finish{dag_id="dbt_marts",task_id=~".+_expire_mart_snapshots",state="success"}
                - (airflow_ti_finish{dag_id="dbt_marts",task_id=~".+_expire_mart_snapshots",state="success"} offset 26h
                    or airflow_ti_finish{dag_id="dbt_marts",task_id=~".+_expire_mart_snapshots",state="success"} * 0)
            ) == 0
            or on() (
              absent_over_time(airflow_ti_finish{dag_id="dbt_marts",task_id=~".+_expire_mart_snapshots",state="success"}[26h])
                and on() sum(airflow_scheduler_heartbeat offset 26h)
            )
          )
          unless on() (resets(airflow_scheduler_heartbeat[26h]) > 0)
        for: 10m
        labels:
          severity: warning
          component: orchestration
          tier: control-plane
        annotations:
          summary: "No dbt_marts snapshot expiry has succeeded for 26 hours"
          description: |
            No success of the daily snapshot expiry for 26 hours, held 10
            minutes ({{ with $labels.task_id }}{{ . }}{{ else }}any domain{{ end }}): the 04:10
            expire_snapshots and remove_orphan_files failed, were skipped
            because a build before them failed, or did not run. Each hourly
            rebuild still adds a snapshot, so the marts keep more than 7 days of
            history until it succeeds; their rows are not affected.
          runbook: docs/runbooks/dbt-marts.md
