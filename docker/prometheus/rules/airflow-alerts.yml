# K2 Market Data Platform - Airflow alert rules (ADR-034)
# Purpose: the scheduler is alive and no task has failed.
# Metrics: Airflow statsd, through the airflow-statsd exporter (docker-compose.yml)
# Scrape:  job airflow-statsd
# Tests:   docker/prometheus/rules/tests/airflow-alerts_test.yml
#
# The four rules and two recording rules that watched the retired lake DAGs
# went with them (legacy/v3-lake-ingest/, ADR-056): with no such DAG, their
# silence clauses would fire for ever. Until phase 002 adds the first product
# DAG, the scheduler runs none.
#
# The series are COUNTERS (ti_finish, scheduler_heartbeat), held in the
# exporter's memory and sent at each event. A counter exists only from its
# first increment. Its first failure arrives as a brand-new series at 1, and
# increase() over a series with no earlier sample is 0, so
# `increase(x[15m]) > 0` alone never sees the first one; AirflowTaskFailed
# adds the case of a series that is new in the window. An exporter restart
# resets every counter to nothing.

groups:
  - name: airflow
    interval: 30s
    rules:

      # WARNING: the scheduler has stopped heartbeating.
      #
      # It heartbeats every 5 s (scheduler_heartbeat_sec). Two minutes with no
      # increase, held for three, is about five minutes of no scheduling at
      # all. `absent()` covers a scheduler that never started and an exporter
      # that is down, which look the same from here: the runbook tells them
      # apart with up{job="airflow-statsd"}.
      #
      # Warning, not critical: no DAG runs while the platform is rebuilt, so a
      # stopped scheduler delays nothing yet.
      - alert: AirflowSchedulerHeartbeatLost
        expr: |
          rate(airflow_scheduler_heartbeat[2m]) == 0
            or absent(airflow_scheduler_heartbeat)
        for: 3m
        labels:
          severity: warning
          component: orchestration
          tier: control-plane
        annotations:
          summary: "Airflow scheduler has not heartbeated for 5 minutes"
          description: |
            No scheduler heartbeat has reached the statsd exporter for five
            minutes, so no DAG run is being created or started. Either the
            airflow-scheduler container is down or wedged, or airflow-statsd
            is, in which case every Airflow series is missing and this is the
            only rule that says so.
          runbook: docs/runbooks/airflow-scheduling.md

      # WARNING: a task ended failed, after its retries.
      #
      # state="failed" is the final state. A first try that fails and is
      # retried ends `up_for_retry`, which does not fire. A pulse: it fires
      # for the 15 minutes after a failure, and the task log is the record.
      - alert: AirflowTaskFailed
        expr: |
          increase(airflow_ti_finish{state="failed"}[15m]) > 0
            or (airflow_ti_finish{state="failed"}
                  unless airflow_ti_finish{state="failed"} offset 15m)
        labels:
          severity: warning
          component: orchestration
          tier: control-plane
        annotations:
          summary: "Airflow task {{ $labels.dag_id }}.{{ $labels.task_id }} failed"
          description: |
            {{ $labels.dag_id }}.{{ $labels.task_id }} ended in state failed
            within the last 15 minutes, its retries spent. The task log has the
            script's own output and its exit code; a failed check, a
            Spark exception and a timeout read differently there.
          runbook: docs/runbooks/airflow-scheduling.md
