# K2 Market Data Platform v2 - Iceberg Offload Alert Rules
# Purpose: Alert on offload pipeline failures, lag, and performance issues
# Last Updated: 2026-02-12

groups:
  - name: iceberg_offload_critical
    interval: 30s
    rules:

      # CRITICAL: Offload failures
      - alert: IcebergOffloadConsecutiveFailures
        expr: |
          sum(increase(offload_errors_total[15m])) by (table) >= 3
        for: 5m
        labels:
          severity: critical
          component: iceberg-scheduler
          tier: cold-storage
        annotations:
          summary: "Iceberg offload failing repeatedly for {{ $labels.table }}"
          description: |
            Table {{ $labels.table }} has failed {{ $value }} times in the last 15 minutes.
            This indicates a persistent issue with the offload pipeline.

            **Immediate Actions:**
            1. Check worker logs: `docker compose logs prefect-worker --tail 100`
            2. Verify ClickHouse connectivity: `docker exec k2-clickhouse clickhouse-client -q "SELECT 1"`
            3. Check Spark container health: `docker ps | grep spark-iceberg`
            4. Review watermark table for corruption

            **Runbook:** docs/runbooks/iceberg-offload-failure.md

      # CRITICAL: Offload lag exceeds acceptable window
      - alert: IcebergOffloadLagCritical
        expr: offload_lag_minutes{table=~"bronze_.*|silver_trades|ohlcv_1m|ohlcv_5m"} > 30
        for: 5m
        labels:
          severity: critical
          component: iceberg-scheduler
          tier: cold-storage
        annotations:
          summary: "Iceberg offload lag critical for {{ $labels.table }}"
          description: |
            Table {{ $labels.table }} has not been offloaded for {{ $value }} minutes.
            This exceeds the 30-minute SLO and may indicate scheduler or pipeline failure.

            **EXPECTED SINCE 2026-08-26 — the v2 tier this watches is frozen.**
            The Kotlin feed handlers were the only producers of
            `market.crypto.trades.<ex>[.raw]` and they retired to
            `legacy/v2-kotlin/` (ADR-019), so `k2.*` gains no rows, the offload
            watermark cannot advance, and this alert fires continuously until
            the `k2` database and the `.raw` topics are dropped together at the
            Phase E cutover. Until then it is expected, not an incident. The
            expression is deliberately unchanged: silencing or deleting the rule
            is a Phase E decision, not a side effect of the retirement.

            **Scope:** bronze, silver and ohlcv_1m/5m only. Coarser OHLCV watermarks
            track the last completed window, so they lag by design.

            **Impact:** Cold tier data is stale; queries may return incomplete results.

            **Check:**
            - Deployments registered: `docker exec k2-prefect-worker prefect deployment ls`
            - Recent cycles: `docker compose logs prefect-worker --tail 100`

            **Runbook:** docs/runbooks/iceberg-offload-lag.md

      # CRITICAL: Cycle duration exceeds schedule interval
      - alert: IcebergOffloadCycleTooSlow
        expr: offload_last_duration_seconds > 600
        for: 2m
        labels:
          severity: critical
          component: iceberg-scheduler
          tier: cold-storage
        annotations:
          summary: "Iceberg offload cycle taking too long"
          description: |
            Last offload run for {{ $labels.table }} took {{ $value }}s (>10 minutes).
            This exceeds 2/3 of the 15-minute schedule interval.

            **Risk:** Offload cycles may start overlapping, causing resource contention.

            **Investigate:**
            - Data volume spike: Check ClickHouse row counts
            - Spark performance: Check executor logs
            - Network issues: Check latency between services

            **Runbook:** docs/runbooks/iceberg-offload-performance.md

      # CRITICAL: Watermark timestamp stale (pipeline hung)
      - alert: IcebergOffloadWatermarkStale
        expr: |
          (time() - watermark_timestamp_seconds) > 93600
        for: 5m
        labels:
          severity: critical
          component: iceberg-scheduler
          tier: cold-storage
        annotations:
          summary: "Iceberg offload watermark not updating for {{ $labels.table }}"
          description: |
            Watermark for {{ $labels.table }} has not updated in {{ $value | humanizeDuration }}
            (>26h). This is the slow backstop that catches a hung pipeline on any table,
            including ohlcv_1d; IcebergOffloadLagCritical is the fast detector.

            **EXPECTED SINCE 2026-08-26 — the v2 tier this watches is frozen.**
            The Kotlin feed handlers were the only producers of
            `market.crypto.trades.<ex>[.raw]` and they retired to
            `legacy/v2-kotlin/` (ADR-019), so `k2.*` gains no rows, the offload
            watermark cannot advance, and this alert fires continuously until
            the `k2` database and the `.raw` topics are dropped together at the
            Phase E cutover. Until then it is expected, not an incident. The
            expression is deliberately unchanged: silencing or deleting the rule
            is a Phase E decision, not a side effect of the retirement.

            **Actions:**
            1. Check deployments registered: `docker exec k2-prefect-worker prefect deployment ls`
            2. Review last cycle status: `docker compose logs prefect-worker --tail 100`
            3. Manually inspect watermark table
            4. Restart worker if hung: `docker compose restart prefect-worker`

            **Runbook:** docs/runbooks/iceberg-offload-watermark-recovery.md

  - name: iceberg_offload_warning
    interval: 1m
    rules:

      # WARNING: Success rate degraded
      - alert: IcebergOffloadSuccessRateLow
        expr: |
          (
            rate(offload_cycles_total{status="success"}[15m])
            /
            rate(offload_cycles_total[15m])
          ) < 0.95
        for: 10m
        labels:
          severity: warning
          component: iceberg-scheduler
          tier: cold-storage
        annotations:
          summary: "Iceberg offload success rate below 95%"
          description: |
            Success rate over last 15 minutes: {{ $value | humanizePercentage }}.
            Target: >95%. Some offload operations are failing intermittently.

            **Impact:** Minor - cold tier may have small gaps, but not critical yet.

            **Actions:**
            - Review error types: `docker compose logs prefect-worker --tail 100`
            - Check for transient network issues
            - Monitor for escalation to critical threshold

      # WARNING: Offload lag elevated
      - alert: IcebergOffloadLagElevated
        expr: offload_lag_minutes{table=~"bronze_.*|silver_trades|ohlcv_1m|ohlcv_5m"} > 20 and offload_lag_minutes{table=~"bronze_.*|silver_trades|ohlcv_1m|ohlcv_5m"} <= 30
        for: 10m
        labels:
          severity: warning
          component: iceberg-scheduler
          tier: cold-storage
        annotations:
          summary: "Iceberg offload lag elevated for {{ $labels.table }}"
          description: |
            Table {{ $labels.table }} offload lag: {{ $value }} minutes (target: <15 minutes).
            Not critical yet (threshold: 30 minutes), but trending upward.

            **EXPECTED SINCE 2026-08-26 — the v2 tier this watches is frozen.**
            The Kotlin feed handlers were the only producers of
            `market.crypto.trades.<ex>[.raw]` and they retired to
            `legacy/v2-kotlin/` (ADR-019), so `k2.*` gains no rows, the offload
            watermark cannot advance, and this alert fires continuously until
            the `k2` database and the `.raw` topics are dropped together at the
            Phase E cutover. Until then it is expected, not an incident. The
            expression is deliberately unchanged: silencing or deleting the rule
            is a Phase E decision, not a side effect of the retirement.

            **Possible Causes:**
            - Scheduler delayed or skipped a cycle
            - Data volume spike
            - Temporary Spark/ClickHouse slowness

            **Monitor:** Watch for escalation to critical alert.

      # WARNING: Throughput degraded
      - alert: IcebergOffloadThroughputLow
        expr: |
          sum(rate(offload_rows_total{table=~"bronze_.*|silver_trades"}[1h])) by (table) < 0.1
        for: 15m
        labels:
          severity: warning
          component: iceberg-scheduler
          tier: cold-storage
        annotations:
          summary: "Iceberg offload throughput degraded"
          description: |
            Offload throughput for {{ $labels.table }}: {{ $value | humanize }} rows/second
            averaged over 1 hour. Below 0.1 rows/sec this high-volume table has
            effectively stopped offloading.

            **EXPECTED SINCE 2026-08-26 — the v2 tier this watches is frozen.**
            The Kotlin feed handlers were the only producers of
            `market.crypto.trades.<ex>[.raw]` and they retired to
            `legacy/v2-kotlin/` (ADR-019), so `k2.*` gains no rows, the offload
            watermark cannot advance, and this alert fires continuously until
            the `k2` database and the `.raw` topics are dropped together at the
            Phase E cutover. Until then it is expected, not an incident. The
            expression is deliberately unchanged: silencing or deleting the rule
            is a Phase E decision, not a side effect of the retirement.

            **Check:**
            - Spark executor logs for slowness
            - ClickHouse query performance
            - Network latency between services

      # WARNING: Cycle duration elevated
      - alert: IcebergOffloadCycleSlow
        expr: offload_last_duration_seconds > 300 and offload_last_duration_seconds <= 600
        for: 10m
        labels:
          severity: warning
          component: iceberg-scheduler
          tier: cold-storage
        annotations:
          summary: "Iceberg offload cycle duration elevated"
          description: |
            Run duration for {{ $labels.table }}: {{ $value }}s (5-10 minutes, target: <30s).
            Not critical yet but trending upward. Monitor for further degradation.

  - name: iceberg_offload_info
    interval: 5m
    rules:

      # INFO: Scheduler health check
      - alert: IcebergOffloadSchedulerDown
        expr: up{job="iceberg-scheduler"} == 0
        for: 2m
        labels:
          severity: critical
          component: iceberg-scheduler
          tier: cold-storage
        annotations:
          summary: "Iceberg offload scheduler is down"
          description: |
            Prometheus cannot scrape the offload metrics exporter
            (iceberg-metrics:8000, docker/offload/metrics.py --serve).

            **Possible Causes:**
            - iceberg-metrics container down or restarting
            - Exporter process crashed
            - PREFECT_DB_* env vars missing, so the exporter cannot read watermarks
            - Network connectivity issue

            **Actions:**
            1. Check status: `docker compose ps iceberg-metrics`
            2. Check logs: `docker compose logs iceberg-metrics --tail 50`
            3. Restart if needed: `docker compose restart iceberg-metrics`

            **Runbook:** docs/runbooks/iceberg-scheduler-recovery.md

      # INFO: First cycle after scheduler start
      - record: iceberg_offload:cycle_count:5m
        expr: rate(offload_cycles_total[5m]) * 300

      # INFO: Average offload duration by table
      - record: iceberg_offload:duration_avg:5m
        expr: |
          rate(offload_duration_seconds_sum[5m])
          /
          rate(offload_duration_seconds_count[5m])

      # INFO: Total rows offloaded (5-minute rate)
      - record: iceberg_offload:rows_rate:5m
        expr: rate(offload_rows_total[5m])

# Alert Severity Guide:
# ----------------------
# CRITICAL: Immediate action required
#   - Data loss risk
#   - SLO violation
#   - Service down
#   - Page on-call engineer
#
# WARNING: Action required within business hours
#   - Degraded performance
#   - Approaching SLO violation
#   - Intermittent failures
#   - Send Slack notification
#
# INFO: Informational only
#   - Recording rules
#   - Health checks
#   - No action required

# SLO Definitions:
# ----------------
# - Offload Lag: <15 minutes (target), <30 minutes (SLO)
# - Success Rate: >99% (target), >95% (SLO)
# - Cycle Duration: <30 seconds (target), <10 minutes (SLO)
# - Throughput (bronze/silver, 1h avg): >100 rows/sec (target), >0.1 rows/sec (stall floor)
