# K2 Market Data Platform - Prometheus Configuration
# Scrapes the v3 capture tier plus the shared infrastructure (Redpanda, Grafana,
# cAdvisor, Airflow's statsd, Alertmanager), and sends every firing alert to
# Alertmanager. The Kotlin feed-handler jobs retired with the handlers (ADR-019); ClickHouse is not scraped while its hot tier is paused
# (ADR-057), so no rule reads a target that is meant to be down. The lake
# exporter's job retired with the old ingest pipeline (legacy/v3-lake-ingest/);
# lake metrics return in phase 004.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'k2-v2'
    environment: 'development'

# Every firing alert goes to Alertmanager, which routes it to Slack
# (docker/alertmanager/alertmanager.yml, docs/runbooks/where-an-alert-goes.md).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# The alerting and recording rules of the release the prometheus pointer names (ADR-058),
# read through the releases root; deploy sends SIGHUP after each swap so they are reread.
# A glob that matches nothing (no pointer yet, or a release without platform/) loads no rule
# and is no error: Prometheus starts, and alerts begin at the first deploy. promtool and
# `make check-alerts` read the same files at docker/prometheus/rules/ in the checkout.
#
# The last glob is for a rollback to a release from before phase 002: this file is the
# checkout's under every release, and such a release has no platform/ rules but mounts the
# checkout's docker/prometheus/rules at /etc/prometheus/rules (its compose). Without it that
# Prometheus would start healthy with no rule and say nothing. This phase's compose mounts
# nothing there (tests/test_catalog_fence_compose.py), so it and the first never both match and
# no group loads twice.
#
# The middle glob is the rules k2gen compiles from the release's contracts (I-5, emit/alerts.py): per
# product, a failed run, no successful run, a slow run. A release compiled before them has no
# compiled/prometheus/, which matches nothing. This file is a file bind mount, so a deploy that
# brings a change to it needs `docker compose up -d --force-recreate --no-deps prometheus`: the
# swap's SIGHUP rereads the inode the container started with.
rule_files:
  - "/k2/releases/pointers/prometheus/platform/docker/prometheus/rules/*.yml"
  - "/k2/releases/pointers/prometheus/compiled/prometheus/*.yml"
  - "/etc/prometheus/rules/*.yml"

# Scrape configurations
scrape_configs:

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'observability'

  # Redpanda metrics
  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']
        labels:
          service: 'redpanda'
          tier: 'streaming'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Redpanda's public endpoint, for the two disk gauges only: the free and total
  # bytes of the filesystem under its data directory. On Docker Desktop that is the
  # VM disk every named volume shares (MinIO's, Redpanda's, PostgreSQL's), so it
  # is the platform's disk signal; rules/platform-alerts.yml reads it. The other
  # public series repeat what /metrics already gives, and are dropped at scrape.
  - job_name: 'redpanda-public'
    static_configs:
      - targets: ['redpanda:9644']
        labels:
          service: 'redpanda'
          tier: 'streaming'
    metrics_path: '/public_metrics'
    scrape_interval: 30s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'redpanda_storage_disk_(free|total)_bytes'
        action: keep

  # Alertmanager's own metrics: rules/alertmanager-alerts.yml reads `up` and the
  # Slack notification counters from this job.
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'
          tier: 'observability'
    metrics_path: '/metrics'

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          tier: 'observability'
    metrics_path: '/metrics'

  # cAdvisor: per-container CPU and memory, and each container's cgroup limits
  # (container_spec_*), which the K2 Resources dashboard plots usage against.
  # cAdvisor already exports cpu, memory and oom_event only (--enable_metrics); this
  # keeps the ten series names the dashboards read, for K2's own containers, and
  # drops the rest at scrape: about 200 series for 20 containers.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          tier: 'observability'
    metrics_path: '/metrics'
    scrape_interval: 15s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|memory_working_set_bytes|memory_rss|memory_cache|oom_events_total|spec_cpu_quota|spec_cpu_period|spec_memory_limit_bytes)'
        action: keep
      - source_labels: [name]
        regex: 'k2-.+'
        action: keep

  # Future: query API metrics (Phase 8)
  # - job_name: 'k2-api'
  #   static_configs:
  #     - targets: ['k2-api:8081']
  #   metrics_path: '/actuator/prometheus'

  # Airflow 3 (ADR-034), through the statsd exporter. Airflow pushes statsd
  # over UDP to airflow-statsd:9125; this scrapes what the exporter holds.
  # docker/prometheus/rules/airflow-alerts.yml reads it.
  - job_name: 'airflow-statsd'
    static_configs:
      - targets: ['airflow-statsd:9102']
        labels:
          service: 'airflow'
          tier: 'control-plane'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Rust capture tier — metrics-exporter-prometheus on port 8082. This is the
  # only ingestion tier: the three `feed-handler-*` jobs that scraped the Kotlin
  # handlers on the same port were removed with them (ADR-019). See
  # docs/plans/2026-08-26-v3-quant-research-platform/002-phase-c-rust-capture.md.
  #
  # NO `exchange:` target label here. The capture binary emits its own
  # `exchange` label on every series, and with the default
  # `honor_labels: false` a target label of the same name wins and the sample's
  # own is renamed `exported_exchange` — so every capture series carried both,
  # while `k2_capture_build_info` (which the binary emits without `exchange`)
  # carried only the target one. Two label sets for one concept. Dropping the
  # target label is the fix rather than `honor_labels: true`, which would leave
  # `up` — a synthetic series with no sample labels to honour — without an
  # exchange either way, and would let a venue's own metrics rewrite `job` and
  # break CaptureDown. Alerts on capture series get `exchange` from the binary;
  # alerts on `up` identify the venue by `job`.
  - job_name: 'capture-binance'
    static_configs:
      - targets: ['capture-binance:8082']
        labels:
          service: 'capture-binance'
          tier: 'ingestion'
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'capture-kraken'
    static_configs:
      - targets: ['capture-kraken:8082']
        labels:
          service: 'capture-kraken'
          tier: 'ingestion'
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'capture-coinbase'
    static_configs:
      - targets: ['capture-coinbase:8082']
        labels:
          service: 'capture-coinbase'
          tier: 'ingestion'
    metrics_path: '/metrics'
    scrape_interval: 15s
