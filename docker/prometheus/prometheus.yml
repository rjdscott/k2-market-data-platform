# K2 Market Data Platform v2 - Prometheus Configuration
# Scrapes metrics from all v2 services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'k2-v2'
    environment: 'development'

# Alertmanager configuration (future)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules (alerting and recording rules)
rule_files:
  - "rules/*.yml"

# Scrape configurations
scrape_configs:

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'observability'

  # Redpanda metrics
  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']
        labels:
          service: 'redpanda'
          tier: 'streaming'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ClickHouse metrics (Prometheus endpoint on port 8123 at /metrics)
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']
        labels:
          service: 'clickhouse'
          tier: 'warm-storage'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          tier: 'observability'
    metrics_path: '/metrics'

  # Future: query API metrics (Phase 8)
  # - job_name: 'k2-api'
  #   static_configs:
  #     - targets: ['k2-api:8081']
  #   metrics_path: '/actuator/prometheus'

  # Iceberg offload metrics — the iceberg-metrics service runs
  # docker/offload/metrics.py --serve, deriving metrics from the
  # offload_watermarks table. Job name kept as 'iceberg-scheduler' to match the
  # existing alert rules and dashboards.
  - job_name: 'iceberg-scheduler'
    static_configs:
      - targets: ['iceberg-metrics:8000']
        labels:
          service: 'iceberg-offload'
          tier: 'cold-storage'
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Kotlin feed handlers — Micrometer Prometheus endpoint on port 8082
  - job_name: 'feed-handler-binance'
    static_configs:
      - targets: ['feed-handler-binance:8082']
        labels:
          service: 'feed-handler-binance'
          exchange: 'binance'
          tier: 'ingestion'
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'feed-handler-kraken'
    static_configs:
      - targets: ['feed-handler-kraken:8082']
        labels:
          service: 'feed-handler-kraken'
          exchange: 'kraken'
          tier: 'ingestion'
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'feed-handler-coinbase'
    static_configs:
      - targets: ['feed-handler-coinbase:8082']
        labels:
          service: 'feed-handler-coinbase'
          exchange: 'coinbase'
          tier: 'ingestion'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Rust capture tier (v3 Phase C) — metrics-exporter-prometheus on port 8082,
  # same port as the Kotlin handlers above since the two run against different
  # containers during the parallel run. See
  # docs/plans/2026-08-26-v3-quant-research-platform/002-phase-c-rust-capture.md.
  #
  # NO `exchange:` target label here, unlike the Kotlin jobs above. The capture
  # binary emits its own `exchange` label on every series, and with the default
  # `honor_labels: false` a target label of the same name wins and the sample's
  # own is renamed `exported_exchange` — so every capture series carried both,
  # while `k2_capture_build_info` (which the binary emits without `exchange`)
  # carried only the target one. Two label sets for one concept. Dropping the
  # target label is the fix rather than `honor_labels: true`, which would leave
  # `up` — a synthetic series with no sample labels to honour — without an
  # exchange either way, and would let a venue's own metrics rewrite `job` and
  # break CaptureDown. Alerts on capture series get `exchange` from the binary;
  # alerts on `up` identify the venue by `job`.
  - job_name: 'capture-binance'
    static_configs:
      - targets: ['capture-binance:8082']
        labels:
          service: 'capture-binance'
          tier: 'ingestion'
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'capture-kraken'
    static_configs:
      - targets: ['capture-kraken:8082']
        labels:
          service: 'capture-kraken'
          tier: 'ingestion'
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'capture-coinbase'
    static_configs:
      - targets: ['capture-coinbase:8082']
        labels:
          service: 'capture-coinbase'
          tier: 'ingestion'
    metrics_path: '/metrics'
    scrape_interval: 15s
