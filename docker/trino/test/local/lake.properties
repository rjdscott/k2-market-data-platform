# make test-trino only: an Iceberg catalog on a local file metastore, read-only
# at the connector like etc/catalog/lake.properties, over the same tables as
# marts.properties here. TESTING_FILE_METASTORE is Trino's own test catalog type.
connector.name=iceberg
iceberg.catalog.type=TESTING_FILE_METASTORE
hive.metastore.catalog.dir=local:///
fs.native-local.enabled=true
local.location=/data/trino
iceberg.security=read_only
