connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
# Its own warehouse on the lake's bucket, key prefix warehouse/marts
# (docker/lake/init-lake.sh): the one place Trino writes (ADR-035).
iceberg.rest-catalog.warehouse=marts
iceberg.rest-catalog.vended-credentials-enabled=false
# Lakekeeper picks the location (<warehouse>/<table uuid>), as it does for Spark.
# Without it Trino writes <warehouse>/<table name>-<random>.
iceberg.rest-catalog.server-assigned-table-location-enabled=true
# Off by default in 484; pinned because either would let a writer attach files
# that live outside warehouse/marts to a marts table. Probed on k2-trino
# 2026-11-25: `add_files procedure is disabled` (docker/trino/README.md).
iceberg.register-table-procedure.enabled=false
iceberg.add-files-procedure.enabled=false
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=local-01
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
