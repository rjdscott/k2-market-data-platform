connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=k2
# Read-only at the connector: no commit of any kind, ALTER TABLE ... EXECUTE
# included, which Trino's file-based rules do not cover (README, ADR-035).
# Spark is the lake's only writer; Trino writes in catalog `marts`.
iceberg.security=read_only
# Static MinIO keys below; Lakekeeper's warehouse has sts-enabled false and vends nothing.
iceberg.rest-catalog.vended-credentials-enabled=false
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=local-01
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
