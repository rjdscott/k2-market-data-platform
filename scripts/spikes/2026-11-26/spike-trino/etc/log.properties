# Trino logs every catalog property at start, one INFO line each, under the
# logger io.trino.bootstrap.catalog.<catalog>, and masks only the properties its
# connector marks security-sensitive: s3.aws-secret-key is one, s3.aws-access-key
# is not. With the key resolved from ${ENV:MINIO_ROOT_USER}, `docker logs k2-trino`
# held the access key on one line per catalog per start (2026-11-26, 12 lines).
# WARN on the parent logger silences those lines for every catalog; a property
# Trino refuses still fails the start with an error. make test-trino starts etc/
# with a canary key and fails if the log prints it.
io.trino.bootstrap.catalog=WARN
