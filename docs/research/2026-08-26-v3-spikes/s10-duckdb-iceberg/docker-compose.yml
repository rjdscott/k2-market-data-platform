name: k2spikelake

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    ports: ["15433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["19000:9000", "19001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 3s
      retries: 30

  mc:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "mc alias set k2 http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing k2/k2-lake && mc ls k2"

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.3
    command: ["migrate"]
    depends_on:
      postgres: {condition: service_healthy}
    environment: &lk_env
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper@postgres:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: k2-spike-encryption-key
      LAKEKEEPER__BASE_URI: http://lakekeeper:8181
      RUST_LOG: info

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.3
    command: ["serve"]
    depends_on:
      lakekeeper-migrate: {condition: service_completed_successfully}
    environment: *lk_env
    ports: ["18181:8181"]

  spark:
    image: tabulario/spark-iceberg:3.5.5_1.8.1
    depends_on:
      lakekeeper: {condition: service_started}
    entrypoint: ["sleep", "infinity"]

volumes:
  pgdata:
  miniodata:
